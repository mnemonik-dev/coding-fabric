---
- name: Assert required secrets are provided
  ansible.builtin.assert:
    that:
      - vaultwarden_admin_token is defined
      - vaultwarden_admin_token | length >= 32
      - vaultwarden_initial_admin_password is defined
      - vaultwarden_initial_admin_password | length >= 12
    fail_msg: 'vaultwarden role requires VAULTWARDEN_ADMIN_TOKEN and VAULTWARDEN_INITIAL_ADMIN_PASSWORD from sops. See README.md.'
    quiet: true
  no_log: true

- name: Assert tailscale_ip fact is available
  ansible.builtin.assert:
    that:
      - tailscale_ip is defined
      - tailscale_ip | length > 0
    fail_msg: 'tailscale_ip fact not set. Ensure tailscale role is applied before vaultwarden.'
    quiet: true

- name: Install Docker and Docker Compose plugin
  become: true
  block:
    - name: Check if Docker is installed
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      failed_when: false

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        id: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
        state: present
      when: docker_version.rc != 0

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      when: docker_version.rc != 0

    - name: Install Docker and Docker Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: true
      when: docker_version.rc != 0
      register: docker_install
      changed_when: docker_install.changed

    - name: Ensure Docker daemon is started and enabled
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
        daemon_reload: true

    - name: Add op user to docker group
      ansible.builtin.user:
        name: op
        groups: docker
        append: true
      register: docker_group_add

    - name: Reset ssh connection to pick up new group
      ansible.builtin.meta: reset_connection
      when: docker_group_add is changed

- name: Create Vaultwarden directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: op
    group: op
    mode: '0700'
  loop:
    - /opt/vaultwarden
    - /opt/vaultwarden/data

- name: Generate docker-compose.yml from template
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/vaultwarden/docker-compose.yml
    owner: op
    group: op
    mode: '0600'
  register: compose_template
  notify: Restart vaultwarden

- name: Generate Caddyfile from template
  become: true
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/vaultwarden/Caddyfile
    owner: op
    group: op
    mode: '0644'
  register: caddyfile_template
  notify: Reload caddy

- name: Create environment file for Vaultwarden
  become: true
  ansible.builtin.template:
    src: vaultwarden.env.j2
    dest: /opt/vaultwarden/.env
    owner: op
    group: op
    mode: '0600'
  register: env_file
  no_log: true
  notify: Restart vaultwarden

- name: Run docker compose to start stack
  community.docker.docker_compose_v2:
    project_src: /opt/vaultwarden
    state: present
    pull: missing
  environment:
    COMPOSE_PROJECT_NAME: vaultwarden
  become: true
  become_user: op
  register: compose_result
  no_log: true

- name: Wait for Vaultwarden API to be healthy
  ansible.builtin.uri:
    url: "https://{{ vaultwarden_tailnet_domain }}/api/health"
    method: GET
    status_code: 200
    validate_certs: false
  register: health_result
  until: health_result.status == 200
  retries: 60
  delay: 1
  timeout: 60
  changed_when: false
  failed_when: false

- name: Fail if health check exceeded timeout
  ansible.builtin.fail:
    msg: "Vaultwarden health check failed after 60 seconds. Check docker logs: docker compose -f /opt/vaultwarden/docker-compose.yml logs"
  when: health_result.failed

- name: Mark admin as seeded (first run only)
  become: true
  become_user: op
  ansible.builtin.file:
    path: /opt/vaultwarden/.admin-seeded
    state: touch
    mode: '0600'
  when: vaultwarden_initial_admin_password is defined and vaultwarden_initial_admin_password | length > 0

- name: Verify Vaultwarden and Caddy containers are running
  ansible.builtin.shell: |
    docker ps --filter "label=com.docker.compose.service=vaultwarden" --format "{{.Names}}"
    docker ps --filter "label=com.docker.compose.service=caddy" --format "{{.Names}}"
  register: container_check
  failed_when: container_check.stdout_lines|length < 2
  changed_when: false
