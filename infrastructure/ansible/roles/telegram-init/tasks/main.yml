---
- name: Load secrets from sops
  block:
    - name: Decrypt sops secrets
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../secrets/secrets.sops.yml"
      register: sops_file
      no_log: true

    - name: Set bot token and chat ID from secrets
      ansible.builtin.set_fact:
        telegram_bot_token: "{{ sops_file.content | b64decode | from_yaml | selectattr('name', 'equalto', 'telegram_bot_token') | map(attribute='value') | first }}"
        telegram_forum_chat_id: "{{ sops_file.content | b64decode | from_yaml | selectattr('name', 'equalto', 'telegram_forum_chat_id') | map(attribute='value') | first }}"
      no_log: true
  rescue:
    - name: Fallback to environment variables for testing
      ansible.builtin.set_fact:
        telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN', default='') }}"
        telegram_forum_chat_id: "{{ lookup('env', 'TELEGRAM_FORUM_CHAT_ID', default='') }}"
      no_log: true

- name: Validate secrets are present
  ansible.builtin.fail:
    msg: "TELEGRAM_BOT_TOKEN or TELEGRAM_FORUM_CHAT_ID not found in secrets or environment"
  when: telegram_bot_token == '' or telegram_forum_chat_id == ''

- name: Verify bot is admin in the chat
  block:
    - name: Get chat administrators
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_bot_token }}/getChatAdministrators"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram_forum_chat_id }}"
        status_code: 200
        timeout: 10
      register: chat_admins_response
      retries: 3
      delay: 2
      until: chat_admins_response.status == 200
      no_log: true

    - name: Check if bot is admin
      ansible.builtin.set_fact:
        bot_is_admin: "{{ chat_admins_response.json.result | selectattr('user.is_bot', 'equalto', true) | length > 0 }}"
      no_log: true

    - name: Fail if bot is not admin
      ansible.builtin.fail:
        msg: |
          Bot is not an administrator in the chat.
          Actions required (see bootstrap-checklist.md):
          1. Add bot to the forum supergroup
          2. Promote bot to administrator with "Manage topics" permission
          3. Ensure supergroup has forum mode enabled
          chat_id: {{ telegram_forum_chat_id }}
      when: not bot_is_admin

- name: Get forum topics sticker icons (for optional icon colors)
  block:
    - name: Fetch forum topic icon stickers
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_bot_token }}/getForumTopicIconStickers"
        method: POST
        body_format: json
        status_code: 200
        timeout: 10
      register: icon_stickers_response
      retries: 3
      delay: 2
      until: icon_stickers_response.status == 200
      no_log: true

    - name: Store available icon colors
      ansible.builtin.set_fact:
        available_icon_colors: "{{ icon_stickers_response.json.result | map(attribute='custom_emoji_id') | list }}"
      no_log: true
  rescue:
    - name: Continue without icon colors if fetch fails
      ansible.builtin.set_fact:
        available_icon_colors: []

- name: Get existing forum topics (paginated)
  block:
    - name: Initialize topic mapping
      ansible.builtin.set_fact:
        existing_topics: {}
        topics_offset: 0
        has_more_topics: true

    - name: Fetch forum topics with pagination
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_bot_token }}/getForumTopics"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram_forum_chat_id }}"
          offset: "{{ topics_offset }}"
          limit: 100
        status_code: 200
        timeout: 10
      register: forum_topics_response
      retries: 3
      delay: 2
      until: forum_topics_response.status == 200
      no_log: true

    - name: Build topic name to ID mapping
      ansible.builtin.set_fact:
        existing_topics: "{{ existing_topics | combine({item.name: item.message_thread_id}) }}"
      loop: "{{ forum_topics_response.json.result }}"
      no_log: true

    - name: Check for pagination
      ansible.builtin.set_fact:
        topics_offset: "{{ forum_topics_response.json.result[-1].message_thread_id }}"
        has_more_topics: "{{ forum_topics_response.json.result | length == 100 }}"
      no_log: true

    - name: Fetch next page if available
      block:
        - name: Fetch next page of forum topics
          ansible.builtin.uri:
            url: "https://api.telegram.org/bot{{ telegram_bot_token }}/getForumTopics"
            method: POST
            body_format: json
            body:
              chat_id: "{{ telegram_forum_chat_id }}"
              offset: "{{ topics_offset }}"
              limit: 100
            status_code: 200
            timeout: 10
          register: forum_topics_next_response
          retries: 3
          delay: 2
          until: forum_topics_next_response.status == 200
          no_log: true

        - name: Add next page topics to mapping
          ansible.builtin.set_fact:
            existing_topics: "{{ existing_topics | combine({item.name: item.message_thread_id}) }}"
          loop: "{{ forum_topics_next_response.json.result }}"
          no_log: true

        - name: Update pagination state
          ansible.builtin.set_fact:
            has_more_topics: "{{ forum_topics_next_response.json.result | length == 100 }}"
      when: has_more_topics | bool

- name: Create canonical topics with icon colors mapping
  block:
    - name: Define canonical topics with icon colors
      ansible.builtin.set_fact:
        canonical_topics:
          core:
            color: 16711680
          mcp:
            color: 255
          wasm:
            color: 65280
          demo-client:
            color: 16711935
          docs:
            color: 65535
          loop:
            color: 16776960
          protocol-qa:
            color: 128
          ops:
            color: 255

    - name: Initialize topic creation results
      ansible.builtin.set_fact:
        telegram_topics: {}

    - name: Create or skip topics
      block:
        - name: Create topic if not exists
          ansible.builtin.uri:
            url: "https://api.telegram.org/bot{{ telegram_bot_token }}/createForumTopic"
            method: POST
            body_format: json
            body:
              chat_id: "{{ telegram_forum_chat_id }}"
              name: "{{ topic_name }}"
              icon_color: "{{ canonical_topics[topic_name].color }}"
            status_code: 200
            timeout: 10
          register: create_topic_response
          retries: 3
          delay: 2
          until: create_topic_response.status == 200
          no_log: true
          when: topic_name not in existing_topics

        - name: Add newly created topic to mapping
          ansible.builtin.set_fact:
            telegram_topics: "{{ telegram_topics | combine({topic_name: create_topic_response.json.result.message_thread_id}) }}"
          when: topic_name not in existing_topics
          no_log: true

        - name: Add existing topic to mapping
          ansible.builtin.set_fact:
            telegram_topics: "{{ telegram_topics | combine({topic_name: existing_topics[topic_name]}) }}"
          when: topic_name in existing_topics
          no_log: true

        - name: Sleep between API calls for rate limiting
          ansible.builtin.pause:
            seconds: 0.5
      loop: "{{ canonical_topics.keys() | list }}"
      loop_control:
        loop_var: topic_name

- name: Render inventory file with topic mapping
  block:
    - name: Ensure inventory directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../inventory"
        state: directory
        mode: "0755"

    - name: Render telegram-topics.yml from template
      ansible.builtin.template:
        src: topics.yml.j2
        dest: "{{ playbook_dir }}/../../inventory/telegram-topics.yml"
        mode: "0644"
        owner: root
        group: root
      vars:
        topics_mapping: "{{ telegram_topics }}"

- name: Healthcheck - post test message to ops topic
  block:
    - name: Send test message to ops topic
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_bot_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram_forum_chat_id }}"
          message_thread_id: "{{ telegram_topics['ops'] }}"
          text: "Healthcheck: telegram-init role executing"
        status_code: 200
        timeout: 10
      register: test_message_response
      retries: 3
      delay: 2
      until: test_message_response.status == 200
      no_log: true

    - name: Store message ID for deletion
      ansible.builtin.set_fact:
        test_message_id: "{{ test_message_response.json.result.message_id }}"
      no_log: true

    - name: Wait before deleting test message
      ansible.builtin.pause:
        seconds: 5

    - name: Delete test message
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_bot_token }}/deleteMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram_forum_chat_id }}"
          message_id: "{{ test_message_id }}"
        status_code: 200
        timeout: 10
      retries: 3
      delay: 2
      until: "deleteMessage_response.status == 200 or deleteMessage_response.status == 400"
      register: deleteMessage_response
      no_log: true
  rescue:
    - name: Log healthcheck failure (non-fatal)
      ansible.builtin.debug:
        msg: "Healthcheck message send/delete failed, but role continues"

- name: Log completion
  ansible.builtin.debug:
    msg: |
      telegram-init role completed successfully.
      Created/verified {{ telegram_topics | length }} topics.
      Topics mapping saved to: infrastructure/ansible/inventory/telegram-topics.yml
