---
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Install python3
      ansible.builtin.raw: apt-get update && apt-get install -y python3
      changed_when: false

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - systemd
          - sudo
        state: present
        update_cache: true

    - name: Create op service group
      ansible.builtin.group:
        name: op
        state: present

    - name: Create op service user
      ansible.builtin.user:
        name: op
        group: op
        home: /var/lib/mnemonic-mcp
        shell: /usr/sbin/nologin
        system: true
        createhome: true
        state: present
