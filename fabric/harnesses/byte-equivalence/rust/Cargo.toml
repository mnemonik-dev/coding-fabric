[package]
name = "mnemonic-serializer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
serde_json = "1.0"
hex = "0.4"

[lib]
name = "mnemonic_serializer"
path = "src/lib.rs"

[[bin]]
name = "serializer"
path = "src/bin/serializer.rs"
