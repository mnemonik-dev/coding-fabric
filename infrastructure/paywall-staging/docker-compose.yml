# Isolated staging stack for Mnemonic's paid on-chain anchoring.
#
# This is intentionally separate from /opt/mnemonik-server and never shares
# its state volumes or production environment. The VM operator installs this
# file at /opt/universal-paywall-staging/docker-compose.yml and a mode-0600
# .env file beside it via the controlled Ansible/secrets path.
#
# Run only through .github/workflows/deploy-paywall-staging.yml:
#   docker compose --env-file .env -p universal-paywall-staging up -d

services:
  approval-ui-assets:
    image: ${APPROVAL_UI_IMAGE:?set APPROVAL_UI_IMAGE to an immutable GHCR image reference}
    restart: 'no'
    volumes:
      - approval-ui-assets:/approval-ui

  mcp:
    image: ${MCP_IMAGE:?set MCP_IMAGE to an immutable GHCR image reference}
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
      DATABASE_PATH: /data/attestations.db
      MNEMONIC_KEYPAIR_PATH: /keypair/id.json
      MNEMONIC_APPROVAL_UI_DIST: /approval-ui
    depends_on:
      approval-ui-assets:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${MCP_PORT:-3001}:3000'
    volumes:
      - mcp-staging-data:/data
      # Rendered from SOPS by the Ansible role. A split deployment can mount
      # the same protected key material on its own MCP host.
      - ./secrets/mnemonic-id.json:/keypair/id.json:ro
      - approval-ui-assets:/approval-ui:ro
    networks:
      default:
      caddy:
        aliases:
          - mnemonik-paywall-staging
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/health >/dev/null']
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5

  facilitator:
    image: ${FACILITATOR_IMAGE:?set FACILITATOR_IMAGE to an immutable GHCR image reference}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8403
      # Phase 1 safety invariant. The image also refuses to boot without it.
      EXACT_PAYMENTS_ENABLED: '1'
      PAYMENT_STORE_PATH: /data/payments.json
      RECEIPT_PRIVATE_KEY_FILE: /run/secrets/receipt-private-key.pem
    ports:
      # The co-located reference topology exposes only loopback. A remote MCP
      # uses UNIVERSAL_PAYWALL_URL from its SOPS-rendered environment instead
      # of this port; no Docker-network location is embedded in its code.
      - '127.0.0.1:${FACILITATOR_PORT:-8403}:8403'
    volumes:
      - facilitator-payment-store:/data
      # Provision this file as uid 10001 (the non-root `paywall` user in the
      # image), mode 0600. A root-owned 0600 bind mount would make the secret
      # unreadable to the service and correctly prevent it from starting.
      - ./secrets/receipt-private-key.pem:/run/secrets/receipt-private-key.pem:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\u0027http://127.0.0.1:8403/health\u0027).then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

volumes:
  facilitator-payment-store:
  approval-ui-assets:
  mcp-staging-data:

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK_NAME:-vaultwarden_vaultwarden}
