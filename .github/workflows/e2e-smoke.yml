name: e2e-smoke

# 2026-05 scope change: the 5-node Mnemonic attestation DAG verification has
# been DESCOPED — the local Mnemonic MCP server is not yet production-ready
# (backlog feature: mnemonic-attestation-integration). Success criterion is now:
#   1. smoke.sh end-to-end run on VM
#   2. PR merge SHA captured + verified
#   3. workspace-manager reports zero active worktrees (clean cleanup)
# DAG poll + Mnemonic sign-memory step are guarded behind the `mnemonic_mcp_enabled`
# input (default false). Flip to true once the MCP server reaches v1.0+.

on:
  workflow_call:
    inputs:
      vm_hostname:
        description: 'Tailscale VM hostname (default: mnemonic-fabric)'
        type: string
        default: 'mnemonic-fabric'
      feature_name:
        description: 'Feature name for AVP tracking (e.g., docs-typo-fix)'
        type: string
        required: true
      mnemonic_mcp_enabled:
        description: 'Run Mnemonic MCP DAG verification + attestation signing (default: false; descoped 2026-05)'
        type: boolean
        default: false
      merge_sha:
        description: 'Optional: PR merge SHA expected from smoke run (verified if provided)'
        type: string
        default: ''
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID:
        required: true
      TAILSCALE_OAUTH_SECRET:
        required: true
      TELEGRAM_OPS_BOT_TOKEN:
        required: false
      TELEGRAM_OPS_CHAT_ID:
        required: false
      TELEGRAM_OPS_THREAD_ID:
        required: false

  workflow_dispatch:
    inputs:
      vm_hostname:
        description: 'Tailscale VM hostname (default: mnemonic-fabric)'
        type: string
        default: 'mnemonic-fabric'
      feature_name:
        description: 'Feature name for AVP tracking (e.g., docs-typo-fix)'
        type: string
        required: true
      mnemonic_mcp_enabled:
        description: 'Run Mnemonic MCP DAG verification + attestation signing (default: false; descoped 2026-05)'
        type: boolean
        default: false
      merge_sha:
        description: 'Optional: PR merge SHA expected from smoke run (verified if provided)'
        type: string
        default: ''

permissions:
  # contents: write required for github.rest.repos.createCommitComment (success-path reporting)
  contents: write
  # pull-requests: write not needed for createCommitComment, but kept for potential future PR comments
  pull-requests: write

concurrency:
  group: e2e-smoke-${{ inputs.feature_name }}
  cancel-in-progress: false

env:
  E2E_TIMEOUT_MINUTES: 30
  DAG_POLL_MAX_MINUTES: 20
  TAILSCALE_TAG: tag:ci-e2e

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Total timeout: 5 (tailscale) + 5 (ping) + 5 (scp) + 10 (smoke) + 5 (PR+worktree verify)
    # = 30 min. Optional DAG poll adds up to 20 min when MCP gating flips on (35 total).
    timeout-minutes: 35
    steps:
      - name: Validate feature_name input (script-injection guard)
        env:
          FEATURE_NAME: ${{ inputs.feature_name }}
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
          MERGE_SHA_INPUT: ${{ inputs.merge_sha }}
        run: |
          # Strict allow-list: lowercase letters, digits, hyphen; 1-64 chars.
          # Mitigates GH Actions script-injection of feature_name into shell/SSH/JS contexts.
          if ! [[ "$FEATURE_NAME" =~ ^[a-z0-9-]{1,64}$ ]]; then
            echo "ERROR: feature_name must match ^[a-z0-9-]{1,64}\$ (got: <redacted-input>)"
            exit 1
          fi
          # vm_hostname is operator-supplied via workflow_dispatch; constrain to DNS-safe charset.
          if ! [[ "$VM_HOSTNAME" =~ ^[A-Za-z0-9.-]{1,253}$ ]]; then
            echo "ERROR: vm_hostname must be DNS-safe"
            exit 1
          fi
          # merge_sha (optional) must be a hex string if provided.
          if [[ -n "$MERGE_SHA_INPUT" ]] && ! [[ "$MERGE_SHA_INPUT" =~ ^[A-Fa-f0-9]{7,40}$ ]]; then
            echo "ERROR: merge_sha must be a hex git SHA (7-40 chars)"
            exit 1
          fi
          echo "inputs validated"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Tailscale up (ephemeral)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ env.TAILSCALE_TAG }}

      - name: Validate Tailscale connectivity
        timeout-minutes: 5
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Checking Tailscale status..."
          tailscale status

          echo "Verifying VM is reachable..."
          if ! tailscale ping -c 1 "$VM_HOSTNAME" > /dev/null 2>&1; then
            echo "ERROR: Cannot ping $VM_HOSTNAME"
            exit 1
          fi
          echo "VM connectivity verified"

      - name: Copy smoke.sh to VM
        timeout-minutes: 5
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          # smoke.sh is deployed by fabric-services Ansible role to /usr/local/bin/fabric-smoke.sh
          # However, we copy per-run to ensure CI-tested version runs (prevents stale deploy drift)
          if ! scp -o StrictHostKeyChecking=no \
            scripts/e2e/smoke.sh \
            "op@${VM_HOSTNAME}:/tmp/smoke.sh"; then
            echo "ERROR: Failed to copy smoke.sh to VM"
            exit 1
          fi
          echo "smoke.sh copied successfully"

      - name: Run smoke test on VM
        id: smoke
        timeout-minutes: 10
        env:
          FEATURE_NAME: ${{ inputs.feature_name }}
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Starting smoke test with feature_name=$FEATURE_NAME"

          # feature_name is regex-validated upstream to ^[a-z0-9-]{1,64}$, so the remote
          # single-quoted argv is safe (no quotes / shell metas possible).
          if ! tailscale ssh "op@${VM_HOSTNAME}" \
            "bash /tmp/smoke.sh '${FEATURE_NAME}'"; then
            echo "ERROR: smoke.sh failed"
            exit 1
          fi
          echo "Smoke test completed"

      - name: Verify docs PR merge SHA (if provided)
        id: pr-merge
        if: inputs.merge_sha != ''
        timeout-minutes: 5
        env:
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          echo "Verifying docs PR merge SHA: $MERGE_SHA"

          # Confirm the merge SHA exists in the repository's history. Using the
          # GitHub API avoids a full fetch on CI and keeps the check cheap.
          if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}" \
              --jq '.sha' > /tmp/sha-check.out 2>/tmp/sha-check.err; then
            echo "ERROR: merge SHA not found in remote repository"
            cat /tmp/sha-check.err
            exit 1
          fi

          RESOLVED=$(cat /tmp/sha-check.out)
          echo "Merge SHA resolved: $RESOLVED"
          echo "resolved_sha=$RESOLVED" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify worktree cleanup via workspace-manager API
        id: worktree-cleanup
        timeout-minutes: 5
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Verifying worktree cleanup via workspace-manager HTTP API..."

          # workspace-manager binds to 127.0.0.1:8080 on the VM; we tunnel via
          # tailscale ssh and curl the /worktrees endpoint. Success criterion:
          # zero active worktrees after smoke run completes.
          WORKTREES_JSON=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "curl -fsS http://127.0.0.1:8080/worktrees" 2>&1 || echo "FAILED")

          if [ "$WORKTREES_JSON" = "FAILED" ]; then
            echo "ERROR: workspace-manager /worktrees endpoint unreachable"
            exit 1
          fi

          echo "Response: $WORKTREES_JSON"
          # `jq 'length == 0'` returns boolean; -e exits non-zero on false/null.
          if ! echo "$WORKTREES_JSON" | jq -e 'length == 0' > /dev/null; then
            COUNT=$(echo "$WORKTREES_JSON" | jq 'length' 2>/dev/null || echo "?")
            echo "ERROR: expected zero active worktrees after smoke; got $COUNT"
            echo "$WORKTREES_JSON" | jq '.' || true
            exit 1
          fi

          echo "Worktree cleanup verified (0 active)"

      - name: '[Optional] Poll Mnemonic MCP for 5-node DAG (mnemonic_mcp_enabled)'
        id: dag-poll
        # DESCOPED 2026-05: gated behind opt-in input. Default false. Will be
        # re-enabled by the backlog feature `mnemonic-attestation-integration`
        # once the Mnemonic MCP server is production-ready.
        if: inputs.mnemonic_mcp_enabled
        timeout-minutes: 20
        env:
          FEATURE_NAME: ${{ inputs.feature_name }}
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
          DAG_POLL_MAX_MINUTES: ${{ env.DAG_POLL_MAX_MINUTES }}
        run: |
          echo "Polling for 5-node DAG (max ${DAG_POLL_MAX_MINUTES} minutes)..."

          MAX_POLLS=$((DAG_POLL_MAX_MINUTES * 2))
          POLL_INTERVAL=30
          POLL_COUNT=0
          DAG_FOUND=false

          while [ $POLL_COUNT -lt $MAX_POLLS ]; do
            echo "Poll #$((POLL_COUNT + 1))/$MAX_POLLS (${POLL_COUNT}*30s elapsed)..."

            DAG_OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
              "mnemonic_recall --feature='${FEATURE_NAME}' --json 2>/dev/null" || echo "")

            if [ -z "$DAG_OUTPUT" ]; then
              echo "  - No DAG yet, waiting..."
              POLL_COUNT=$((POLL_COUNT + 1))
              sleep $POLL_INTERVAL
              continue
            fi

            # Count nodes: parse JSON and look for 5 nodes with parent chain
            NODE_COUNT=$(echo "$DAG_OUTPUT" | jq -r '.[] | select(.parent != null) | .id' 2>/dev/null | wc -l)
            TOTAL_COUNT=$(echo "$DAG_OUTPUT" | jq -r '.[] | .id' 2>/dev/null | wc -l)

            echo "  - Found $TOTAL_COUNT nodes, $NODE_COUNT with parents"

            if [ "$TOTAL_COUNT" -eq 5 ]; then
              echo "SUCCESS: 5-node DAG detected"
              DAG_FOUND=true
              # Bound output to 65KB to stay within GITHUB_OUTPUT 1MB limit
              DAG_TRUNCATED=${DAG_OUTPUT:0:65535}
              echo "dag_json=$DAG_TRUNCATED" >> "$GITHUB_OUTPUT"
              break
            fi

            POLL_COUNT=$((POLL_COUNT + 1))
            sleep $POLL_INTERVAL
          done

          if [ "$DAG_FOUND" = false ]; then
            echo "ERROR: Timeout waiting for 5-node DAG"
            exit 1
          fi

      - name: '[Optional] Verify DAG structure (mnemonic_mcp_enabled)'
        if: inputs.mnemonic_mcp_enabled
        env:
          FEATURE_NAME: ${{ inputs.feature_name }}
          DAG_JSON: ${{ steps.dag-poll.outputs.dag_json }}
        run: |
          echo "Validating DAG structure..."
          printf '%s' "$DAG_JSON" | jq '.' > /tmp/dag.json

          # Load expected DAG schema (5-node parent chain: user-spec -> tech-spec -> task -> pre-deploy -> deploy)
          cp scripts/e2e/expected-dag.json /tmp/expected-dag.json

          # feature_name passed via --arg so jq treats it as a literal string (no injection).
          if ! jq -e \
            --slurpfile expected /tmp/expected-dag.json \
            --arg feature "$FEATURE_NAME" \
            '
              . as $actual |
              (length == 5) as $len_ok |
              (all(.id != null and .timestamp != null and .feature != null)) as $fields_ok |
              (all(.feature == $feature)) as $feature_ok |
              (
                ($actual[0].parent == null) and
                ($actual[1].parent == $actual[0].id) and
                ($actual[2].parent == $actual[1].id) and
                ($actual[3].parent == $actual[2].id) and
                ($actual[4].parent == $actual[3].id)
              ) as $parent_chain_ok |
              (
                ($actual[0].type == "memory") and
                ($actual[1].type == "memory") and
                ($actual[2].type == "receipt") and
                ($actual[3].type == "receipt") and
                ($actual[4].type == "agent-state")
              ) as $types_ok |
              ($len_ok and $fields_ok and $feature_ok and $parent_chain_ok and $types_ok)
            ' /tmp/dag.json > /dev/null 2>&1; then
            echo "ERROR: DAG structure invalid or parent chain broken"
            echo "Expected structure: user-spec (memory) -> tech-spec (memory) -> task (receipt) -> pre-deploy (receipt) -> deploy (agent-state)"
            echo "Actual DAG:"
            cat /tmp/dag.json
            exit 1
          fi

          echo "DAG structure valid with intact parent chain"
          jq '.' /tmp/dag.json

      - name: '[Optional] Sign smoke run via Mnemonic MCP (mnemonic_mcp_enabled)'
        id: sign-smoke
        if: success() && inputs.mnemonic_mcp_enabled
        env:
          FEATURE_NAME: ${{ inputs.feature_name }}
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Signing smoke run attestation..."

          ATTESTATION=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "mnemonic_sign_memory --feature='${FEATURE_NAME}' --phase=e2e-smoke-pass --type=agent.state 2>/dev/null" || echo "")

          if [ -z "$ATTESTATION" ]; then
            echo "WARNING: Could not reach Mnemonic MCP for attestation (MCP may be temporarily unavailable)"
            echo "attestation_id=unavailable" >> "$GITHUB_OUTPUT"
          else
            ATTESTATION_ID=$(echo "$ATTESTATION" | jq -r '.attestation_id // "unknown"' 2>/dev/null)
            echo "Attestation signed: $ATTESTATION_ID"
            echo "attestation_id=$ATTESTATION_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on commit (success)
        if: success()
        uses: actions/github-script@v7
        env:
          FEATURE_NAME: ${{ inputs.feature_name }}
          ATTESTATION_ID: ${{ steps.sign-smoke.outputs.attestation_id }}
          MCP_ENABLED: ${{ inputs.mnemonic_mcp_enabled }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        with:
          script: |
            // Read inputs from process.env (safe) rather than ${{ }} template literals
            // to avoid GH Actions JS injection if feature_name contained quotes.
            const feature = process.env.FEATURE_NAME;
            const attestationId = process.env.ATTESTATION_ID || 'unavailable';
            const mcpEnabled = process.env.MCP_ENABLED === 'true';
            const mergeSha = process.env.MERGE_SHA || 'n/a';
            const attLine = mcpEnabled
              ? `Attestation: ${attestationId}`
              : 'Attestation: skipped (mnemonic-mcp descoped — see backlog feature mnemonic-attestation-integration)';
            const dagLine = mcpEnabled
              ? '5-node DAG verified, worktree cleanup confirmed.'
              : 'Worktree cleanup confirmed (DAG verification descoped).';
            const comment = `e2e-smoke PASSED\n\nFeature: ${feature}\nMerge SHA: ${mergeSha}\n${dagLine}\n${attLine}`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: comment
            });

      - name: Report failure to ops
        if: failure()
        env:
          FEATURE_NAME: ${{ inputs.feature_name }}
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
          RUN_ID: ${{ github.run_id }}
          TG_TOKEN: ${{ secrets.TELEGRAM_OPS_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TELEGRAM_OPS_THREAD_ID }}
        run: |
          if [ -z "${TG_TOKEN}" ]; then
            echo "TELEGRAM_OPS_BOT_TOKEN not configured, skipping ops notification"
            exit 0
          fi

          # Collect last 50 lines of diagnostic via SSH
          DIAGNOSTIC=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "journalctl -u smoke-test -n 50 2>/dev/null || tail -50 /tmp/smoke-test.log 2>/dev/null" || echo "No diagnostic log available")

          # Sanitize secrets: strip sk-* (OpenAI keys), api_* (Anthropic), base58 keys (43-44 chars), and JWK fragments
          SANITIZED=$(echo "$DIAGNOSTIC" | \
            sed 's/sk-[A-Za-z0-9_-]*/sk-***REDACTED***/g' | \
            sed 's/api_[A-Za-z0-9_-]*/api_***REDACTED***/g' | \
            sed 's/ANTHROPIC_API_KEY=[^ ]*/ANTHROPIC_API_KEY=***REDACTED***/g' | \
            sed 's/"k":[[:space:]]*"[A-Za-z0-9+/=]*"/"k":"***REDACTED***/g' | \
            sed 's/"d":[[:space:]]*"[A-Za-z0-9+/=]*"/"d":"***REDACTED***/g')

          # Build Telegram message with diagnostics (truncate to 1000 chars for readability)
          DIAG_PREVIEW="${SANITIZED:0:1000}"
          TEXT="e2e-smoke FAILED on feature=${FEATURE_NAME}%0Arun=${RUN_ID}%0Alast 50 lines: %0A${DIAG_PREVIEW}"

          # Token kept in env var TG_URL only; never on curl argv where it would be visible
          # via /proc/<pid>/cmdline. Env-vars are isolated to the process via /proc/<pid>/environ
          # (readable only by same UID).
          TG_URL="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          curl -s -X POST "$TG_URL" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "message_thread_id=${TG_THREAD_ID}" \
            -d "text=$TEXT" \
            -d "parse_mode=Markdown" \
            --output /tmp/telegram-response.json

          # Check response for success
          if jq -e '.ok' /tmp/telegram-response.json > /dev/null 2>&1; then
            echo "Ops notification sent to Telegram"
          else
            echo "WARNING: Telegram notification failed (ops notification not critical)"
            jq '.' /tmp/telegram-response.json || true
          fi

      - name: Tailscale logout
        if: always()
        run: |
          echo "Logging out of Tailscale..."
          tailscale logout || true
          echo "Cleanup complete"
