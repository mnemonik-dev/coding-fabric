---
- name: Reload mnemonic-mcp systemd
  ansible.builtin.systemd:
    daemon_reload: true
  listen: reload mnemonic-mcp systemd

- name: Restart mnemonic-mcp service
  ansible.builtin.systemd:
    name: "{{ mnemonic_mcp_systemd_unit }}"
    state: restarted
    enabled: true
  listen: restart mnemonic-mcp service
