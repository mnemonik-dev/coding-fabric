---
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - build-essential
          - python3
          - python3-pip
        state: present
      when: ansible_os_family == "Debian"

    - name: Ensure systemd is running
      ansible.builtin.systemd_service:
        name: systemd-logind
        state: started
        enabled: yes

    - name: Create op user (base role requirement)
      ansible.builtin.user:
        name: op
        shell: /bin/bash
        createhome: yes
        state: present

    - name: Add op user to sudo group
      ansible.builtin.user:
        name: op
        groups: sudo
        append: yes

    - name: Create inventory directory for converge
      ansible.builtin.file:
        path: "{{ playbook_dir }}/inventory"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true
