---
# Vaultwarden deployment configuration
# All variables are prefixed with vaultwarden_

# Docker image tags
vaultwarden_image: "vaultwarden/server:1.32.0"
vaultwarden_caddy_image: "caddy:2.9.1"

# Network binding (from tailscale role fact)
# WARNING: Must be bound to {{ tailscale_ip }}, never to 0.0.0.0
# This variable is expected to be set by the tailscale role
vaultwarden_tailnet_domain: "vault.mnemonic-fabric.ts"

# Data directory
vaultwarden_data_dir: "/opt/vaultwarden/data"

# Ports (internal to tailnet only)
vaultwarden_https_port: 8443

# CRITICAL: These secrets MUST be provided by the playbook via sops decryption
# They are NOT defined here; role will fail clearly if missing.
# Playbook should decrypt from infrastructure/secrets/secrets.sops.yml and pass:
# - vaultwarden_initial_admin_password
# - vaultwarden_admin_token
#
# Example from sops (encrypted at rest in git):
#   VAULTWARDEN_INITIAL_ADMIN_PASSWORD: "..."
#   VAULTWARDEN_ADMIN_TOKEN: "..."
#
# The playbook (Task 24 deploy.yml) decrypts these before invoking this role.

# Vaultwarden configuration
vaultwarden_config:
  DOMAIN: "https://{{ vaultwarden_tailnet_domain }}"
  LOG_LEVEL: "info"
  EXTENDED_LOGGING: "true"
  LOG_FILE: "/data/vaultwarden.log"

# Caddy configuration
caddy_log_level: "info"

# Docker Compose settings
compose_project_name: "vaultwarden"
