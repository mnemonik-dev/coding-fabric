name: e2e-smoke

on:
  workflow_call:
    inputs:
      vm_hostname:
        description: 'Tailscale VM hostname (default: mnemonic-fabric)'
        type: string
        default: 'mnemonic-fabric'
      feature_name:
        description: 'Feature name for AVP tracking (e.g., docs-typo-fix)'
        type: string
        required: true
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID:
        required: true
      TAILSCALE_OAUTH_SECRET:
        required: true
      TELEGRAM_OPS_BOT_TOKEN:
        required: false

  workflow_dispatch:
    inputs:
      vm_hostname:
        description: 'Tailscale VM hostname (default: mnemonic-fabric)'
        type: string
        default: 'mnemonic-fabric'
      feature_name:
        description: 'Feature name for AVP tracking (e.g., docs-typo-fix)'
        type: string
        required: true

permissions:
  # contents: write required for github.rest.repos.createCommitComment (success-path reporting)
  contents: write
  # pull-requests: write not needed for createCommitComment, but kept for potential future PR comments
  pull-requests: write

concurrency:
  group: e2e-smoke-${{ inputs.feature_name }}
  cancel-in-progress: false

env:
  E2E_TIMEOUT_MINUTES: 30
  DAG_POLL_MAX_MINUTES: 20
  TAILSCALE_TAG: tag:ci-e2e

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Total timeout: 5 (tailscale) + 5 (ping) + 5 (scp) + 10 (smoke) + 20 (DAG poll) + 5 (verify) = 50 min adjusted to 35 (with cleanup slack)
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Tailscale up (ephemeral)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ env.TAILSCALE_TAG }}

      - name: Validate Tailscale connectivity
        timeout-minutes: 5
        run: |
          echo "Checking Tailscale status..."
          tailscale status

          echo "Verifying VM is reachable..."
          if ! tailscale ping -c 1 "${{ inputs.vm_hostname }}" > /dev/null 2>&1; then
            echo "ERROR: Cannot ping ${{ inputs.vm_hostname }}"
            exit 1
          fi
          echo "VM connectivity verified"

      - name: Copy smoke.sh to VM
        timeout-minutes: 5
        run: |
          # smoke.sh is deployed by fabric-services Ansible role to /usr/local/bin/fabric-smoke.sh
          # However, we copy per-run to ensure CI-tested version runs (prevents stale deploy drift)
          if ! scp -o StrictHostKeyChecking=no \
            scripts/e2e/smoke.sh \
            "op@${{ inputs.vm_hostname }}:/tmp/smoke.sh"; then
            echo "ERROR: Failed to copy smoke.sh to VM"
            exit 1
          fi
          echo "smoke.sh copied successfully"

      - name: Run smoke test on VM
        id: smoke
        timeout-minutes: 10
        run: |
          echo "Starting smoke test with feature_name=${{ inputs.feature_name }}"

          if ! tailscale ssh "op@${{ inputs.vm_hostname }}" \
            "bash /tmp/smoke.sh '${{ inputs.feature_name }}'"; then
            echo "ERROR: smoke.sh failed"
            exit 1
          fi
          echo "Smoke test completed"

      - name: Poll Mnemonic MCP for 5-node DAG
        id: dag-poll
        timeout-minutes: 20
        run: |
          echo "Polling for 5-node DAG (max ${{ env.DAG_POLL_MAX_MINUTES }} minutes)..."

          MAX_POLLS=$((${{ env.DAG_POLL_MAX_MINUTES }} * 2))
          POLL_INTERVAL=30
          POLL_COUNT=0
          DAG_FOUND=false

          while [ $POLL_COUNT -lt $MAX_POLLS ]; do
            echo "Poll #$((POLL_COUNT + 1))/$MAX_POLLS (${POLL_COUNT}*30s elapsed)..."

            DAG_OUTPUT=$(tailscale ssh "op@${{ inputs.vm_hostname }}" \
              "mnemonic_recall --feature='${{ inputs.feature_name }}' --json 2>/dev/null" || echo "")

            if [ -z "$DAG_OUTPUT" ]; then
              echo "  → No DAG yet, waiting..."
              POLL_COUNT=$((POLL_COUNT + 1))
              sleep $POLL_INTERVAL
              continue
            fi

            # Count nodes: parse JSON and look for 5 nodes with parent chain
            NODE_COUNT=$(echo "$DAG_OUTPUT" | jq -r '.[] | select(.parent != null) | .id' 2>/dev/null | wc -l)
            TOTAL_COUNT=$(echo "$DAG_OUTPUT" | jq -r '.[] | .id' 2>/dev/null | wc -l)

            echo "  → Found $TOTAL_COUNT nodes, $NODE_COUNT with parents"

            if [ "$TOTAL_COUNT" -eq 5 ]; then
              echo "SUCCESS: 5-node DAG detected"
              DAG_FOUND=true
              # Bound output to 65KB to stay within GITHUB_OUTPUT 1MB limit
              DAG_TRUNCATED=${DAG_OUTPUT:0:65535}
              echo "dag_json=$DAG_TRUNCATED" >> "$GITHUB_OUTPUT"
              break
            fi

            POLL_COUNT=$((POLL_COUNT + 1))
            sleep $POLL_INTERVAL
          done

          if [ "$DAG_FOUND" = false ]; then
            echo "ERROR: Timeout waiting for 5-node DAG"
            exit 1
          fi

      - name: Verify DAG structure
        run: |
          DAG_JSON='${{ steps.dag-poll.outputs.dag_json }}'

          echo "Validating DAG structure..."
          echo "$DAG_JSON" | jq '.' > /tmp/dag.json

          # Load expected DAG schema (5-node parent chain: user-spec -> tech-spec -> task -> pre-deploy -> deploy)
          cp scripts/e2e/expected-dag.json /tmp/expected-dag.json

          # Verify node count, required fields, parent chain integrity, and feature match
          if ! jq -e \
            --slurpfile expected /tmp/expected-dag.json \
            '
              . as $actual |
              (length == 5) as $len_ok |
              (all(.id != null and .timestamp != null and .feature != null)) as $fields_ok |
              (all(.feature == "'"'"'${{ inputs.feature_name }}'"'"'")) as $feature_ok |
              (
                ($actual[0].parent == null) and
                ($actual[1].parent == $actual[0].id) and
                ($actual[2].parent == $actual[1].id) and
                ($actual[3].parent == $actual[2].id) and
                ($actual[4].parent == $actual[3].id)
              ) as $parent_chain_ok |
              (
                ($actual[0].type == "memory") and
                ($actual[1].type == "memory") and
                ($actual[2].type == "receipt") and
                ($actual[3].type == "receipt") and
                ($actual[4].type == "agent-state")
              ) as $types_ok |
              ($len_ok and $fields_ok and $feature_ok and $parent_chain_ok and $types_ok)
            ' /tmp/dag.json > /dev/null 2>&1; then
            echo "ERROR: DAG structure invalid or parent chain broken"
            echo "Expected structure: user-spec (memory) -> tech-spec (memory) -> task (receipt) -> pre-deploy (receipt) -> deploy (agent-state)"
            echo "Actual DAG:"
            cat /tmp/dag.json
            exit 1
          fi

          echo "DAG structure valid with intact parent chain"
          jq '.' /tmp/dag.json

      - name: Verify worktree cleanup
        run: |
          echo "Verifying worktree cleanup on VM..."

          WORKTREE_COUNT=$(tailscale ssh "op@${{ inputs.vm_hostname }}" \
            "ls -1 ~/code/mnemonic-workspaces 2>/dev/null | wc -l" || echo "0")

          echo "Active worktrees: $WORKTREE_COUNT"

          if [ "$WORKTREE_COUNT" -gt 10 ]; then
            echo "WARNING: Worktree count exceeds capacity (10)"
            exit 1
          fi

      - name: Sign smoke run via Mnemonic MCP
        id: sign-smoke
        if: success()
        run: |
          echo "Signing smoke run attestation..."

          ATTESTATION=$(tailscale ssh "op@${{ inputs.vm_hostname }}" \
            "mnemonic_sign_memory --feature='${{ inputs.feature_name }}' --phase=e2e-smoke-pass --type=agent.state 2>/dev/null" || echo "")

          if [ -z "$ATTESTATION" ]; then
            echo "WARNING: Could not reach Mnemonic MCP for attestation (MCP may be temporarily unavailable)"
            echo "attestation_id=unavailable" >> "$GITHUB_OUTPUT"
          else
            ATTESTATION_ID=$(echo "$ATTESTATION" | jq -r '.attestation_id // "unknown"' 2>/dev/null)
            echo "Attestation signed: $ATTESTATION_ID"
            echo "attestation_id=$ATTESTATION_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on commit (success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const feature = '${{ inputs.feature_name }}';
            const attestationId = process.env.ATTESTATION_ID || 'unavailable';
            const comment = `e2e-smoke PASSED\n\nFeature: ${feature}\n5-node DAG verified, worktree cleanup confirmed.\nAttestation: ${attestationId}`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: comment
            });
        env:
          ATTESTATION_ID: ${{ steps.sign-smoke.outputs.attestation_id }}

      - name: Report failure to ops
        if: failure()
        run: |
          if [ -z "${{ secrets.TELEGRAM_OPS_BOT_TOKEN }}" ]; then
            echo "TELEGRAM_OPS_BOT_TOKEN not configured, skipping ops notification"
            exit 0
          fi

          # Collect last 50 lines of diagnostic via SSH
          DIAGNOSTIC=$(tailscale ssh "op@${{ inputs.vm_hostname }}" \
            "journalctl -u smoke-test -n 50 2>/dev/null || tail -50 /tmp/smoke-test.log 2>/dev/null" || echo "No diagnostic log available")

          # Sanitize secrets: strip sk-* (OpenAI keys), api_* (Anthropic), base58 keys (43-44 chars), and JWK fragments
          SANITIZED=$(echo "$DIAGNOSTIC" | \
            sed 's/sk-[A-Za-z0-9_-]*/sk-***REDACTED***/g' | \
            sed 's/api_[A-Za-z0-9_-]*/api_***REDACTED***/g' | \
            sed 's/ANTHROPIC_API_KEY=[^ ]*/ANTHROPIC_API_KEY=***REDACTED***/g' | \
            sed 's/"k":[[:space:]]*"[A-Za-z0-9+/=]*"/"k":"***REDACTED***/g' | \
            sed 's/"d":[[:space:]]*"[A-Za-z0-9+/=]*"/"d":"***REDACTED***/g')

          # Build Telegram message with diagnostics (truncate to 1000 chars for readability)
          DIAG_PREVIEW="${SANITIZED:0:1000}"
          TEXT="e2e-smoke FAILED on feature=${{ inputs.feature_name }}%0Arun=${{ github.run_id }}%0Alast 50 lines: %0A${DIAG_PREVIEW}"

          # POST to Telegram ops channel
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_OPS_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_OPS_CHAT_ID }}" \
            -d "message_thread_id=${{ secrets.TELEGRAM_OPS_THREAD_ID }}" \
            -d "text=$TEXT" \
            -d "parse_mode=Markdown" \
            --output /tmp/telegram-response.json

          # Check response for success
          if jq -e '.ok' /tmp/telegram-response.json > /dev/null 2>&1; then
            echo "Ops notification sent to Telegram"
          else
            echo "WARNING: Telegram notification failed (ops notification not critical)"
            jq '.' /tmp/telegram-response.json || true
          fi

      - name: Tailscale logout
        if: always()
        run: |
          echo "Logging out of Tailscale..."
          tailscale logout || true
          echo "Cleanup complete"
