---
#
# safe-mode-rollback.yml — incident recovery playbook
# Stops fabric services, reverts mnemonic-loop to last-known-good, restarts services.
# Idempotent; blocks on concurrent execution; posts ops banner on completion.
#
# PREREQUISITES:
#  - sops + age key configured for decrypting infrastructure/ansible/inventory/group_vars/all/secrets.sops.yml
#  - git config user.signingkey set on deployment host (to verify tag signatures)
#  - Ansible collections: community.sops (for encrypted var loading)
#

- name: Safe-mode rollback
  hosts: all
  become: yes
  vars:
    lock_file: /var/lock/fabric-safe-mode
    lock_timeout: 30
    tag_name: last-known-good
    services_to_stop:
      - workspace-manager
      - mnemonic-mcp
      - fabric-watchdog
      - telegram-ai-agent
    # Roles to re-run on rollback (fabric-critical only)
    fabric_roles:
      - fabric-services

  pre_tasks:
    - name: Load sops-encrypted secrets
      community.sops.load_vars:
        file: infrastructure/ansible/inventory/group_vars/all/secrets.sops.yml
        name: sops_vars
      register: sops_load
      no_log: yes

    - name: Verify telegram_bot_token loaded
      fail:
        msg: "telegram_bot_token not found in sops secrets; check sops config and age key"
      when: sops_vars.telegram_bot_token is not defined or sops_vars.telegram_bot_token | length == 0
      no_log: yes

    - name: Set secret vars from sops
      set_fact:
        telegram_bot_token: "{{ sops_vars.telegram_bot_token }}"
        telegram_ops_topic: "{{ sops_vars.telegram_ops_topic }}"
      no_log: yes
    - name: Acquire exclusive lock (prevent concurrent rollback)
      block:
        - name: Check if lock is held
          stat:
            path: "{{ lock_file }}"
          register: lock_stat

        - name: Wait for lock release (up to {{ lock_timeout }}s)
          wait_for:
            path: "{{ lock_file }}"
            state: absent
            timeout: "{{ lock_timeout }}"
          when: lock_stat.stat.exists

        - name: Create lock file
          copy:
            dest: "{{ lock_file }}"
            content: "locked at {{ ansible_date_time.iso8601 }}\n"
      rescue:
        - name: Fail if lock acquisition timed out
          fail:
            msg: "Lock at {{ lock_file }} held for >{{ lock_timeout }}s; aborting"

    - name: Check if mnemonic-loop clone exists
      stat:
        path: "{{ mnemonic_loop_clone_path }}"
      register: loop_clone_stat
      vars:
        mnemonic_loop_clone_path: "/opt/mnemonic-loop"

    - name: Fail if mnemonic-loop clone missing
      fail:
        msg: "mnemonic-loop clone not found at {{ mnemonic_loop_clone_path }}"
      when: not loop_clone_stat.stat.exists

  tasks:
    - name: Stop fabric services
      systemd:
        name: "{{ item }}"
        state: stopped
        daemon_reload: yes
      loop: "{{ services_to_stop }}"
      ignore_errors: yes  # May not all be running

    - name: Wait for services to stop
      pause:
        seconds: 2

    - name: Checkout last-known-good tag in mnemonic-loop
      block:
        - name: Fetch latest tags from remote
          shell:
            cmd: "git fetch --tags origin"
            chdir: "{{ mnemonic_loop_clone_path }}"
          register: fetch_result

        - name: Verify last-known-good tag exists
          shell:
            cmd: "git rev-parse {{ tag_name }}"
            chdir: "{{ mnemonic_loop_clone_path }}"
          register: tag_check
          failed_when: tag_check.rc != 0

        - name: Verify tag signature
          shell:
            cmd: "git verify-tag {{ tag_name }} 2>&1"
            chdir: "{{ mnemonic_loop_clone_path }}"
          register: verify_result
          failed_when: verify_result.rc != 0

        - name: Checkout last-known-good tag
          shell:
            cmd: "git checkout {{ tag_name }}"
            chdir: "{{ mnemonic_loop_clone_path }}"
          register: checkout_result

        - name: Log checkout result
          debug:
            msg: "Checked out {{ tag_name }} at commit {{ checkout_result.stdout }}"
      rescue:
        - name: Sanitize error message for Telegram
          set_fact:
            error_msg: "{{ (ansible_failed_result.msg | default('Unknown error')) | regex_replace('[\"\\\\]', '_') | truncate(200, True, '...') }}"
          no_log: yes

        - name: Post error alert to ops via curl
          # Audit F-004 / F-017: Token kept in TG_TOKEN env var inside curl-host
          # shell.  Previous form Jinja-templated `{{ telegram_bot_token }}` directly
          # into the rendered command line — visible to /proc/<bash_pid>/cmdline
          # before set +x took effect.
          shell:
            cmd: |
              set +x
              TG_URL="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
              curl -s -X POST "$TG_URL" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg msg "SEVERITY: HIGH\n\nCheckout Error\nHost: $ANSIBLE_HOSTNAME\nMessage: $ERROR_MSG" --arg topic "$TG_TOPIC" '{chat_id:$topic, text: $msg}')"
            chdir: "{{ mnemonic_loop_clone_path }}"
          environment:
            ERROR_MSG: "{{ error_msg }}"
            TG_TOKEN: "{{ telegram_bot_token }}"
            TG_TOPIC: "{{ telegram_ops_topic }}"
            ANSIBLE_HOSTNAME: "{{ ansible_hostname }}"
          no_log: yes
          ignore_errors: yes

        - name: Release lock and abort
          block:
            - name: Remove lock file on error
              file:
                path: "{{ lock_file }}"
                state: absent
            - name: Abort rollback
              fail:
                msg: "Failed to checkout {{ tag_name }}; rolled back nothing"

    - name: Re-run deploy.yml for fabric-critical roles only
      block:
        - name: Run Ansible playbook for fabric-services role
          command:
            cmd: >
              ansible-playbook
              -i infrastructure/ansible/inventory/hosts.yml
              --tags fabric-services
              infrastructure/ansible/playbooks/deploy.yml
            chdir: "{{ mnemonic_loop_clone_path }}"
          register: deploy_result

        - name: Log deploy result
          debug:
            msg: "Deploy completed for fabric-services; see logs for details"
      rescue:
        - name: Sanitize deploy error message
          set_fact:
            deploy_error_msg: "{{ (ansible_failed_result.msg | default('Deploy phase failed')) | regex_replace('[\"\\\\]', '_') | truncate(200, True, '...') }}"
          no_log: yes

        - name: Post deploy error alert to ops via curl
          # Audit F-004 / F-017: same env-var pattern as the checkout-error post.
          shell:
            cmd: |
              set +x
              TG_URL="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
              curl -s -X POST "$TG_URL" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg msg "SEVERITY: HIGH\n\nDeploy Error\nHost: $ANSIBLE_HOSTNAME\nMessage: $DEPLOY_ERROR_MSG" --arg topic "$TG_TOPIC" '{chat_id:$topic, text: $msg}')"
          environment:
            DEPLOY_ERROR_MSG: "{{ deploy_error_msg }}"
            TG_TOKEN: "{{ telegram_bot_token }}"
            TG_TOPIC: "{{ telegram_ops_topic }}"
            ANSIBLE_HOSTNAME: "{{ ansible_hostname }}"
          no_log: yes
          ignore_errors: yes

        - name: Release lock and abort
          block:
            - name: Remove lock file on error
              file:
                path: "{{ lock_file }}"
                state: absent
            - name: Abort on deploy failure
              fail:
                msg: "Deploy phase failed; left nothing half-stopped"

    - name: Start fabric services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
        daemon_reload: yes
      loop: "{{ services_to_stop }}"

    - name: Wait for services to stabilize
      pause:
        seconds: 5

    - name: Post ops success banner to Telegram
      block:
        - name: Format success message
          set_fact:
            success_msg: |
              SEVERITY: HIGH

              Safe-mode rollback completed successfully
              Hostname: {{ ansible_hostname | regex_replace('[^a-zA-Z0-9_-]', '_') }}
              Reverted to: {{ tag_name }}
              Timestamp: {{ ansible_date_time.iso8601 }}
              Status: All fabric services restarted
            safe_msg: ""
          no_log: yes

        - name: Post banner via Telegram (JSON-safe encoding)
          # Audit F-004 / F-017: TG_TOKEN env -> TG_URL env -> curl "$TG_URL"
          # so the literal Jinja-rendered token is never on the rendered argv.
          # SUCCESS_MSG is exported via `environment:` below. The previous
          # version used single quotes around `$SUCCESS_MSG` which prevented
          # bash from expanding the variable, sending the literal string
          # `$SUCCESS_MSG` to Telegram instead of the rendered banner.
          shell:
            cmd: |
              set +x
              TG_URL="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
              curl -s -X POST "$TG_URL" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg msg "$SUCCESS_MSG" --arg topic "$TG_TOPIC" '{chat_id:$topic, text: $msg}')"
          environment:
            SUCCESS_MSG: "{{ success_msg }}"
            TG_TOKEN: "{{ telegram_bot_token }}"
            TG_TOPIC: "{{ telegram_ops_topic }}"
          no_log: yes
          ignore_errors: yes
      ignore_errors: yes

  post_tasks:
    - name: Release lock file
      file:
        path: "{{ lock_file }}"
        state: absent
      ignore_errors: yes

    - name: Verify critical services are running
      systemd:
        name: fabric-watchdog
        state: started
      register: watchdog_status

    - name: Report final status
      debug:
        msg: "Rollback complete; watchdog status: {{ watchdog_status.status.ActiveState }}"

  handlers:
    - name: Restart mnemonic-mcp
      systemd:
        name: mnemonic-mcp
        state: restarted
