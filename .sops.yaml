# sops encryption rules for coding-fabric secrets.
# The age public key below pairs with the operator's private key stored in:
#  - ~/.config/sops/age/keys.txt (local laptop)
#  - SOPS_AGE_KEY GitHub Actions secret (CI runtime)
#  - paper backup in fire-safe location (disaster recovery)
#
# To rotate: generate new keypair, add new recipient here AND keep old one
# during transition, re-encrypt secrets.sops.yml (sops re-encrypts under all
# listed recipients), then remove old recipient once CI confirms new key
# works in production.

creation_rules:
  - path_regex: infrastructure/secrets/secrets\.sops\.yml
    key_groups:
      - age:
          - age1wwf8jfxffrqzdd9ntxsry4c3n2rddta036fj5nlu0qhacxmeu52sj3u3yg
