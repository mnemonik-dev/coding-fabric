name: deploy-fabric

on:
  push:
    tags:
      - 'fabric-v*'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform: apply (deploy), plan (dry-run), or rollback'
        type: choice
        options:
          - apply
          - plan
          - rollback
        default: plan

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: deploy-fabric
  cancel-in-progress: false

env:
  TF_VERSION: '1.8.0'
  ANSIBLE_TIMEOUT: 300
  E2E_TIMEOUT_MINUTES: 30

jobs:
  tofu-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_exit_code: ${{ steps.tofu_plan.outputs.exit_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Restore tofu state from previous run (if any)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: tofu-state
          path: infrastructure/tofu/hetzner/
          workflow: deploy-fabric.yml
          workflow_conclusion: ""
          if_no_artifact_found: warn

      - name: Initialize OpenTofu
        working-directory: infrastructure/tofu/hetzner
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_operator_ssh_pubkey: ${{ secrets.OPERATOR_SSH_PUBKEY }}
        run: |
          tofu init

      - name: Validate OpenTofu configuration
        working-directory: infrastructure/tofu/hetzner
        run: |
          tofu validate

      - name: Install age + generate ephemeral CI SSH keypair
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          # Headless Ansible needs a private key to SSH to the VM (run
          # 26170050584 demonstrated that cloud-init's --ssh Tailscale path
          # requires interactive web auth — incompatible with CI). Instead:
          # generate an ephemeral SSH keypair for THIS workflow run, bake the
          # pubkey into cloud-init via TF_VAR_ci_ssh_pubkey, and ship the
          # privkey to ansible-deploy as an AGE-ENCRYPTED artifact.
          #
          # AGE encryption is mandatory because this is a PUBLIC repo —
          # artifacts are downloadable by anyone with read access. Encrypting
          # under the same age public key as sops means only the holder of
          # SOPS_AGE_KEY (operator + GH Actions) can decrypt.
          sudo apt-get update -qq
          sudo apt-get install -y age

          # Write age private key (also contains public key as a header line).
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt
          AGE_PUBKEY=$(grep '^# public key' ~/.config/sops/age/keys.txt | awk '{print $NF}')
          if [ -z "$AGE_PUBKEY" ]; then
            echo "ERROR: failed to extract age public key from SOPS_AGE_KEY secret"
            exit 1
          fi

          # Generate keypair (no passphrase; mode 600 enforced by ssh-keygen).
          ssh-keygen -t ed25519 -N "" -C "ci-deploy-${{ github.run_id }}" -f /tmp/ci_deploy_key -q
          # Strip trailing newline noise from pubkey so the regex in
          # variables.tf accepts it.
          CI_PUBKEY=$(cat /tmp/ci_deploy_key.pub)
          echo "Generated CI keypair (pubkey fp $(ssh-keygen -lf /tmp/ci_deploy_key.pub | awk '{print $2}'))"

          # Persist pubkey to env file so subsequent steps in this job see it
          # without re-running ssh-keygen. Set as TF_VAR_ci_ssh_pubkey.
          {
            echo "CI_SSH_PUBKEY<<EOF_PUBKEY"
            echo "$CI_PUBKEY"
            echo "EOF_PUBKEY"
          } >> "$GITHUB_ENV"

          # Encrypt the private key under SOPS' age recipient.
          mkdir -p /tmp/ci-artifacts
          age -r "$AGE_PUBKEY" -o /tmp/ci-artifacts/ci_deploy_key.age /tmp/ci_deploy_key
          echo "Encrypted privkey: $(ls -la /tmp/ci-artifacts/ci_deploy_key.age)"

          # Defensive: wipe plaintext privkey from runner FS.
          shred -u /tmp/ci_deploy_key

      - name: Upload age-encrypted CI privkey
        uses: actions/upload-artifact@v4
        with:
          name: ci-ssh-privkey-age
          path: /tmp/ci-artifacts/ci_deploy_key.age
          retention-days: 1

      - name: Create plan
        id: tofu_plan
        working-directory: infrastructure/tofu/hetzner
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_operator_ssh_pubkey: ${{ secrets.OPERATOR_SSH_PUBKEY }}
          TF_VAR_ci_ssh_pubkey: ${{ env.CI_SSH_PUBKEY }}
        run: |
          set +e
          tofu plan -out=tfplan -detailed-exitcode
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> $GITHUB_OUTPUT
          # 0 = no changes, 1 = error, 2 = changes present
          echo "Plan exit code: ${exit_code}"

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan
          path: infrastructure/tofu/hetzner/tfplan
          retention-days: 7

      - name: Comment on workflow run (plan summary)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const exitCode = '${{ steps.tofu_plan.outputs.plan_exit_code }}';
            const message = {
              '0': 'No infrastructure changes detected',
              '2': 'Infrastructure changes pending (tofu apply will execute them)',
              '1': 'Plan validation failed'
            }[exitCode] || 'Unknown plan status';
            console.log(`Plan status: ${message}`);

  tofu-apply:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tofu-plan
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fabric-v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    outputs:
      vm_ipv4: ${{ steps.tofu_outputs.outputs.vm_ipv4 }}
      vm_ipv6: ${{ steps.tofu_outputs.outputs.vm_ipv6 }}
      server_name: ${{ steps.tofu_outputs.outputs.server_name }}
      volume_device: ${{ steps.tofu_outputs.outputs.volume_device }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Restore tofu state from previous run (if any)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: tofu-state
          path: infrastructure/tofu/hetzner/
          workflow: deploy-fabric.yml
          workflow_conclusion: ""
          if_no_artifact_found: warn

      - name: Initialize OpenTofu
        working-directory: infrastructure/tofu/hetzner
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_operator_ssh_pubkey: ${{ secrets.OPERATOR_SSH_PUBKEY }}
        run: |
          tofu init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tofu-plan
          path: infrastructure/tofu/hetzner/

      - name: Apply infrastructure
        id: tofu_apply
        working-directory: infrastructure/tofu/hetzner
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_operator_ssh_pubkey: ${{ secrets.OPERATOR_SSH_PUBKEY }}
        run: |
          echo "Applying infrastructure..."
          tofu apply -auto-approve tfplan 2>&1 | tee apply.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "ERROR: tofu apply failed"
            exit 1
          fi
          echo "Infrastructure apply complete"

      - name: Extract Terraform outputs
        id: tofu_outputs
        working-directory: infrastructure/tofu/hetzner
        run: |
          tofu output -json > outputs.json
          vm_ipv4=$(jq -r '.vm_ipv4.value' outputs.json)
          vm_ipv6=$(jq -r '.vm_ipv6.value' outputs.json)
          server_name=$(jq -r '.server_name.value' outputs.json)
          volume_device=$(jq -r '.volume_device.value' outputs.json)

          echo "vm_ipv4=${vm_ipv4}" >> $GITHUB_OUTPUT
          echo "vm_ipv6=${vm_ipv6}" >> $GITHUB_OUTPUT
          echo "server_name=${server_name}" >> $GITHUB_OUTPUT
          echo "volume_device=${volume_device}" >> $GITHUB_OUTPUT

          echo "VM deployed: ${vm_ipv4}"

      # NOTE: No tailnet readiness probe at this layer. ACLs for tagged CI runners
      # (tag:ci-deploy) vs user-owned VMs can hide peers from status output,
      # making explicit polling unreliable. Instead, the ansible-deploy job
      # (next job) brings runner onto tailnet via Tailscale GH action and
      # connects to the VM via MagicDNS hostname — Ansible's own SSH retry
      # logic handles the "cloud-init still installing Tailscale" race
      # (typical: 30–60s).
      - name: Cloud-init grace period
        run: |
          # Give cloud-init runcmd time to run apt install + tailscale up.
          # Tailscale install on Ubuntu noble: ~20–40s. tailscale up: ~5s.
          # 90s gives comfortable margin; ansible-deploy SSH retry covers slow case.
          echo "Sleeping 90s to let VM cloud-init complete Tailscale bootstrap..."
          sleep 90

      - name: Upload state artifact (even on apply failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tofu-state
          path: infrastructure/tofu/hetzner/terraform.tfstate
          retention-days: 30
          overwrite: true

  ansible-deploy:
    name: Ansible Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: tofu-apply
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ansible and collections
        env:
          # galaxy.ansible.com has been flaky (HTTP 520, read timeouts) in
          # multiple runs (26226063220, 26227243481). Raise the HTTP timeout
          # via env, then retry the collection install up to 5 times with
          # exponential backoff before failing the step.
          ANSIBLE_GALAXY_SERVER_LIST: ""
          ANSIBLE_GALAXY_HTTP_TIMEOUT: "120"
        run: |
          pip install --upgrade pip
          pip install ansible-core>=2.16 jinja2 pyyaml
          for i in 1 2 3 4 5; do
            echo "=== ansible-galaxy collection install attempt $i/5 ==="
            if ansible-galaxy collection install --timeout 120 -r infrastructure/ansible/requirements.yml; then
              echo "Galaxy install succeeded on attempt $i"
              exit 0
            fi
            sleep $((10 * i))
          done
          echo "ERROR: ansible-galaxy collection install failed 5 times"
          exit 1

      - name: Install sops + age CLI binaries
        env:
          SOPS_VERSION: 'v3.10.2'
        run: |
          # age — available in Ubuntu universe (noble)
          sudo apt-get update -qq
          sudo apt-get install -y age
          # sops — install from GitHub release (not in apt repo for noble)
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          rm /tmp/sops
          # Verify
          echo "=== installed versions ==="
          sops --version 2>&1 | head -2
          age --version 2>&1 | head -2
          which sops
          which age

      - name: Tailscale up (auth key, tag:fabric)
        uses: tailscale/github-action@v3
        with:
          # The OAuth client path requires tag:ci-deploy to be pre-approved in
          # the Tailscale admin → OAuth clients. Run 26166654420 failed all 5
          # retries with "requested tags [tag:ci-deploy] are invalid or not
          # permitted". Switch to a reusable auth key from sops — the same key
          # cloud-init uses to register the VM, with tag:fabric baked in. ACL
          # for tag:fabric must allow intra-tag traffic for runner -> VM SSH.
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --accept-dns --hostname=gh-runner-${{ github.run_id }}

      - name: Assert runner is on tailnet
        run: |
          # The `tailscale/github-action` step retries 5 times then exits 0 even
          # if all attempts fail (it logs "Tailscale up failed" but doesn't fail
          # the step). Verify connectivity ourselves so downstream steps fail
          # fast instead of timing out in poll loops.
          if ! tailscale status >/dev/null 2>&1; then
            echo "ERROR: tailscale is not running on the runner"
            tailscale status || true
            exit 1
          fi
          # status returns "Logged out" with rc=0 when not authenticated.
          STATE=$(tailscale status 2>&1 | head -1)
          if [[ "$STATE" == *"Logged out"* ]] || [[ "$STATE" == *"stopped"* ]]; then
            echo "ERROR: tailscaled is up but not authenticated ($STATE)"
            tailscale status || true
            exit 1
          fi
          echo "Tailscale runner state OK:"
          tailscale status | head -5
          echo "Runner's own tailnet IPv4: $(tailscale ip -4 2>/dev/null | head -1)"

      - name: Resolve VM tailnet IPv4 (poll up to 5 min)
        id: tsip
        env:
          SERVER_NAME: ${{ needs.tofu-apply.outputs.server_name }}
        run: |
          # Run 26175483935 found 3 stale "mnemonic-fabric" devices in the
          # tailnet from prior deploys (Tailscale appends -1/-2 suffixes only in
          # the plain-text status display but keeps the original HostName in
          # JSON for ALL of them). `tailscale ip -4 <name>` returned the first
          # match — typically the OLDEST/offline ghost — and Ansible then SSH'd
          # to a dead IP for 14 min.
          #
          # Robust resolution: parse status JSON and select ONLY the peer with
          # HostName == SERVER_NAME AND Online == true. Return its tailnet IPv4
          # (the .x address; ignore the IPv6 fd7a:... companion).
          echo "Initial tailscale status:"
          tailscale status || true
          echo "---"
          for i in $(seq 1 30); do
            VM_IP=$(tailscale status --json 2>/dev/null | jq -r --arg name "$SERVER_NAME" '
              [(.Peer // {} | to_entries[].value)
                | select(.HostName == $name and .Online == true)
                | (.TailscaleIPs // [])[]
                | select(test("^100\\."))
              ] | first // ""
            ')
            if [ -n "$VM_IP" ]; then
              echo "VM ${SERVER_NAME} resolved to online tailnet IPv4 $VM_IP (try ${i}/30)"
              echo "vm_ip=$VM_IP" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "[$i/30] no ONLINE peer with HostName=${SERVER_NAME} yet — sleeping 10s"
            sleep 10
          done
          echo "ERROR: no online ${SERVER_NAME} peer appeared within 5 min"
          echo "=== final tailscale status ==="
          tailscale status || true
          echo "=== final tailscale netcheck ==="
          tailscale netcheck || true
          exit 1

      - name: Download + decrypt CI SSH privkey
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Download CI privkey artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-ssh-privkey-age
          path: /tmp/ci-artifacts/

      - name: Decrypt CI privkey
        run: |
          age -d -i ~/.config/sops/age/keys.txt \
            -o /tmp/ci_deploy_key \
            /tmp/ci-artifacts/ci_deploy_key.age
          chmod 600 /tmp/ci_deploy_key
          echo "Decrypted ssh privkey: $(ssh-keygen -lf /tmp/ci_deploy_key)"

      - name: Generate Ansible inventory (tailnet IPv4 + ephemeral SSH key)
        env:
          SERVER_NAME: ${{ needs.tofu-apply.outputs.server_name }}
          VOLUME_DEVICE: ${{ needs.tofu-apply.outputs.volume_device }}
          VM_IP: ${{ steps.tsip.outputs.vm_ip }}
        run: |
          # Use the resolved tailnet IPv4 directly — avoids any DNS/MagicDNS
          # path on the runner (was the failure mode in run 26165294730).
          # ansible_user=op: cloud-init injects op user with sudo NOPASSWD; the
          # CI ephemeral pubkey was added to its authorized_keys at VM creation
          # (run 26170050584 demonstrated that root has no keys + cloud-init's
          # Tailscale --ssh interactive auth deadlocks CI — both removed).
          mkdir -p infrastructure/ansible/inventory
          cat > infrastructure/ansible/inventory/hosts.yml <<INVENTORY
          all:
            hosts:
              ${SERVER_NAME}:
                ansible_host: ${VM_IP}
                ansible_user: op
                ansible_ssh_private_key_file: /tmp/ci_deploy_key
                # ServerAliveInterval 15s + ServerAliveCountMax 60 = 15min
                # of grace before the runner considers SSH dead. Earlier 30s
                # interval lost the tunnel during long-running apt installs
                # of build-essential (run 26250385319).
                ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes"
                ansible_ssh_retries: 5
                ansible_become: true
                ansible_become_method: sudo
                fabric_hostname: ${SERVER_NAME}
                volume_device: ${VOLUME_DEVICE}
          INVENTORY
          echo "Inventory generated (tailnet IPv4=${VM_IP}, user=op, key=/tmp/ci_deploy_key):"
          cat infrastructure/ansible/inventory/hosts.yml

      - name: Create sops-age wrapper for GitHub Actions secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: SSH/tailnet diagnostic probe
        env:
          VM_IP: ${{ steps.tsip.outputs.vm_ip }}
        run: |
          # Verify VM is reachable via tailnet at L3 (ping) and L4 (TCP/22)
          # BEFORE Ansible. Run 26174191941 lost ~14 minutes of Ansible SSH
          # retries failing with TCP timeout — this probe catches it in <30s
          # and prints actionable diagnostics (tailscale ping output, nc -vz,
          # ssh -v).
          set +e
          echo "=== tailscale ping (L3 reachability over tailnet) ==="
          tailscale ping -c 3 --timeout=10s "${VM_IP}" || echo "L3 PING FAILED"
          echo
          echo "=== nc -vz TCP/22 (10s timeout) ==="
          nc -vz -w 10 "${VM_IP}" 22 || echo "TCP/22 PROBE FAILED"
          echo
          echo "=== ssh -v dry run as op (5s connect timeout, BatchMode) ==="
          ssh -i /tmp/ci_deploy_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -v \
              op@"${VM_IP}" "echo SSH_OK && id && hostname" 2>&1 | head -40 || echo "SSH PROBE FAILED"
          echo
          echo "=== tailscale netcheck ==="
          tailscale netcheck 2>&1 | head -15
          echo
          echo "=== tailscale status (full) ==="
          tailscale status || true
          echo
          echo "=== tailscale status --json (peer reachability fields) ==="
          tailscale status --json 2>/dev/null | jq -r '
            (.Self | {self_host: .HostName, online: .Online, ips: .TailscaleIPs}),
            (.Peer // {} | to_entries[] | .value |
              {peer_host: .HostName, online: .Online, ips: .TailscaleIPs, last_handshake: .LastHandshake, last_seen: .LastSeen, in_engine: .InEngine})
          ' || tailscale status
          set -e

      - name: Validate secrets can be decrypted
        run: |
          # Diagnostic info — key file presence and shape (not contents).
          echo "=== age key file ==="
          ls -la ~/.config/sops/age/keys.txt
          echo "line count: $(wc -l < ~/.config/sops/age/keys.txt)"
          echo "byte count: $(wc -c < ~/.config/sops/age/keys.txt)"
          echo "first line: $(head -1 ~/.config/sops/age/keys.txt)"
          echo "public key line: $(grep '^# public key' ~/.config/sops/age/keys.txt || echo MISSING)"
          echo "private key prefix: $(grep '^AGE-SECRET-KEY-' ~/.config/sops/age/keys.txt | head -c 25)..."
          echo "=== sops decrypt (stderr captured) ==="
          # Decrypt to /dev/null but show stderr for diagnostics. Sops never
          # prints plaintext on stderr — only the cipher/key error messages.
          if sops -d infrastructure/secrets/secrets.sops.yml > /dev/null; then
            echo "Secrets decryption successful"
          else
            echo "ERROR: sops decryption failed (see stderr above)"
            exit 1
          fi

      - name: Run Ansible playbook (deploy)
        timeout-minutes: 40
        env:
          # ansible-playbook resolves roles relative to the playbook dir
          # (infrastructure/ansible/playbooks/roles), but our roles live in
          # infrastructure/ansible/roles. Point the resolver at the right path.
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/infrastructure/ansible/roles
          # Pass sops age key path so any sops_decrypt lookups in roles work.
          SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt
        run: |
          ansible-playbook \
            -i infrastructure/ansible/inventory/hosts.yml \
            -v \
            infrastructure/ansible/playbooks/deploy.yml \
            -e "ansible_timeout=300"

      - name: Verify fabric services
        timeout-minutes: 5
        env:
          VM_HOSTNAME: mnemonic-fabric
        run: |
          echo "Verifying Tailscale connectivity..."
          tailscale status

          if ! tailscale ping -c 1 "$VM_HOSTNAME" > /dev/null 2>&1; then
            echo "ERROR: Cannot ping $VM_HOSTNAME"
            exit 1
          fi
          echo "VM connectivity verified"

  e2e-smoke:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [ansible-deploy, tofu-apply]
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trigger e2e-smoke workflow
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const featureName = `fabric-bootstrap-${runId}`;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'e2e-smoke.yml',
              ref: context.ref,
              inputs: {
                feature_name: featureName,
                vm_hostname: 'mnemonic-fabric'
              }
            });
            console.log(`Triggered e2e-smoke with feature_name=${featureName}`);

      - name: Wait for e2e-smoke completion
        timeout-minutes: 35
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const featureName = `fabric-bootstrap-${runId}`;
            let completed = false;
            let attempt = 0;
            const maxAttempts = 70; // ~35 min with 30s intervals

            while (!completed && attempt < maxAttempts) {
              attempt++;
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'e2e-smoke.yml'
              });

              const smokeRun = runs.data.workflow_runs.find(r =>
                r.name === 'e2e-smoke' &&
                r.created_at > new Date(Date.now() - 5 * 60 * 1000).toISOString()
              );

              if (!smokeRun) {
                console.log(`Attempt ${attempt}/${maxAttempts}: e2e-smoke run not found yet...`);
                await new Promise(r => setTimeout(r, 30000));
                continue;
              }

              if (['completed'].includes(smokeRun.status)) {
                completed = true;
                if (smokeRun.conclusion === 'success') {
                  console.log('e2e-smoke completed successfully');
                } else {
                  console.log(`e2e-smoke failed with conclusion: ${smokeRun.conclusion}`);
                  core.setFailed(`e2e-smoke ${smokeRun.conclusion}`);
                }
              } else {
                console.log(`Attempt ${attempt}/${maxAttempts}: e2e-smoke status=${smokeRun.status}`);
                await new Promise(r => setTimeout(r, 30000));
              }
            }

            if (!completed) {
              core.setFailed('e2e-smoke did not complete within timeout');
            }

  attest:
    name: Mnemonic Attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [e2e-smoke, tofu-apply]
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Tailscale up (ephemeral)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci-deploy

      - name: Trigger post-deploy attestation hook
        timeout-minutes: 5
        env:
          VM_HOSTNAME: mnemonic-fabric
          MNEMONIC_SIGNING_KEY_VAULT_REF: ${{ secrets.MNEMONIC_SIGNING_KEY_VAULT_REF }}
        run: |
          echo "Invoking post-deploy.sh hook via Tailscale SSH..."

          attestation_result=$(tailscale ssh $VM_HOSTNAME \
            "bash /opt/mnemonic-mcp/post-deploy.sh" 2>&1) || true

          attestation_id=$(echo "$attestation_result" | grep -oP 'attestation_id=\K[\w-]+' | head -1)

          if [ -z "$attestation_id" ]; then
            echo "WARNING: No attestation ID returned from post-deploy hook"
            attestation_id="pending-verification"
          fi

          echo "attestation_id=${attestation_id}" >> $GITHUB_OUTPUT
          echo "Post-deploy attestation completed: ${attestation_id}"

  notify:
    name: Notify Operations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [tofu-apply, ansible-deploy, e2e-smoke]
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.tofu-apply.result }}" = "success" ] && \
             [ "${{ needs.ansible-deploy.result }}" = "success" ] && \
             [ "${{ needs.e2e-smoke.result }}" = "success" ]; then
            status="SUCCESS"
            status_emoji="✓"
          else
            status="FAILURE"
            status_emoji="✗"
          fi

          echo "status=${status}" >> $GITHUB_OUTPUT
          echo "status_emoji=${status_emoji}" >> $GITHUB_OUTPUT

      - name: Post deployment notification to Telegram
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          DEPLOYMENT_STATUS: ${{ steps.status.outputs.status }}
          STATUS_EMOJI: ${{ steps.status.outputs.status_emoji }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          VM_IPV4: ${{ needs.tofu-apply.outputs.vm_ipv4 }}
        run: |
          # Only proceed if we have telegram credentials
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_OPS_CHAT_ID" ]; then
            echo "TELEGRAM credentials not configured; skipping notification"
            exit 0
          fi

          message="fabric deploy ${STATUS_EMOJI} ${DEPLOYMENT_STATUS}
          Run: ${RUN_ID}
          Commit: ${COMMIT_SHA:0:8}
          VM IP: ${VM_IPV4:-pending}
          Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}"

          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_OPS_CHAT_ID}" \
            -d "text=$(echo "$message" | jq -sRr @json)" \
            -d "parse_mode=HTML" \
            -v || true

      - name: Log deployment summary
        run: |
          echo "=== Deployment Summary ==="
          echo "Status: ${{ steps.status.outputs.status }}"
          echo "ToFu Plan: ${{ needs.tofu-apply.result }}"
          echo "Ansible: ${{ needs.ansible-deploy.result }}"
          echo "E2E Smoke: ${{ needs.e2e-smoke.result }}"
          echo "VM IP: ${{ needs.tofu-apply.outputs.vm_ipv4 }}"
          echo "============================="
