[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-publisher"
version = "0.1.0"
description = "Shared queue + state-machine + CAS primitive for content-publisher worker and bot"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mnemonic Protocol" }]

dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    # Used by tests/test_required_mounts_for.py to render the systemd unit
    # template directly. Dev-only — the worker itself does not use Jinja.
    "jinja2>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["content_publisher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# Upstream snapshot ships no py.typed marker; the install-time
# inspect.signature assertion (Decision 11) is the type-shape gate, not mypy.
[[tool.mypy.overrides]]
module = ["mnemonik_blogger.*"]
ignore_missing_imports = true
