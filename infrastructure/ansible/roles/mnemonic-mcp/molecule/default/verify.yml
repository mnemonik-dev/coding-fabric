---
# Local-only assertions. Not wired into CI — see role README TODO.
- name: Verify
  hosts: all
  gather_facts: true
  vars:
    mnemonik_mcp_install_dir: /opt/mnemonik-mcp
    mnemonic_mcp_service_user: mnemonic-mcp
  tasks:
    - name: Verify mnemonic-mcp service user exists
      ansible.builtin.user:
        name: "{{ mnemonic_mcp_service_user }}"
        state: present
      check_mode: true
      register: mnemonic_mcp_user_check

    - name: Assert mnemonic-mcp service user exists
      ansible.builtin.assert:
        that:
          - not mnemonic_mcp_user_check.changed
        fail_msg: mnemonic-mcp service user does not exist

    - name: Verify pinned package-lock.json present in install dir
      ansible.builtin.stat:
        path: "{{ mnemonik_mcp_install_dir }}/package-lock.json"
      register: lockfile_stat

    - name: Assert lockfile present
      ansible.builtin.assert:
        that:
          - lockfile_stat.stat.exists
        fail_msg: package-lock.json missing in install dir

    - name: Verify Mnemonik MCP binary on PATH (cascade)
      ansible.builtin.shell: |
        set -euo pipefail
        which mnemonik-mcp || which mnemonic-mcp
      args:
        executable: /bin/bash
      register: which_check
      changed_when: false

    - name: Assert binary discoverable
      ansible.builtin.assert:
        that:
          - which_check.rc == 0
          - (which_check.stdout | trim) | length > 0
        fail_msg: neither mnemonik-mcp nor mnemonic-mcp on PATH

    - name: Verify systemd unit exists
      ansible.builtin.stat:
        path: /etc/systemd/system/mnemonic-mcp.service
      register: service_stat

    - name: Assert systemd unit exists
      ansible.builtin.assert:
        that:
          - service_stat.stat.exists
        fail_msg: systemd unit check failed

    - name: Verify systemd unit ExecStart references discovered binary
      ansible.builtin.lineinfile:
        path: /etc/systemd/system/mnemonic-mcp.service
        line: "ExecStart={{ which_check.stdout | trim }} mcp-stdio"
        state: present
      check_mode: true
      register: execstart_check

    - name: Assert ExecStart matches discovered binary
      ansible.builtin.assert:
        that:
          - not execstart_check.changed
        fail_msg: ExecStart in unit does not reference the discovered binary
