---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify tailscaled package is installed
      ansible.builtin.command: dpkg -l | grep tailscale
      register: tailscale_pkg
      changed_when: false
      failed_when: tailscale_pkg.rc != 0

    - name: Verify tailscaled service is enabled
      ansible.builtin.systemd_service:
        name: tailscaled
        state: started
      register: tailscaled_service_check
      check_mode: true
      changed_when: false

    - name: Check tailscale repository is configured
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/tailscale-ubuntu-noble-main.list
      register: tailscale_repo
      changed_when: false

    - name: Verify tailscale command is available
      ansible.builtin.command: which tailscale
      register: tailscale_cmd
      changed_when: false
      failed_when: tailscale_cmd.rc != 0

    - name: Verify GPG keyring is in place
      ansible.builtin.stat:
        path: /usr/share/keyrings/tailscale-archive-keyring.gpg
      register: tailscale_gpg
      changed_when: false
      failed_when: not tailscale_gpg.stat.exists

    - name: Verify tailscale_ip fact is registered (even if offline in test)
      ansible.builtin.assert:
        that:
          - hostvars[inventory_hostname].get('tailscale_ip') is defined or
            'tailscale_ip' in vars or
            (tailscale_ip_cmd is not skipped)
        fail_msg: "tailscale_ip fact must be registered for downstream role compatibility"
      check_mode: false
      ignore_errors: true
