name: Byte-Equivalence Harness
description: "Verify CBOR serialization byte-equivalence across Rust/TS/WASM"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack (pinned cargo install)
      run: cargo install --version 1.3.4 wasm-pack
      shell: bash

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: fabric/harnesses/byte-equivalence/rust

    - name: Install pytest
      run: pip install pytest pytest-asyncio requests
      shell: bash

    - name: Run byte-equivalence harness
      run: |
        cd fabric/harnesses/byte-equivalence
        make verify
      shell: bash

    - name: Upload harness report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: byte-equivalence-report
        path: |
          fabric/harnesses/byte-equivalence/tests/
          fabric/harnesses/byte-equivalence/.pytest_cache/
          !fabric/harnesses/byte-equivalence/node_modules/**
          !fabric/harnesses/byte-equivalence/rust/target/**
        retention-days: 7
