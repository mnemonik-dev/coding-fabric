---
- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Probe whether content-publisher is currently active
  # Decides whether the "Restart content-publisher" handler should act.
  # Tied to actual unit state, NOT to the role var content_publisher_
  # systemd_state — Wave 2 might re-render /etc/blogger.env on a config
  # rotation without setting state: started, and we still want to bounce
  # a running service in that case. (code-reviewer T3-3)
  become: true
  ansible.builtin.systemd:
    name: "{{ content_publisher_systemd_unit }}"
  register: cp_unit_state
  listen: Restart content-publisher

- name: Restart content-publisher
  # Must run AFTER the "Probe whether content-publisher is currently
  # active" handler above — Ansible fires handlers in definition order
  # and this one depends on the cp_unit_state register from the probe.
  become: true
  ansible.builtin.systemd:
    name: "{{ content_publisher_systemd_unit }}"
    state: restarted
  when: cp_unit_state.status.ActiveState | default('inactive') == 'active'
