---
# Telegram Bot API configuration
telegram_bot_token: ""
telegram_forum_chat_id: ""

# Topic icon colors (standard Telegram forum icon colors)
telegram_topic_icon_colors:
  core: 16711680        # Red
  mcp: 255              # Blue
  wasm: 65280           # Green
  demo-client: 16711935 # Purple
  docs: 65535           # Cyan
  loop: 16776960        # Yellow
  protocol-qa: 128      # Orange
  ops: 255              # Blue
  blogger-prompts: 16711935 # Purple

# Canonical topics list. Operator now creates every topic on demand via
# the bot's /new-task command (see Phase 2 backlog), so this list is
# empty by default — telegram-init's create-or-skip loop simply has
# nothing to do. Keep the variable so operators who want a baseline set
# can override it from a playbook or group_vars.
telegram_canonical_topics: []

# API timeouts and retries
telegram_api_timeout: 10
telegram_api_retries: 3
telegram_api_delay: 2

# Rate limiting between API calls (seconds)
telegram_api_rate_limit: 0.5

# Maximum pagination iterations to prevent infinite loops
telegram_max_pagination_pages: 20

# Inventory output path
telegram_inventory_file: "infrastructure/ansible/inventory/telegram-topics.yml"
