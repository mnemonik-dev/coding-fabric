---
- name: Validate required variables
  tags: [telegram-ai-agent, always]
  block:
    - name: Check TELEGRAM_AI_AGENT_CWD_RESOLVER_URL is set
      ansible.builtin.assert:
        that:
          - tailscale_ip is defined and tailscale_ip | length > 0
        fail_msg: |
          FATAL: tailscale_ip not set. This role requires tailscale to be deployed first (T02).
          See: work/mnemonic-tg-bridge/user-spec.md §3 (mnemonic-tg-bridge feature requirements)

    - name: Wait for workspace-manager (T08) to bind on tailnet IP:8080
      ansible.builtin.uri:
        url: "http://{{ tailscale_ip }}:8080/health"
        method: GET
        status_code: 200
        timeout: 5
      register: t08_health
      retries: 30
      delay: 5
      until: t08_health.status | default(-1) == 200
      failed_when: false

    - name: Diagnose workspace-manager when probe failed
      when: t08_health.status | default(-1) != 200
      become: true
      block:
        - name: workspace-manager systemd status
          ansible.builtin.command: systemctl status workspace-manager --no-pager -n 30
          register: wm_status
          changed_when: false
          failed_when: false
        - name: show systemd status
          ansible.builtin.debug:
            msg: "{{ wm_status.stdout_lines + wm_status.stderr_lines }}"

        - name: workspace-manager journalctl
          ansible.builtin.command: journalctl -u workspace-manager --no-pager -n 50
          register: wm_journal
          changed_when: false
          failed_when: false
        - name: show journalctl
          ansible.builtin.debug:
            msg: "{{ wm_journal.stdout_lines + wm_journal.stderr_lines }}"

        - name: ss listening sockets
          ansible.builtin.command: ss -ltn
          register: ss_ports
          changed_when: false
          failed_when: false
        - name: show listening sockets
          ansible.builtin.debug:
            msg: "{{ ss_ports.stdout_lines }}"

    - name: FAIL if workspace-manager not reachable
      ansible.builtin.fail:
        msg: |
          FATAL: workspace-manager (T08) not reachable at http://{{ tailscale_ip }}:8080/health
          See diagnostic output above (systemctl status, journalctl, ss).
      when: t08_health.status | default(-1) != 200

- name: Install Node.js + Claude Code CLI
  # The bot spawns `claude` as a subprocess for every coding turn — without
  # it, the bot is "active" in systemd but every Telegram message piles up
  # in "Added to queue (#1)" forever (live debug 2026-05-25: VM recreate
  # wiped the previous manual operator install).
  tags: [telegram-ai-agent, claude-cli]
  become: true
  block:
    - name: Check if Node.js is already installed
      ansible.builtin.command: node --version
      register: node_version_check
      changed_when: false
      failed_when: false

    - name: Add NodeSource APT repository
      ansible.builtin.shell: |
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      when: node_version_check.rc != 0
      changed_when: true

    - name: Install Node.js (provides node + npm)
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: yes
      when: node_version_check.rc != 0

    - name: Check if Claude Code CLI is installed
      ansible.builtin.command: claude --version
      register: claude_version_check
      changed_when: false
      failed_when: false

    - name: Install @anthropic-ai/claude-code globally
      community.general.npm:
        name: "@anthropic-ai/claude-code"
        global: true
        state: present
      when: claude_version_check.rc != 0

    - name: Verify claude is on PATH
      ansible.builtin.command: claude --version
      register: claude_version_final
      changed_when: false

    - name: Assert claude installed
      ansible.builtin.assert:
        that:
          - claude_version_final.rc == 0
        fail_msg: "claude CLI install failed; bot will hang on every message"

- name: Install uv package manager
  tags: [telegram-ai-agent, uv]
  block:
    - name: Check if uv is already installed
      ansible.builtin.command:
        cmd: uv --version
      register: uv_version_check
      changed_when: false
      failed_when: false

    - name: Download and install uv to /usr/local/bin
      become: true
      ansible.builtin.shell: |
        set -e
        curl -LsSf https://astral.sh/uv/install.sh | sh -s {{ telegram_ai_agent_uv_version }}
        # Installer puts uv/uvx at $UV_INSTALL_DIR root, not under bin/.
        # Standard system PATH includes /usr/local/bin, NOT /usr/local
        # (run 26267738926: 'uv --version' rc=2 because uv landed at
        # /usr/local/uv). Symlink into /usr/local/bin so all downstream
        # tasks find it without needing /usr/local in PATH.
        ln -sf /usr/local/uv /usr/local/bin/uv
        ln -sf /usr/local/uvx /usr/local/bin/uvx
      environment:
        UV_INSTALL_DIR: "/usr/local"
        UV_VERSION: "{{ telegram_ai_agent_uv_version }}"
      register: uv_install_result
      changed_when: "'uv' in uv_install_result.stdout or 'uv' in uv_install_result.stderr"
      when: uv_version_check.rc != 0 or telegram_ai_agent_uv_version not in uv_version_check.stdout | default("")
      retries: 3
      delay: 2

    - name: Verify uv installation
      ansible.builtin.command:
        cmd: /usr/local/bin/uv --version
      register: uv_version
      changed_when: false
      failed_when: false

    - name: Assert uv is available
      ansible.builtin.assert:
        that:
          - uv_version.rc == 0
        fail_msg: "uv installation failed or not in PATH"

- name: Clone or update telegram-ai-agent repository
  tags: [telegram-ai-agent, git]
  block:
    - name: Check if repository already exists
      ansible.builtin.stat:
        path: "{{ telegram_ai_agent_home }}"
      register: repo_stat

    - name: Clone telegram-ai-agent from upstream
      ansible.builtin.git:
        repo: "{{ telegram_ai_agent_repo }}"
        dest: "{{ telegram_ai_agent_home }}"
        version: "{{ telegram_ai_agent_pin }}"
        update: yes
        force: yes
      register: git_clone
      retries: 3
      delay: 2
      when: not repo_stat.stat.exists

    - name: Fetch all branches and tags from remote
      ansible.builtin.command:
        cmd: git fetch --all
        chdir: "{{ telegram_ai_agent_home }}"
      register: git_fetch
      changed_when: false
      when: repo_stat.stat.exists

    - name: Checkout pinned commit
      ansible.builtin.command:
        cmd: git checkout "{{ telegram_ai_agent_pin }}"
        chdir: "{{ telegram_ai_agent_home }}"
      register: git_checkout
      changed_when: '"HEAD detached" in git_checkout.stdout or "Switched" in git_checkout.stdout'
      when: repo_stat.stat.exists

    - name: Verify correct commit is checked out
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ telegram_ai_agent_home }}"
      register: current_sha
      changed_when: false
      when: repo_stat.stat.exists

    - name: Assert pinned commit matches checkout
      ansible.builtin.assert:
        that:
          - current_sha.stdout | trim == telegram_ai_agent_pin or telegram_ai_agent_pin in current_sha.stdout
        fail_msg: |
          Checked out commit does not match pinned version.
          Expected: {{ telegram_ai_agent_pin }}
          Got: {{ current_sha.stdout | trim }}
      when: repo_stat.stat.exists

    - name: Debug commit checkout
      ansible.builtin.debug:
        msg: "Current commit: {{ current_sha.stdout | trim }}"
      when: repo_stat.stat.exists

    # The git module runs under `become: true` so the clone lands as
    # root:root, which prevents the bot (uid op) from writing session
    # state files like channel_sessions.json next to the source tree
    # (PermissionError: [Errno 13] flooded the logs after deploy 26289095629).
    # Re-own the tree to the service user before any runtime tasks
    # touch it. Idempotent — file: skips identical owner.
    - name: Ensure {{ telegram_ai_agent_home }} is owned by service user
      ansible.builtin.file:
        path: "{{ telegram_ai_agent_home }}"
        state: directory
        owner: "{{ telegram_ai_agent_owner }}"
        group: "{{ telegram_ai_agent_group }}"
        recurse: yes

    # Defensive belt-and-braces: explicitly chown the runtime state
    # files the bot writes to. The recurse above SHOULD cover these,
    # but live debug 2026-05-25 found channel_sessions.json + topic_config.json
    # + tmux_sessions/state.json still root:root after deploy — the bot
    # then silently dropped every session/topic_config write
    # ("PermissionError: ... channel_sessions.json"), context was lost
    # across each /clear, /new behaved as reset-instead-of-new-chat.
    # Pinning each file individually makes the symptom impossible.
    - name: Ensure bot runtime-state files are op-owned
      ansible.builtin.file:
        path: "{{ telegram_ai_agent_home }}/{{ item }}"
        state: touch
        owner: "{{ telegram_ai_agent_owner }}"
        group: "{{ telegram_ai_agent_group }}"
        mode: "0644"
      loop:
        - channel_sessions.json
        - session_mapping.json
        - topic_config.json
      changed_when: false   # touch always reports changed; we don't care

    - name: Ensure tmux_sessions dir + state.json are op-owned
      ansible.builtin.file:
        path: "{{ telegram_ai_agent_home }}/tmux_sessions"
        state: directory
        owner: "{{ telegram_ai_agent_owner }}"
        group: "{{ telegram_ai_agent_group }}"
        mode: "0755"
        recurse: yes

- name: Pre-flight check for DYNAMIC feature
  tags: [telegram-ai-agent, preflight]
  # DYNAMIC feature (mnemonic-tg-bridge) is BACKLOG — upstream fork
  # doesn't have tests/test_dynamic_cwd.py yet. Don't fail the deploy
  # on a missing optional test. When the bridge fork is merged with the
  # test, flip require_dynamic_feature=true in defaults to re-arm this.
  block:
    - name: Check whether the DYNAMIC feature test exists
      ansible.builtin.stat:
        path: "{{ telegram_ai_agent_home }}/tests/test_dynamic_cwd.py"
      register: dynamic_test_stat

    - name: Note DYNAMIC feature status
      ansible.builtin.debug:
        msg: >
          DYNAMIC feature test {{ 'present (will run later)' if dynamic_test_stat.stat.exists
          else 'ABSENT — feature falls back to STATIC cwd. Tracked as backlog feature
          mnemonic-tg-bridge.' }}

    - name: Run pytest collection for DYNAMIC feature test (if present)
      ansible.builtin.shell: |
        cd "{{ telegram_ai_agent_home }}"
        /usr/local/bin/uv run --project "{{ telegram_ai_agent_home }}" \
          pytest tests/test_dynamic_cwd.py --co -q
      register: pytest_collection
      changed_when: false
      failed_when: false
      when: dynamic_test_stat.stat.exists

- name: Ensure configuration directory exists
  tags: [telegram-ai-agent, dirs]
  ansible.builtin.file:
    path: "{{ telegram_ai_agent_config_dir }}"
    state: directory
    owner: "{{ telegram_ai_agent_owner }}"
    group: "{{ telegram_ai_agent_group }}"
    mode: "0755"

- name: Install Python dependencies via uv sync
  tags: [telegram-ai-agent, deps]
  block:
    - name: Run uv sync with frozen lock
      ansible.builtin.shell: |
        cd "{{ telegram_ai_agent_home }}"
        /usr/local/bin/uv sync --frozen
      environment:
        UV_PROJECT_ENVIRONMENT: "{{ telegram_ai_agent_home }}/.venv"
      timeout: "{{ telegram_ai_agent_uv_sync_timeout }}"
      register: uv_sync
      changed_when: "'Synced' in uv_sync.stdout or 'updated' in uv_sync.stdout | lower"
      retries: 3
      delay: 5

    - name: Verify uv virtual environment
      ansible.builtin.stat:
        path: "{{ telegram_ai_agent_home }}/.venv/bin/python"
      register: venv_python
      failed_when: not venv_python.stat.exists

- name: Load telegram-topics inventory
  tags: [telegram-ai-agent, config]
  block:
    - name: Slurp telegram-topics.yml from inventory
      # telegram-init renders to playbook_dir/../../inventory which resolves
      # to /infrastructure/inventory (NOT /infrastructure/ansible/inventory).
      # Use dirname chain to compute the absolute path and avoid the slurp
      # module's path-resolution quirks with literal '../..'.
      ansible.builtin.slurp:
        src: "{{ (playbook_dir | dirname | dirname) }}/inventory/telegram-topics.yml"
      register: telegram_topics_file
      delegate_to: localhost
      run_once: true
      failed_when: false

    - name: Parse telegram-topics inventory (or fall back to empty)
      ansible.builtin.set_fact:
        telegram_topics_data: >-
          {{ (telegram_topics_file.content | b64decode | from_yaml)
             if (telegram_topics_file.content is defined)
             else {'telegram_topics': {}, 'telegram_ai_agent_topics': {}} }}

- name: Render telegram-ai-agent configuration
  tags: [telegram-ai-agent, config]
  block:
    - name: Prepare topic configs with chat_id and thread_id from inventory
      ansible.builtin.set_fact:
        telegram_ai_agent_topics_with_ids: |
          {%- set topics_dict = {} -%}
          {%- for topic_name, topic_config in telegram_ai_agent_topics.items() -%}
            {%- if topic_name in telegram_topics_data.telegram_ai_agent_topics -%}
              {%- set inv_topic = telegram_topics_data.telegram_ai_agent_topics[topic_name] -%}
              {%- set updated = topic_config.copy() -%}
              {%- set _ = updated.update({
                'chat_id': inv_topic.chat_id,
                'thread_id': inv_topic.thread_id,
                'cwd': 'DYNAMIC'
              }) -%}
              {%- set _ = topics_dict.update({topic_name: updated}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ topics_dict }}

    - name: Template config.yml
      ansible.builtin.template:
        src: config.yml.j2
        dest: "{{ telegram_ai_agent_config_dir }}/config.yml"
        owner: "{{ telegram_ai_agent_owner }}"
        group: "{{ telegram_ai_agent_group }}"
        mode: "0644"
      notify: Reload telegram-ai-agent

    - name: Validate config.yml syntax (timeout 15s — bot may try to start)
      # The fork's --check-config doesn't reliably short-circuit; running it
      # for too long means it actually starts polling Telegram and never
      # returns (run 26271375642 hung 30 min until the 40-min step timeout).
      # Wrap in `timeout 15 ...` and accept exit-code 124 (timeout) as
      # acceptable — settings were validated before any HTTP/MTProto IO.
      ansible.builtin.shell: |
        cd "{{ telegram_ai_agent_home }}"
        timeout --preserve-status 15 \
          {{ telegram_ai_agent_home }}/.venv/bin/python -m telegram_bot \
            --config {{ telegram_ai_agent_config_dir }}/config.yml \
            --check-config
      environment:
        TELEGRAM_BOT_TOKEN: "{{ telegram_bot_token }}"
        ANTHROPIC_API_KEY: "{{ anthropic_api_key | default('placeholder') }}"
      register: config_validation
      changed_when: false
      # rc=0 (clean exit) or rc=124 (timeout = bot started polling = config valid)
      failed_when: config_validation.rc not in [0, 124, 143]
      # no_log dropped for diagnosis — config-check stdout doesn't include
      # the bot token itself (passed via env).

- name: Render environment file from sops
  tags: [telegram-ai-agent, secrets]
  block:
    - name: Assert required secrets are present
      ansible.builtin.assert:
        that:
          - telegram_bot_token is defined and telegram_bot_token | string | length >= 40
          - (anthropic_api_key | default('') | string | length >= 20)
            or (claude_code_oauth_token | default('') | string | length >= 20)
        fail_msg: |
          FATAL: Required secrets missing. Caller must provide via sops decryption.

          Required variables:
          - telegram_bot_token (minimum 40 chars, from BotFather)
          - one of:
            * anthropic_api_key (sk-ant-api03-..., minimum 20 chars), OR
            * claude_code_oauth_token (sk-ant-oat01-..., minimum 20 chars
              from `claude setup-token`)
      # no_log removed for diagnosis. The assert task reveals only var
      # NAMES on failure, not values.

    - name: Template .env file with secrets
      ansible.builtin.template:
        src: .env.j2
        dest: "{{ telegram_ai_agent_config_dir }}/.env"
        owner: "{{ telegram_ai_agent_owner }}"
        group: "{{ telegram_ai_agent_group }}"
        mode: "0600"
      notify: Reload telegram-ai-agent
      # no_log dropped temporarily — the handler reload error is masked
      # by THIS task's no_log when it fires during flush.

    - name: Symlink .env into project root for MCP bot server
      # mcp-servers/bot/start.sh resolves $TELEGRAM_BOT_TOKEN by reading
      # <project_root>/.env (i.e. /opt/telegram-ai-agent/.env). Our actual
      # secret file lives in /etc/telegram-ai-agent/.env (used as systemd
      # EnvironmentFile for the bot itself). Without this link the MCP
      # server can't start, claude spawns it, hangs on the missing
      # handshake, and every Telegram message piles up in
      # message_queue.py with "Added to queue (#1)" forever (operator
      # debug 2026-05-23).
      ansible.builtin.file:
        src: "{{ telegram_ai_agent_config_dir }}/.env"
        dest: "{{ telegram_ai_agent_home }}/.env"
        state: link
        force: true
        owner: "{{ telegram_ai_agent_owner }}"
        group: "{{ telegram_ai_agent_group }}"

- name: Ship Molyanov skill bundle to every HOME claude might use
  # claude reads ~/.claude/{skills,commands} for slash-commands like
  # /tech-spec-planning, /do-task, /code-writing, etc. THREE claude
  # spawn sites need this bundle:
  #
  #   1. Bot's runtime — HOME=/var/lib/telegram-ai-agent (set in unit)
  #   2. Symphony-spawned agents — HOME=/home/op (workspace-manager user)
  #   3. Operator's interactive SSH session — HOME=/home/op (same)
  #
  # 2 + 3 overlap. Without the bundle in op's home, Symphony's claude
  # ignores the code.md workflow's '/user-spec-planning then …'
  # directives because the slash-commands resolve to nothing — agent
  # just implements directly (live debug 2026-05-25).
  tags: [telegram-ai-agent, skills]
  block:
    - name: Ensure target dirs exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "0755"
      loop:
        - {path: /var/lib/telegram-ai-agent/.claude, owner: "{{ telegram_ai_agent_owner }}"}
        - {path: /home/op/.claude, owner: op}

    - name: Sync skills/ into each target HOME
      ansible.posix.synchronize:
        src: "{{ role_path }}/../../files/claude-skills/skills/"
        dest: "{{ item }}/skills/"
        delete: no   # additive — preserve any out-of-band skills present
        owner: no
        group: no
        rsync_opts:
          - "--chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"
      loop:
        - /var/lib/telegram-ai-agent/.claude
        - /home/op/.claude

    - name: Sync commands/ into each target HOME
      ansible.posix.synchronize:
        src: "{{ role_path }}/../../files/claude-skills/commands/"
        dest: "{{ item }}/commands/"
        delete: no
        owner: no
        group: no
        rsync_opts:
          - "--chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"
      loop:
        - /var/lib/telegram-ai-agent/.claude
        - /home/op/.claude

    - name: Re-own .claude trees (synchronize ran as root)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        recurse: yes
      loop:
        - {path: /var/lib/telegram-ai-agent/.claude, owner: "{{ telegram_ai_agent_owner }}"}
        - {path: /home/op/.claude, owner: op}

- name: Install Kaneo MCP pairing helper
  # One-time operator script for the device-code flow with Kaneo. Lives
  # next to the bot install so the operator can run it via SSH without
  # any extra setup. Repeatable: re-run every ~30 days when the session
  # bearer expires.
  tags: [telegram-ai-agent, kaneo-pairing]
  block:
    - name: Ensure {{ telegram_ai_agent_home }}/scripts exists
      ansible.builtin.file:
        path: "{{ telegram_ai_agent_home }}/scripts"
        state: directory
        owner: "{{ telegram_ai_agent_owner }}"
        group: "{{ telegram_ai_agent_group }}"
        mode: "0755"

    - name: Copy pair-kaneo.py
      ansible.builtin.copy:
        src: pair-kaneo.py
        dest: "{{ telegram_ai_agent_home }}/scripts/pair-kaneo.py"
        owner: "{{ telegram_ai_agent_owner }}"
        group: "{{ telegram_ai_agent_group }}"
        mode: "0755"

- name: Install and enable systemd unit
  tags: [telegram-ai-agent, systemd]
  block:
    - name: Template systemd service unit
      ansible.builtin.template:
        src: telegram-ai-agent.service.j2
        dest: /etc/systemd/system/telegram-ai-agent.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Daemon reload
        - Reload telegram-ai-agent

    - name: Flush handlers to reload systemd
      ansible.builtin.meta: flush_handlers

    - name: Enable and start telegram-ai-agent service
      ansible.builtin.systemd_service:
        name: telegram-ai-agent
        enabled: yes
        state: started

    - name: Wait for service to stabilize
      ansible.builtin.pause:
        seconds: 3

    - name: Check service is active
      ansible.builtin.systemd_service:
        name: telegram-ai-agent
      register: service_status

    - name: Assert service is active
      ansible.builtin.assert:
        that:
          - service_status.status.ActiveState == "active"
        fail_msg: |
          telegram-ai-agent service failed to start.
          Check systemctl status telegram-ai-agent and journalctl -u telegram-ai-agent -n 50

- name: Post-deployment healthcheck
  tags: [telegram-ai-agent, healthcheck]
  block:
    - name: Verify systemd unit is active
      ansible.builtin.command:
        cmd: systemctl is-active telegram-ai-agent
      register: healthcheck
      changed_when: false

    - name: Assert healthcheck passed
      ansible.builtin.assert:
        that:
          - healthcheck.stdout | trim == "active"
        fail_msg: "telegram-ai-agent service is not active"

    - name: Show successful completion
      ansible.builtin.debug:
        msg: |
          telegram-ai-agent role deployment completed.
          Service: systemctl status telegram-ai-agent
          Config: {{ telegram_ai_agent_config_dir }}/config.yml
          Logs: journalctl -u telegram-ai-agent -f
