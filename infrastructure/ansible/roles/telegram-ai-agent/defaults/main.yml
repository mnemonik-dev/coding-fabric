---
# Fork repo (own-the-fork strategy — see work/mnemonic-tg-bridge/user-spec.md).
# Source of truth: mnemonik-dev/telegram-ai-agent. Pavel-molyanov upstream is a
# read-only sync source for periodic bug-fix rebase.
telegram_ai_agent_repo: "https://github.com/mnemonik-dev/telegram-ai-agent.git"
# Pinned release tag: v0.1.0+mnemonik.1 includes the cwd:DYNAMIC HTTP resolver
# feature (5c82583 → 1ceaccb, audit-remediated, 72 tests green).
telegram_ai_agent_pin: "v0.1.0+mnemonik.1"

# Installation paths
telegram_ai_agent_home: "/opt/telegram-ai-agent"
telegram_ai_agent_config_dir: "/etc/telegram-ai-agent"
telegram_ai_agent_owner: "op"
telegram_ai_agent_group: "op"

# uv installer version (pinned for reproducibility)
telegram_ai_agent_uv_version: "0.5.3"

# Timeout for uv sync (first-run pulls many dependencies)
telegram_ai_agent_uv_sync_timeout: 300

# Pre-flight check: whether to require DYNAMIC feature in pinned commit
telegram_ai_agent_require_dynamic_feature: true

# Topic configuration matrix. Empty by default — operator builds the set
# on demand via the bot's /new-task command (Phase 2 backlog). Override
# this map from a playbook or group_vars if you want a baseline set
# materialised at deploy time. The original 8 canonical topics
# (core/mcp/wasm/demo-client/docs/loop/protocol-qa/ops) lived here until
# 2026-05-24 — see git log for the previous shape if you want to revive
# them as a static baseline.
telegram_ai_agent_topics: {}

# Systemd service parameters
telegram_ai_agent_restart_policy: "on-failure"
telegram_ai_agent_restart_sec: 5
telegram_ai_agent_log_level: "info"
