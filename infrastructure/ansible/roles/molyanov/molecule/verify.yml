---
- name: Verify molyanov role
  hosts: all
  become: true
  tasks:
    - name: Check molyanov skills bundle installed
      ansible.builtin.stat:
        path: "{{ molyanov_operator_home }}/.claude/skills/molyanov-ai-dev"
      register: molyanov_skills_stat

    - name: Assert molyanov skills directory exists
      ansible.builtin.assert:
        that:
          - molyanov_skills_stat.stat.exists
          - molyanov_skills_stat.stat.isdir
        fail_msg: "molyanov-ai-dev skills bundle not installed"

    - name: Check pk-guard hook installed
      ansible.builtin.stat:
        path: "{{ molyanov_operator_home }}/.fabric/molyanov/hooks/pk-guard.sh"
      register: molyanov_pk_guard_stat

    - name: Assert pk-guard hook exists and is executable
      ansible.builtin.assert:
        that:
          - molyanov_pk_guard_stat.stat.exists
          - molyanov_pk_guard_stat.stat.executable
          - molyanov_pk_guard_stat.stat.mode == '0755'
        fail_msg: "pk-guard.sh hook not properly installed or has incorrect permissions"

    - name: Check ops-notify hook installed
      ansible.builtin.stat:
        path: "{{ molyanov_operator_home }}/.fabric/molyanov/hooks/ops-notify.sh"
      register: molyanov_ops_notify_stat

    - name: Assert ops-notify hook exists and is executable
      ansible.builtin.assert:
        that:
          - molyanov_ops_notify_stat.stat.exists
          - molyanov_ops_notify_stat.stat.executable
          - molyanov_ops_notify_stat.stat.mode == '0755'
        fail_msg: "ops-notify.sh hook not properly installed or has incorrect permissions"

    - name: Check global.yml rendered
      ansible.builtin.stat:
        path: "{{ molyanov_operator_home }}/.fabric/molyanov/global.yml"
      register: molyanov_global_yml_stat

    - name: Assert global.yml exists
      ansible.builtin.assert:
        that:
          - molyanov_global_yml_stat.stat.exists
        fail_msg: "molyanov global.yml not rendered"

    - name: Check ruflo hooks.d integration
      ansible.builtin.stat:
        path: "{{ molyanov_operator_home }}/.fabric/ruflo/hooks.d/molyanov-pk-guard.yml"
      register: molyanov_ruflo_hooks_stat

    - name: Assert ruflo hooks.d integration exists
      ansible.builtin.assert:
        that:
          - molyanov_ruflo_hooks_stat.stat.exists
        fail_msg: "ruflo pk-guard hook integration not configured"

    - name: Verify pk-guard.sh syntax
      ansible.builtin.shell: bash -n "{{ molyanov_operator_home }}/.fabric/molyanov/hooks/pk-guard.sh"
      changed_when: false

    - name: Verify ops-notify.sh syntax
      ansible.builtin.shell: bash -n "{{ molyanov_operator_home }}/.fabric/molyanov/hooks/ops-notify.sh"
      changed_when: false

    - name: Test pk-guard with RUFLO_SESSION unset (should pass)
      ansible.builtin.shell: |
        env -i RUFLO_SESSION="" "{{ molyanov_operator_home }}/.fabric/molyanov/hooks/pk-guard.sh" "/tmp/test.txt"
      changed_when: false
      failed_when: false

    - name: Test pk-guard with PK path and RUFLO_SESSION set (should fail)
      ansible.builtin.shell: |
        RUFLO_SESSION="test-1" "{{ molyanov_operator_home }}/.fabric/molyanov/hooks/pk-guard.sh" ".claude/skills/project-knowledge/references/test.md" 2>/dev/null
        exit 0
      changed_when: false

    - name: Test idempotency by running role again
      ansible.builtin.debug:
        msg: "Idempotency check completed; second run should make no changes"
