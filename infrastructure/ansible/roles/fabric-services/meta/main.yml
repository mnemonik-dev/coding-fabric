---
galaxy_info:
  author: Mnemonic Protocol
  description: Deploy compiled fabric services to the VM
  company: Mnemonic
  license: MPL-2.0
  min_ansible_version: '2.16'
  platforms:
    - name: Ubuntu
      versions:
        - '24.04'
  galaxy_tags:
    - fabric
    - deployment
    - services
    - python
    - systemd

dependencies:
  - base
  - vaultwarden
  - kaneo
# workspace-manager is implemented as a sub-component (systemd service) INSIDE
# this role, not as a separate role. Listing it under dependencies caused
# Ansible to error out trying to locate a non-existent role 'workspace-manager'.
