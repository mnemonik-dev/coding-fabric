---
#
# deploy.yml — main fabric deployment playbook
# Orchestrates 10 Ansible roles in sequence to bring up the complete fabric on a Hetzner VM.
#
# Invoked by:
#  - CI job deploy-fabric.yml (T24), post-infrastructure provisioning
#  - Operator: ansible-playbook -i infrastructure/ansible/inventory/hosts.yml infrastructure/ansible/playbooks/deploy.yml
#
# Roles (in order):
#  1. base              — OS hardening, ufw, unattended-upgrades, operator user, base dirs
#  2. ssh-hardening     — SSH key policy, disable password auth, key rotation
#  3. tailscale         — Tailscale VPN membership, routes, tag-based access
#  4. vaultwarden       — Secrets vault (docker-compose + Caddy reverse-proxy)
#  5. kaneo             — Observability backend (docker-compose, 6 default projects)
#  6. telegram-init     — Telegram forum + 8 topic creation (Bot API)
#  7. restic-backups    — Nightly off-site backups + verify-restore
#  8. molyanov          — Project knowledge + PK guard hook
#  9. mnemonic-mcp      — Local Mnemonic MCP server + 5 trigger-point hooks
#                          (DESCOPED 2026-05: disabled by default; gated by
#                          mnemonic_mcp_enabled var. Backlog feature:
#                          work/mnemonic-attestation-integration/)
# 10. fabric-services   — Deploy compiled fabric artefacts (workspace-manager, watchdog, safe-mode, etc.)
# 11. telegram-ai-agent — telegram-ai-agent bot + per-topic cwd:DYNAMIC resolver config
#
# Note: ruflo role removed 2026-05-20 (inherited-without-critical-eval cleanup;
# see work/coding-fabric/decisions.md Round 3 section).
#

- name: Deploy fabric infrastructure
  hosts: all
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Display deployment info
      debug:
        msg: |
          Deploying to host: {{ inventory_hostname }}
          Ansible version: {{ ansible_version.full }}
          Playbook: deploy.yml

    - name: Load sops-encrypted secrets (controller-side, namespaced as `sops`)
      # Decrypts on the runner via community.sops + SOPS_AGE_KEY_FILE env. All
      # entries become accessible as sops.<key>. Run 26182238252 failed at
      # tailscale role assert because secrets were never loaded — the playbook
      # referenced vault_* vars that were undefined → empty → assertion failed.
      delegate_to: localhost
      become: false
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/secrets.sops.yml"
        name: sops
      no_log: true

    - name: Expose sops keys as flat vault_* facts for role consumption
      # The roles use the vault_* naming convention. Map sops.<key> → vault_<key>
      # in a single set_fact so the rest of the playbook is unchanged. Defaults
      # for optional keys ('' for empty) prevent jinja2 KeyError when a sops
      # field is intentionally blank (e.g. anthropic_api_key fallback).
      delegate_to: localhost
      become: false
      set_fact:
        vault_tailscale_auth_key:           "{{ sops.tailscale_auth_key }}"
        vault_vaultwarden_admin_password:   "{{ sops.vaultwarden_initial_admin_password }}"
        vault_vaultwarden_admin_token:      "{{ sops.vaultwarden_admin_token }}"
        vault_telegram_bot_token:           "{{ sops.telegram_bot_token }}"
        vault_telegram_forum_chat_id:       "{{ sops.telegram_forum_chat_id }}"
        vault_telegram_ops_thread_id:       "{{ sops.telegram_ops_thread_id | default('0') }}"
        vault_claude_code_oauth_token:      "{{ sops.claude_code_oauth_token | default('') }}"
        vault_anthropic_api_key:            "{{ sops.anthropic_api_key | default('') }}"
        vault_openai_api_key:               "{{ sops.openai_api_key | default('') }}"
        vault_deepgram_api_key:             "{{ sops.deepgram_api_key | default('') }}"
        vault_github_deploy_pat:            "{{ sops.github_deploy_pat | default('') }}"
        vault_restic_repository:            "{{ sops.restic_repository }}"
        vault_restic_password:              "{{ sops.restic_password }}"
        vault_kaneo_api_token:              "{{ sops.kaneo_api_token | default('PLACEHOLDER_FILL_AFTER_KANEO_FIRST_DEPLOY') }}"
      no_log: true

    - name: Wait for system to stabilize post-boot
      wait_for:
        timeout: 30
      when: ansible_os_family == 'Debian'

    - name: Update apt cache (one-time at start)
      apt:
        update_cache: yes
        cache_valid_time: 600

  roles:
    # Phase 1: Base infrastructure (OS, users, security)
    - role: base
      tags: [base, always]
      vars:
        fabric_hostname: "{{ inventory_hostname }}"
        base_operator_user: "operator"

    - role: ssh-hardening
      tags: [ssh-hardening, security]
      vars:
        ssh_hardening_disable_password_auth: true
        ssh_hardening_key_rotation_days: 90

    # Phase 2: VPN + secrets (Tailscale + Vaultwarden)
    - role: tailscale
      tags: [tailscale, networking]
      vars:
        # Role's var is named `tailscale_authkey` (no underscore between auth
        # and key). Don't rename; map the sops field to what the role expects.
        tailscale_authkey: "{{ vault_tailscale_auth_key }}"
        tailscale_hostname: "{{ inventory_hostname }}"
        tailscale_routes: ["10.0.0.0/8"]

    - role: vaultwarden
      tags: [vaultwarden, secrets]
      vars:
        vaultwarden_data_dir: "/opt/vaultwarden"
        vaultwarden_initial_admin_password: "{{ vault_vaultwarden_admin_password | default('') }}"
        # Run 26185680537 failed at "Assert required secrets are provided" —
        # the role checks `vaultwarden_admin_token`, but only the initial
        # admin password was being passed. Map the second sops field too.
        vaultwarden_admin_token: "{{ vault_vaultwarden_admin_token }}"
        vaultwarden_tailnet_bind_only: true

    # Phase 3: Observability + Telegram (Kaneo + Bot setup)
    # Kaneo is DESCOPED for first happy-path deploy (run 26212106417):
    # the upstream ghcr.io/usekaneo/kaneo:latest image's port-binding and
    # /api/health endpoint don't match what this role assumes — probe got
    # Connection refused on tailscale_ip:3030 after 10min of retries. The
    # observability stack is not on the critical path (operator → Telegram
    # bot → Claude on VM). Re-enable by setting kaneo_enabled=true after
    # the compose template / env vars are aligned with the real image.
    - role: kaneo
      tags: [kaneo, observability]
      when: kaneo_enabled | default(false) | bool
      vars:
        kaneo_data_dir: "/opt/kaneo"
        kaneo_api_token: "{{ vault_kaneo_api_token }}"
        kaneo_projects:
          - mnemonic-core
          - mnemonic-mcp
          - mnemonic-wasm
          - mnemonic-demo-client
          - mnemonic-docs
          - mnemonic-loop

    - role: telegram-init
      tags: [telegram-init, communication]
      vars:
        telegram_bot_token: "{{ vault_telegram_bot_token | default('') }}"
        telegram_forum_chat_id: "{{ vault_telegram_forum_chat_id | default('') }}"
        telegram_topics:
          - name: core
            description: "mnemonic-core development"
          - name: mcp
            description: "MCP protocol work"
          - name: wasm
            description: "WASM compilation + browser harness"
          - name: demo-client
            description: "Demo client integration"
          - name: docs
            description: "Documentation + user-spec"
          - name: loop
            description: "Fabric recursive self-hosting"
          - name: protocol-qa
            description: "Protocol QA and testing"
          - name: ops
            description: "Operational alerts + safe-mode"

    # Phase 4: Persistence (backups)
    # DESCOPED for happy-path first deploy (run 26222590804):
    # restic init fails with auth error on Hetzner Storage Box — the user
    # needs to upload an SSH key to the Storage Box admin UI first
    # (https://robot.hetzner.com/storage), then mirror the corresponding
    # private key into /root/.ssh/ on the VM (or use the operator's key).
    # Re-enable by setting restic_backups_enabled=true.
    - role: restic-backups
      tags: [restic-backups, persistence]
      when: restic_backups_enabled | default(false) | bool
      vars:
        restic_repository: "{{ vault_restic_repository | default('') }}"
        restic_password: "{{ vault_restic_password | default('') }}"
        # Role's assertion requires telegram_bot_token + telegram_ops_chat_id
        # for failure notifications. ops topic lives inside the forum
        # supergroup, so chat_id = forum_chat_id (cast to string — sops emits
        # the negative number as int).
        telegram_bot_token: "{{ vault_telegram_bot_token | default('') }}"
        telegram_ops_chat_id: "{{ vault_telegram_forum_chat_id | string }}"
        telegram_ops_thread_id: "{{ vault_telegram_ops_thread_id | default('0') }}"
        restic_backup_paths:
          - /opt/vaultwarden
          - /opt/mnemonic-loop
        restic_retention_days: 30

    # Phase 5: Development substrate (molyanov)
    - role: molyanov
      tags: [molyanov, substrate]
      vars:
        # cloud-init created 'op'; the role's default 'mnemonic-operator'
        # doesn't exist (run 26223696015: "chown failed: failed to look
        # up user mnemonic-operator"). Also override the matching home dir.
        molyanov_operator_user: op
        molyanov_operator_home: /home/op
        # Real ops-topic id from telegram-init (set in topics inventory);
        # role's default is "0" because the role defaults file used to
        # self-reference and produced a recursive-template loop.
        molyanov_telegram_ops_topic_id: "{{ vault_telegram_ops_thread_id | default('0') }}"
        molyanov_skills_path: "/opt/molyanov/skills"
        molyanov_pk_guard_enabled: true

    # Phase 6: Attestation + MCP (DESCOPED 2026-05 — disabled by default).
    # The role still runs every deploy but installs only no-op stub hooks when
    # `mnemonic_mcp_enabled` is false. Flip to true once the local Mnemonic MCP
    # server is production-ready (backlog: work/mnemonic-attestation-integration/).
    - role: mnemonic-mcp
      tags: [mnemonic-mcp, attestation]
      vars:
        # Don't restate mnemonic_mcp_enabled here — referencing the same
        # var name on the LHS produced a Jinja recursive-template loop
        # ("{{ mnemonic_mcp_enabled | default(false) }}" expands to itself —
        # run 26228514662). The role default (defaults/main.yml) already
        # pins it to false; operator overrides via group_vars or CLI.
        mnemonic_mcp_install_dir: "/opt/mnemonic-mcp"
        mnemonic_mcp_hooks:
          - post-deploy.sh
          - post-feature.sh
          - post-merge.sh
          - post-rollback.sh
          - pre-deploy.sh

    # Phase 7: Fabric services deployment
    - role: fabric-services
      tags: [fabric-services, deploy]
      vars:
        # cloud-init created `op`; default `operator` doesn't exist.
        base_operator_user: op
        # The fabric/ source tree lives at the repo root, two levels up
        # from this playbook (infrastructure/ansible/playbooks/). Compute
        # absolute path on the controller. Was previously lookup(env, PWD)
        # which depended on the runner's shell cwd.
        fabric_repo_checkout: "{{ playbook_dir | dirname | dirname | dirname }}"
        fabric_target_dir: "/opt/fabric"
        workspace_manager_listen_ip: "127.0.0.1"
        workspace_manager_listen_port: 8080
        workspace_manager_capacity: 10
        workspace_manager_sccache_enabled: true
        fabric_services:
          - name: workspace-manager
            systemd_unit: workspace-manager.service
          - name: fabric-watchdog
            systemd_timer: fabric-watchdog.timer
            systemd_unit: fabric-watchdog.service

    # Phase 8: Telegram AI agent
    - role: telegram-ai-agent
      tags: [telegram-ai-agent, bot]
      vars:
        telegram_ai_agent_repo_url: "{{ vault_telegram_ai_agent_repo | default('https://github.com/pavel-molyanov/telegram-ai-agent.git') }}"
        telegram_ai_agent_ref: "{{ vault_telegram_ai_agent_ref | default('main') }}"
        telegram_ai_agent_install_dir: "/opt/telegram-ai-agent"
        telegram_ai_agent_bot_token: "{{ vault_telegram_bot_token | default('') }}"
        telegram_ai_agent_workspace_manager_url: "http://127.0.0.1:8080"
        telegram_ai_agent_per_topic_config: "{{ fabric_topic_matrix }}"

  post_tasks:
    - name: Verify all services are running
      block:
        - name: Check systemd services
          # mnemonic-mcp only added to the loop when the role is enabled
          # (descoped 2026-05; backlog: work/mnemonic-attestation-integration/)
          systemd:
            name: "{{ item }}"
            state: started
          register: service_check
          loop: "{{ ['workspace-manager', 'telegram-ai-agent']
                    + (['mnemonic-mcp'] if (mnemonic_mcp_enabled | default(false) | bool) else []) }}"
          failed_when: false

        - name: Report service status
          debug:
            msg: |
              Service Status Summary:
              {% for service in service_check.results %}
                {{ service.item }}: {{ 'running' if service.changed == false else 'restarted' }}
              {% endfor %}

    - name: Export deployment outputs
      set_fact:
        deployment_outputs:
          hostname: "{{ ansible_hostname }}"
          ipv4_address: "{{ ansible_default_ipv4.address }}"
          tailscale_ip: "{{ hostvars[inventory_hostname].get('tailscale_ip', 'pending') }}"
          workspace_manager_url: "http://127.0.0.1:8080"
          vaultwarden_url: "https://vault.{{ inventory_hostname }}"
          kaneo_url: "http://127.0.0.1:3000"
          deployment_timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: Display deployment summary
      debug:
        msg: |
          ====== FABRIC DEPLOYMENT COMPLETE ======
          Hostname: {{ deployment_outputs.hostname }}
          IPv4: {{ deployment_outputs.ipv4_address }}
          Workspace Manager: {{ deployment_outputs.workspace_manager_url }}
          Vaultwarden: {{ deployment_outputs.vaultwarden_url }}
          Kaneo: {{ deployment_outputs.kaneo_url }}
          Deployed: {{ deployment_outputs.deployment_timestamp }}
          =========================================
