---
# Local-only scenario: not wired into CI as of 2026-06. Updates expected when
# the npm install path is exercised inside the container.
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    mnemonic_mcp_enabled: true
    mnemonik_mcp_npm_package: "@mnemonik-xyz/mcp"
    mnemonik_mcp_npm_version: "0.2.4"
    mnemonik_mcp_install_dir: /opt/mnemonik-mcp
    mnemonic_mcp_service_user: mnemonic-mcp
    mnemonic_mcp_service_group: mnemonic-mcp
    mnemonic_mcp_systemd_unit: mnemonic-mcp.service
  roles:
    - role: mnemonic-mcp
