---
- name: Assert required secrets are provided
  ansible.builtin.assert:
    that:
      - vaultwarden_admin_token is defined
      - vaultwarden_admin_token | length >= 32
    fail_msg: 'vaultwarden role requires VAULTWARDEN_ADMIN_TOKEN from sops. See README.md.'
    quiet: true
  no_log: true

- name: Assert tailscale_ip fact is available
  ansible.builtin.assert:
    that:
      - tailscale_ip is defined
      - tailscale_ip | length > 0
    fail_msg: 'tailscale_ip fact not set. Ensure tailscale role is applied before vaultwarden.'
    quiet: true

- name: Install Docker and Docker Compose plugin
  become: true
  block:
    - name: Check if Docker is installed
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      failed_when: false

    - name: Ensure /etc/apt/keyrings/ exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: docker_version.rc != 0

    - name: Download Docker GPG key (ASCII-armored)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      when: docker_version.rc != 0

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      when: docker_version.rc != 0

    - name: Install Docker and Docker Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: true
      when: docker_version.rc != 0
      register: docker_install
      changed_when: docker_install.changed

    - name: Ensure Docker daemon is started and enabled
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
        daemon_reload: true

    - name: Add op user to docker group
      ansible.builtin.user:
        name: op
        groups: docker
        append: true
      register: docker_group_add

    - name: Reset ssh connection to pick up new group
      ansible.builtin.meta: reset_connection
      when: docker_group_add is changed

- name: Create Vaultwarden directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: op
    group: op
    mode: '0700'
  loop:
    - /opt/vaultwarden
    - /opt/vaultwarden/data
    # conf.d must exist for caddy's import-glob even if empty.
    - /opt/vaultwarden/caddy_conf_d

- name: Generate docker-compose.yml from template
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/vaultwarden/docker-compose.yml
    owner: op
    group: op
    mode: '0600'
  register: compose_template
  notify: Restart vaultwarden

- name: Generate Caddyfile from template
  become: true
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/vaultwarden/Caddyfile
    owner: op
    group: op
    mode: '0644'
  register: caddyfile_template
  notify: Reload caddy

- name: Create environment file for Vaultwarden
  become: true
  ansible.builtin.template:
    src: vaultwarden.env.j2
    dest: /opt/vaultwarden/.env
    owner: op
    group: op
    mode: '0600'
  register: env_file
  no_log: true
  notify: Restart vaultwarden

- name: Run docker compose to start stack
  community.docker.docker_compose_v2:
    project_src: /opt/vaultwarden
    state: present
    pull: missing
  environment:
    COMPOSE_PROJECT_NAME: vaultwarden
  become: true
  become_user: op
  register: compose_result
  # no_log removed for diagnostic visibility — docker compose itself does
  # not print secrets; secrets are in /opt/vaultwarden/.env mounted from
  # disk, not in process args.

- name: Add /etc/hosts entry for vault.<fabric>.ts → tailscale_ip
  # Run 26203906562 ran compose successfully but the probe URL
  # https://vault.mnemonic-fabric.ts/api/health never resolved (no DNS for
  # .ts custom tailnet domain). Add a hosts entry so VM-local lookups
  # resolve to the tailnet IP (also lets operator hit the same URL).
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^[0-9.]+\\s+{{ vaultwarden_tailnet_domain | regex_escape }}\\s*$"
    line: "{{ tailscale_ip }} {{ vaultwarden_tailnet_domain }}"
    state: present

- name: Wait for Vaultwarden API to be healthy (via caddy on tailnet IP:8443)
  # Probe the caddy reverse-proxy that fronts vaultwarden. Caddy listens on
  # `{vault_domain}:8443` with `tls internal` (self-signed); validate_certs
  # is false so we accept that. Probe runs ON THE VM, so the hosts entry
  # above resolves the domain to tailscale_ip locally.
  ansible.builtin.uri:
    url: "https://{{ vaultwarden_tailnet_domain }}:{{ vaultwarden_https_port }}/alive"
    method: GET
    status_code: [200, 401]   # vaultwarden returns 401 for /api/* until login; /alive returns 200
    validate_certs: false
  register: health_result
  until: health_result.status in [200, 401]
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false

- name: Show health probe outcome
  ansible.builtin.debug:
    msg: "Vaultwarden probe status={{ health_result.status | default('no-status') }} url={{ health_result.url | default('?') }}"

- name: Diagnostic — docker ps + container logs (run only if probe failed)
  when: health_result.status is not defined or health_result.status not in [200, 401]
  become: true
  block:
    - name: docker ps
      ansible.builtin.command: docker ps -a --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
      register: ps_out
      changed_when: false
    - name: show docker ps
      ansible.builtin.debug:
        msg: "{{ ps_out.stdout_lines }}"

    - name: caddy logs (last 80 lines)
      ansible.builtin.command: docker logs --tail 80 vaultwarden-caddy-1
      register: caddy_logs
      changed_when: false
      failed_when: false
    - name: show caddy logs
      ansible.builtin.debug:
        msg: "{{ caddy_logs.stdout_lines + caddy_logs.stderr_lines }}"

    - name: vaultwarden logs (last 50 lines)
      ansible.builtin.command: docker logs --tail 50 vaultwarden-vaultwarden-1
      register: vw_logs
      changed_when: false
      failed_when: false
    - name: show vaultwarden logs
      ansible.builtin.debug:
        msg: "{{ vw_logs.stdout_lines + vw_logs.stderr_lines }}"

    - name: ss -ltn (what's listening?)
      ansible.builtin.command: ss -ltn
      register: ss_out
      changed_when: false
      failed_when: false
    - name: show listening sockets
      ansible.builtin.debug:
        msg: "{{ ss_out.stdout_lines }}"

- name: Fail if health probe never reached vaultwarden
  ansible.builtin.fail:
    msg: |
      Vaultwarden health probe failed after 150s.
      See preceding debug tasks for docker ps, caddy logs, vaultwarden logs, ss -ltn.
  when: health_result.status is not defined or health_result.status not in [200, 401]

- name: Operator note - register first admin user via web UI
  ansible.builtin.debug:
    msg: >-
      Vaultwarden is now running. To register your first user account:
      1. Visit https://{{ vaultwarden_tailnet_domain }}/admin
      2. Log in with ADMIN_TOKEN (from sops)
      3. Click "Create Admin" to register the initial user
      4. Set your master password and complete registration
      This is the upstream Vaultwarden design: admin password is set interactively on first login, not seeded.

- name: Verify Vaultwarden and Caddy containers are running
  ansible.builtin.shell: |
    docker ps --filter "label=com.docker.compose.service=vaultwarden" --format "{{.Names}}"
    docker ps --filter "label=com.docker.compose.service=caddy" --format "{{.Names}}"
  register: container_check
  failed_when: container_check.stdout_lines|length < 2
  changed_when: false
