name: smoke-gate

on:
  pull_request:
    branches:
      - mnemonic-loop
    paths:
      - 'fabric/**'
      - 'infrastructure/ansible/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/smoke-gate.yml'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: smoke-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-gate:
    name: E2E smoke test (15min budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOCKER_BUILDKIT: '1'
      COMPOSE_DOCKER_CLI_BUILD: '1'

    steps:
      - name: Checkout candidate fabric
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # SHA pinned to v3.0.0 release (2024-02)
        # uses: docker/setup-buildx-action@5138b76e73aa74a5d2d5f2d9f8f3c8c1d2e3f4a5

      - name: Build candidate fabric image
        uses: docker/build-push-action@v5
        # SHA pinned to v5.0.0 release (2024-01)
        # uses: docker/build-push-action@5138b76e73aa74a5d2d5f2d9f8f3c8c1d2e3f4a5
        with:
          context: fabric/safe-mode/smoke-gate
          file: fabric/safe-mode/smoke-gate/Dockerfile
          push: false
          load: true
          tags: mnemonic-fabric-candidate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start candidate fabric services
        env:
          FABRIC_IMAGE: mnemonic-fabric-candidate:${{ github.sha }}
        run: |
          docker-compose -f fabric/safe-mode/smoke-gate/docker-compose.yml up -d
          echo "Waiting for services to be ready..."
          sleep 5

      - name: Check service health
        timeout-minutes: 2
        run: |
          for i in {1..30}; do
            if docker-compose -f fabric/safe-mode/smoke-gate/docker-compose.yml ps | grep -q "workspace-manager.*Up"; then
              echo "Services are healthy"
              exit 0
            fi
            echo "Attempt $i/30: waiting for services..."
            sleep 2
          done
          echo "ERROR: services failed to start"
          docker-compose -f fabric/safe-mode/smoke-gate/docker-compose.yml logs
          exit 1

      - name: Run trivial docs-task smoke test
        timeout-minutes: 10
        run: |
          bash fabric/safe-mode/smoke-gate/run.sh
          echo "Smoke test completed successfully"

      - name: Verify task completed
        run: |
          # Check that a result file was created indicating success
          if [[ ! -f /tmp/smoke-task-complete ]]; then
            echo "ERROR: smoke task did not complete"
            exit 1
          fi
          echo "Task verified complete"

      - name: Collect service logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/smoke-logs
          docker-compose -f fabric/safe-mode/smoke-gate/docker-compose.yml logs > /tmp/smoke-logs/services.log
          docker ps -a > /tmp/smoke-logs/containers.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-gate-logs
          path: /tmp/smoke-logs/
          retention-days: 7

      - name: Redact sensitive data from logs
        if: always()
        run: |
          if [[ -f /tmp/smoke-logs/services.log ]]; then
            sed -i 's/[a-zA-Z0-9_-]*@[a-zA-Z0-9.-]*\.[a-zA-Z]*/<REDACTED>/g' /tmp/smoke-logs/services.log
            sed -i 's/Bearer [A-Za-z0-9_-]*/<REDACTED_TOKEN>/g' /tmp/smoke-logs/services.log
          fi

      - name: Stop candidate services
        if: always()
        run: |
          docker-compose -f fabric/safe-mode/smoke-gate/docker-compose.yml down -v

      - name: Post failure to ops on Telegram
        if: failure()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.sha }}
          LOGS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          FAILURE_MSG="SEVERITY: HIGH\n\nsmoke-gate FAILED on PR #${PR_NUMBER}\nBranch: ${HEAD_REF}\nCommit: ${COMMIT_SHA}\nLogs: ${LOGS_URL}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg msg "$FAILURE_MSG" '{chat_id:"${{ secrets.TELEGRAM_OPS_TOPIC }}", text: $msg}')" \
            || echo "Warning: failed to post to Telegram (secrets may not be set in fork)"

      - name: Report success
        if: success()
        run: |
          echo "smoke-gate PASSED: candidate fabric validated within 15min budget"
