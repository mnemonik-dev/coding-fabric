<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Browser Tests</title>
</head>
<body>
    <h1>WASM Browser Equivalence Test</h1>
    <div id="status">Loading...</div>
    <script type="module">
        const status = document.getElementById('status');

        async function initWasm() {
            try {
                status.textContent = 'WASM initialized (stub mode)';
            } catch (e) {
                status.textContent = 'WASM initialization failed: ' + e.message;
            }
        }

        initWasm();
    </script>
</body>
</html>
