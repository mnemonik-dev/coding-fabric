  source_findings: |
    - Python 3.12+ using uv; aiogram-based bot
    - Two execution-mode axis per topic: tmux (persistent dev session) OR subprocess (one-off)
    - Three stream modes: verbose / live / minimal
    - /tui live screenshot of agent's terminal with button-driven Enter/Esc/arrows/digits
    - Bundled MCP server (mcp-servers/bot/) so agent can post messages/images/docs back to Telegram (two-way)
    - Voice transcription via Deepgram
    - Photo + document + forward batching
    - Reply-based session resume + /resume command + picker_store
    - Per-user auth allowlist by Telegram user ID
    - Modal detection: tmux watchdog surfaces interactive prompts
    - Topic-config schema: chat_id, thread_id, cwd, mode, engine, exec_mode, stream_mode, mcp_config, model
    - Bundled skills: bot-setup, topic-setup, project-knowledge (in .claude/skills/)
    - Systemd template at docs/systemd/
    - CI at .github/workflows/ci.yml
  note: |
    Original stub at user-spec.md assumed a thin transport bridge with ~10 questions and size M.
