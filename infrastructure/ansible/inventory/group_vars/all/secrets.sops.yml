---
# sops encrypted secrets for safe-mode-rollback.yml
# Encrypt with: sops -e secrets.sops.yml.example > secrets.sops.yml
# Decrypt by: sops -d secrets.sops.yml (requires age key in ~/.config/sops/age/keys.txt)
#
# DO NOT commit unencrypted credentials.
# Configure age key before deploying:
#   age-keygen -o ~/.config/sops/age/keys.txt
#
# Example .sops.yaml in repo root:
#   creation_rules:
#     - path_regex: infrastructure/ansible/inventory/group_vars/all/secrets\.sops\.yml
#       key_groups:
#         - age: YOUR_AGE_PUBLIC_KEY_HERE
#

# Telegram bot token (from Telegram @BotFather)
# Example: 123456789:ABCdefGHIjklmnoPQRstuvWXYZ-1a2b3c4d5e
telegram_bot_token: ENC[AES256_GCM,data:ENCRYPTED_TOKEN_HERE,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]

# Telegram chat ID for ops alerts (usually -100 + the channel ID)
# Example: -1001234567890
telegram_ops_topic: ENC[AES256_GCM,data:ENCRYPTED_TOPIC_HERE,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]

# sops file metadata (updated automatically by sops)
sops:
  kms: []
  gcp_kms: []
  azure_kv: []
  hc_vault: []
  age:
    - recipient: age1PLACEHOLDER_REPLACE_WITH_YOUR_AGE_KEY
      enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        PLACEHOLDER_REPLACE_WITH_ACTUAL_ENCRYPTION
        -----END AGE ENCRYPTED FILE-----
  lastmodified: '2026-05-12T00:00:00Z'
  mac: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]
  pgp: []
  unencrypted_suffix: _unencrypted
  version: 3.7.3
