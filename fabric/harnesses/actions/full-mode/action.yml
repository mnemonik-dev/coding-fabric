name: Full-Mode Harness
description: "End-to-end integration test: Solana devnet + Arweave testnet + independent verifier"

inputs:
  solana_rpc_url:
    description: "Solana RPC endpoint (optional, stub mode if not provided)"
    required: false
    default: ""
  arweave_rpc_url:
    description: "Arweave RPC endpoint (optional, stub mode if not provided)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio requests
      shell: bash

    - name: Run full-mode harness (stub mode)
      run: |
        cd fabric/harnesses/full-mode
        MNEMONIC_MODE=stub make verify
      shell: bash
      env:
        SOLANA_RPC_URL: ${{ inputs.solana_rpc_url || 'http://localhost:8899' }}
        ARWEAVE_RPC_URL: ${{ inputs.arweave_rpc_url || 'http://localhost:1984' }}

    - name: Run independent verifier (stub mode)
      if: always()
      timeout-minutes: 5
      run: |
        cd fabric/harnesses/full-mode
        echo "attestation-stub-bytes" | python3 independent_verifier.py --expected-hash=$(echo -n "stub" | sha256sum | cut -d' ' -f1)
      shell: bash

    - name: Upload harness artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-mode-report
        path: |
          fabric/harnesses/full-mode/reports/
          fabric/harnesses/full-mode/.pytest_cache/
          !**/*.key
          !**/*keypair*.json
          !**/.env*
        retention-days: 7
