---
# Local-only assertions. Not wired into CI — see role README TODO.
- name: Verify
  hosts: all
  gather_facts: true
  vars:
    mnemonik_mcp_install_dir: /opt/mnemonik-mcp
  tasks:
    - name: Verify pinned package-lock.json present in install dir
      ansible.builtin.stat:
        path: "{{ mnemonik_mcp_install_dir }}/package-lock.json"
      register: lockfile_stat

    - name: Assert lockfile present
      ansible.builtin.assert:
        that:
          - lockfile_stat.stat.exists
        fail_msg: package-lock.json missing in install dir

    - name: Verify Mnemonik MCP binary on PATH (cascade)
      ansible.builtin.shell: |
        set -euo pipefail
        which mnemonik-mcp || which mnemonic-mcp
      args:
        executable: /bin/bash
      register: which_check
      changed_when: false

    - name: Assert binary discoverable
      ansible.builtin.assert:
        that:
          - which_check.rc == 0
          - (which_check.stdout | trim) | length > 0
        fail_msg: neither mnemonik-mcp nor mnemonic-mcp on PATH

    # The role explicitly removes any legacy systemd unit. Assert it stays
    # gone so a regression that re-introduces the daemon would fail verify.
    - name: Verify obsolete mnemonic-mcp.service is absent
      ansible.builtin.stat:
        path: /etc/systemd/system/mnemonic-mcp.service
      register: legacy_unit_stat

    - name: Assert obsolete mnemonic-mcp.service is absent
      ansible.builtin.assert:
        that:
          - not legacy_unit_stat.stat.exists
        fail_msg: |
          mnemonic-mcp.service exists; this role no longer ships a daemon
          (MCP-stdio is a per-spawn subprocess pattern, not a long-lived
          service). Old unit must be removed.
