---
- name: Converge
  hosts: all
  become: true
  vars:
    fabric_hostname: mnemonic-fabric
    # NOTE: In real deployment, tailscale_authkey comes from sops-encrypted secrets.
    # For molecule test, we set a dummy value to allow syntax validation.
    # The actual authentication will fail in the test container, but the role structure
    # and idempotency can still be verified.
    tailscale_authkey: "tskey-dummy-key-for-testing"
  roles:
    - role: tailscale
