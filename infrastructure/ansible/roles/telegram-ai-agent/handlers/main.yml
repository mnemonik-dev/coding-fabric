---
- name: Daemon reload
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: yes
  listen: Daemon reload

# Use shell-with-||-true because the systemd_service module raises an
# exception (not a soft failure) when the unit was never started, even
# with failed_when: false. We want the handler to be a complete no-op
# on first deploy when the service hasn't started yet — the dedicated
# Enable + start task later brings it up cleanly.
- name: Reload telegram-ai-agent
  become: true
  ansible.builtin.shell: |
    systemctl restart telegram-ai-agent 2>&1 || true
  listen: Reload telegram-ai-agent
  changed_when: false
