---
# molyanov-ai-dev install — clone the upstream skills bundle and expose its
# .claude/skills tree to the operator's Claude Code harness.
#
# Round 2 scope change (2026-05): upstream source consolidated to the canonical
# repository `https://github.com/pavel-molyanov/molyanov-ai-dev` (shell-based
# skills + bash hooks, MIT). We clone the pinned tag to /opt/molyanov-ai-dev
# and symlink its top-level `skills/` directory into the operator's
# `~/.claude/skills/` so the bundle is discoverable by Claude Code.

- name: Ensure git is installed
  ansible.builtin.package:
    name: git
    state: present
  become: true

- name: Ensure molyanov directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ molyanov_operator_user }}"
    group: "{{ molyanov_operator_user }}"
    mode: '0755'
  loop:
    - "{{ molyanov_operator_home }}/.claude/skills"
    - "{{ molyanov_operator_home }}/.fabric/molyanov/hooks"

- name: Ensure molyanov install dir exists
  ansible.builtin.file:
    path: "{{ molyanov_install_dir }}"
    state: directory
    owner: "{{ molyanov_operator_user }}"
    group: "{{ molyanov_operator_user }}"
    mode: '0755'
  become: true

- name: Clone molyanov-ai-dev skills bundle at pinned tag
  ansible.builtin.git:
    repo: "{{ molyanov_repo }}"
    dest: "{{ molyanov_install_dir }}"
    version: "{{ molyanov_version }}"
    update: true
    force: true
    depth: 1
  become: true
  become_user: "{{ molyanov_operator_user }}"
  register: molyanov_skills_clone

- name: Remove legacy nested skills symlink (~/.claude/skills/molyanov-ai-dev)
  # Until 2026-07 the role symlinked the whole upstream bundle as ONE nested
  # dir: ~/.claude/skills/molyanov-ai-dev/<skill>/SKILL.md. Claude Code
  # resolves personal skills at ~/.claude/skills/<skill>/SKILL.md, so the
  # nested layout was either invisible (skills never discovered under the
  # names the operator expected — "alias is different") or, where nested
  # discovery kicked in, a full duplicate of the curated flat bundle that
  # the telegram-ai-agent role syncs into the same tree — duplicate skill
  # names either way. The flat curated bundle
  # (infrastructure/ansible/files/claude-skills/) is the single source of
  # truth now; the clone at {{ molyanov_install_dir }} remains for operator
  # reference and upstream diffing only.
  ansible.builtin.file:
    path: "{{ molyanov_operator_home }}/.claude/skills/molyanov-ai-dev"
    state: absent
  become: true
  become_user: "{{ molyanov_operator_user }}"

- name: Render molyanov global config
  ansible.builtin.template:
    src: global.yml.j2
    dest: "{{ molyanov_operator_home }}/.fabric/molyanov/global.yml"
    owner: "{{ molyanov_operator_user }}"
    group: "{{ molyanov_operator_user }}"
    mode: '0644'
  notify: Molyanov config changed

- name: Install pk-guard pre-write hook
  ansible.builtin.copy:
    src: pk-guard.sh
    dest: "{{ molyanov_operator_home }}/.fabric/molyanov/hooks/pk-guard.sh"
    owner: "{{ molyanov_operator_user }}"
    group: "{{ molyanov_operator_user }}"
    mode: '0755'
  notify: Molyanov hook installed

- name: Install ops-notify wrapper hook
  ansible.builtin.copy:
    src: ops-notify.sh
    dest: "{{ molyanov_operator_home }}/.fabric/molyanov/hooks/ops-notify.sh"
    owner: "{{ molyanov_operator_user }}"
    group: "{{ molyanov_operator_user }}"
    mode: '0755'
  notify: Molyanov hook installed

- name: Verify molyanov bundle clone exists
  ansible.builtin.stat:
    path: "{{ molyanov_install_dir }}/skills"
  register: molyanov_skills_stat

- name: Assert molyanov bundle cloned (skills tree present in install dir)
  ansible.builtin.assert:
    that:
      - molyanov_skills_stat.stat.exists
      - molyanov_skills_stat.stat.isdir
    fail_msg: "molyanov-ai-dev bundle clone failed (expected {{ molyanov_install_dir }}/skills)"

- name: Verify pk-guard hook installed
  ansible.builtin.stat:
    path: "{{ molyanov_operator_home }}/.fabric/molyanov/hooks/pk-guard.sh"
  register: molyanov_pk_guard_stat

- name: Assert pk-guard hook is executable
  ansible.builtin.assert:
    that:
      - molyanov_pk_guard_stat.stat.exists
      - molyanov_pk_guard_stat.stat.executable
    fail_msg: "pk-guard.sh hook installation or permissions failed"
