---
galaxy_info:
  role_name: base
  namespace: fabric
  description: OS hardening, firewall, operator user, and base directories
  company: Mnemonic Protocol
  author: Mnemonic Development
  license: proprietary
  min_ansible_version: '2.16'
  platforms:
    - name: Ubuntu
      versions:
        - '24.04'
  galaxy_tags:
    - infrastructure
    - hardening
    - firewall

# Collection requirements (community.general, ansible.posix) are installed
# externally via `ansible-galaxy collection install -r requirements.yml` from
# the CI workflow and the operator bootstrap script. They cannot be listed
# under `dependencies:` here — that key is for role dependencies only and
# treating collections as roles fails playbook parse with "role X was not found".
dependencies: []
