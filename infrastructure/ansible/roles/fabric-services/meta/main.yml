---
galaxy_info:
  author: Mnemonic Protocol
  description: Deploy compiled fabric services to the VM
  company: Mnemonic
  license: MPL-2.0
  min_ansible_version: '2.16'
  platforms:
    - name: Ubuntu
      versions:
        - '24.04'
  galaxy_tags:
    - fabric
    - deployment
    - services
    - python
    - systemd

dependencies: []
# All ordering is enforced by the playbook (deploy.yml roles list);
# meta-dependencies have been removed because Ansible re-runs each listed
# dep with role defaults only — the playbook's `vars:` block does NOT
# propagate. That broke vaultwarden's assertion on first deploy
# (run 26229892893: "Assert required secrets are provided" failed in the
# meta-dep invocation while the top-level vaultwarden run had succeeded
# minutes earlier). The playbook's ordered roles list already guarantees
# base → vaultwarden → kaneo → ... → fabric-services sequencing.
# workspace-manager is implemented as a sub-component (systemd service)
# INSIDE this role, not as a separate role.
