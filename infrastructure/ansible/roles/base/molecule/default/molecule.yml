---
dependency:
  name: galaxy
driver:
  name: docker
provisioner:
  name: ansible
  options:
    vvv: false
  inventory:
    host_vars:
      localhost:
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
platforms:
  - name: base-test
    image: ubuntu:24.04
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroups_mode: host
