name: deploy-paywall-staging

# An approval-gated, manual-only deployment to the isolated Arc Testnet
# staging stack. It deliberately does not deploy the production MCP service or
# accept production-network parameters.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'diagnose (read-only), bootstrap SOPS config, apply, or rollback'
        type: choice
        required: true
        default: diagnose
        options: [diagnose, bootstrap, apply, rollback]
      facilitator_image:
        description: 'Immutable GHCR digest reference (required for apply/rollback)'
        type: string
        required: false
      approval_ui_image:
        description: 'Immutable approval UI GHCR digest reference (required for apply/rollback)'
        type: string
        required: false
      mcp_image:
        description: 'Immutable Mnemonic MCP GHCR digest reference (required for apply/rollback)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-paywall-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.action }} paywall staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Configure this GitHub Environment with required reviewers and scoped
    # TAILSCALE_AUTH_KEY / CI_SSH_PRIVATE_KEY / SOPS_AGE_KEY secrets before
    # the first bootstrap or apply.
    environment: paywall-staging
    env:
      SERVER_NAME: mnemonic-fabric
      STACK_DIR: /opt/universal-paywall-staging
      COMPOSE_PROJECT: universal-paywall-staging
    steps:
      - uses: actions/checkout@v4

      - name: Validate requested image
        if: ${{ inputs.action == 'apply' || inputs.action == 'rollback' }}
        env:
          FACILITATOR_IMAGE: ${{ inputs.facilitator_image }}
          APPROVAL_UI_IMAGE: ${{ inputs.approval_ui_image }}
          MCP_IMAGE: ${{ inputs.mcp_image }}
        run: |
          set -euo pipefail
          for image in "$FACILITATOR_IMAGE" "$APPROVAL_UI_IMAGE" "$MCP_IMAGE"; do
            [[ "$image" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$ ]] || {
              echo '::error::each image must be a pinned ghcr.io @sha256 digest reference'; exit 1;
            }
          done

      - name: Tailscale up (ephemeral)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --accept-dns --hostname=gh-paywall-staging-${{ github.run_id }}

      - name: Resolve VM and configure SSH
        env:
          CI_SSH_PRIVATE_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            VM_IP=$(tailscale status --json 2>/dev/null | jq -r --arg name "$SERVER_NAME" '
              [(.Peer // {} | to_entries[].value)
                | select(.HostName == $name and .Online == true)
                | (.TailscaleIPs // [])[] | select(test("^100\\."))
              ] | first // ""')
            [ -n "$VM_IP" ] && break
            sleep 10
          done
          [ -n "${VM_IP:-}" ] || { echo '::error::fabric VM is not online'; exit 1; }
          printf '%s\n' "$CI_SSH_PRIVATE_KEY" > /tmp/ci_deploy_key
          chmod 600 /tmp/ci_deploy_key
          ssh-keygen -y -P '' -f /tmp/ci_deploy_key >/dev/null
          echo "VM_TARGET=op@$VM_IP" >> "$GITHUB_ENV"
          echo 'SSH_OPTS=-i /tmp/ci_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/ci_known_hosts -o ConnectTimeout=15' >> "$GITHUB_ENV"

      - name: Verify Arc Testnet exact-payment interface
        run: node infrastructure/paywall-staging/verify-arc-testnet.mjs

      - name: Set up Python for scoped staging bootstrap
        if: ${{ inputs.action == 'bootstrap' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scoped bootstrap dependencies
        if: ${{ inputs.action == 'bootstrap' }}
        env:
          ANSIBLE_GALAXY_HTTP_TIMEOUT: '120'
          SOPS_VERSION: 'v3.10.2'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'ansible-core>=2.16' jinja2 pyyaml
          ansible-galaxy collection install --timeout 120 -r infrastructure/ansible/requirements.yml
          sudo apt-get update -qq
          sudo apt-get install -y age
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          rm -f /tmp/sops

      - name: Render SOPS-backed staging contract
        if: ${{ inputs.action == 'bootstrap' }}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SOPS_AGE_KEY" ] || { echo '::error::paywall-staging requires SOPS_AGE_KEY'; exit 1; }
          mkdir -p ~/.config/sops/age infrastructure/ansible/inventory
          printf '%s\n' "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt
          sops -d infrastructure/secrets/secrets.sops.yml > /dev/null
          vm_ip="${VM_TARGET#op@}"
          cat > infrastructure/ansible/inventory/paywall-staging.yml <<EOF
          all:
            hosts:
              ${SERVER_NAME}:
                ansible_host: ${vm_ip}
                ansible_user: op
                ansible_ssh_private_key_file: /tmp/ci_deploy_key
                ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/ci_known_hosts -o ConnectTimeout=15"
                ansible_become: true
                ansible_become_method: sudo
          EOF
          ANSIBLE_ROLES_PATH="$GITHUB_WORKSPACE/infrastructure/ansible/roles" \
          SOPS_AGE_KEY_FILE="$HOME/.config/sops/age/keys.txt" \
          ansible-playbook -i infrastructure/ansible/inventory/paywall-staging.yml \
            infrastructure/ansible/playbooks/bootstrap-paywall-staging.yml
          read -r -a ssh_opts <<< "$SSH_OPTS"
          ssh "${ssh_opts[@]}" "$VM_TARGET" "sudo -n test -f '$STACK_DIR/.env' && sudo -n test -f '$STACK_DIR/secrets/receipt-private-key.pem' && sudo -n test -f '$STACK_DIR/secrets/mnemonic-id.json'"

      - name: Diagnose staging stack (read-only)
        if: ${{ inputs.action == 'diagnose' }}
        run: |
          set -euo pipefail
          read -r -a ssh_opts <<< "$SSH_OPTS"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$VM_TARGET" "STACK_DIR='$STACK_DIR' COMPOSE_PROJECT='$COMPOSE_PROJECT' bash -s" <<'REMOTE'
          set -euo pipefail
          docker_cmd() { docker info >/dev/null 2>&1 && docker "$@" || sudo -n docker "$@"; }
          echo '=== paywall staging files (names/modes only) ==='
          sudo -n find "$STACK_DIR" -maxdepth 2 -printf '%M %u:%g %p\n' 2>/dev/null || true
          echo '=== configured non-secret keys ==='
          sudo -n awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/{print $1}' "$STACK_DIR/.env" 2>/dev/null || true
          echo '=== non-secret value checks ==='
          # PAY_TO is public (it appears in every quote); modes are template
          # constants. Everything else prints only a format verdict.
          for k in SERVICE_PAY_TO UNIVERSAL_PAYWALL_PAY_TO STORAGE_MODE PAYMENT_MODE; do
            v=$(sudo -n sed -n "s|^$k=||p" "$STACK_DIR/.env" 2>/dev/null | head -1)
            echo "$k=$v"
          done
          for k in USDC_ADDRESS UNIVERSAL_PAYWALL_ASSET; do
            v=$(sudo -n sed -n "s|^$k=||p" "$STACK_DIR/.env" 2>/dev/null | head -1)
            if [[ "$v" =~ ^0x[0-9a-fA-F]{40}$ ]]; then echo "$k: valid-evm-address"; else echo "$k: INVALID-FORMAT"; fi
          done
          for k in ARC_RPC_URL SOLANA_RPC_URL IRYS_GATEWAY_URL UNIVERSAL_PAYWALL_URL; do
            v=$(sudo -n sed -n "s|^$k=||p" "$STACK_DIR/.env" 2>/dev/null | head -1)
            if [[ "$v" =~ ^https?:// ]]; then echo "$k: url-format-ok"; else echo "$k: INVALID-FORMAT"; fi
          done
          echo '=== compose state ==='
          docker_cmd compose -p "$COMPOSE_PROJECT" ps 2>/dev/null || true
          echo '=== staging image ==='
          docker_cmd ps --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --format '{{.Names}} {{.Image}} {{.Status}}' || true
          echo '=== Caddy status and recent logs ==='
          caddy=$(docker_cmd ps --filter name=vaultwarden-caddy --format '{{.Names}}' | head -1)
          if [ -n "$caddy" ]; then
            docker_cmd inspect --format '{{.Name}} state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$caddy" || true
            docker_cmd logs --tail 80 "$caddy" || true
          else
            echo 'Caddy container not found'
          fi
          echo '=== staging delivery identity (public key only) ==='
          mcp=$(docker_cmd ps --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --filter "label=com.docker.compose.service=mcp" --format '{{.Names}}' | head -1)
          if [ -n "$mcp" ]; then
            # The running server already resolved the protected explicit
            # keypair. Its startup log contains only the public key.
            docker_cmd logs --tail 200 "$mcp" 2>&1 | sed -n 's/^.*Identity: //p' | tail -1 || true
          else
            echo 'MCP container not found'
          fi
          echo '=== Arc facilitator identity (public address only) ==='
          facilitator=$(docker_cmd ps --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --filter "label=com.docker.compose.service=facilitator" --format '{{.Names}}' | head -1)
          if [ -n "$facilitator" ]; then
            docker_cmd exec "$facilitator" node -e 'const { privateKeyToAccount } = require("viem/accounts"); console.log(privateKeyToAccount(process.env.FACILITATOR_KEY).address)' || true
          else
            echo 'Facilitator container not found'
          fi
          echo '=== container health diagnostics ==='
          while IFS= read -r cid; do
            [ -n "$cid" ] || continue
            docker_cmd inspect --format '{{.Name}} state={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" || true
            docker_cmd inspect --format '{{if .State.Health}}{{range .State.Health.Log}}{{printf "%s exit=%d %s\\n" .End .ExitCode .Output}}{{end}}{{end}}' "$cid" || true
            state=$(docker_cmd inspect --format '{{.State.Status}}' "$cid" 2>/dev/null || true)
            if [ "$state" != running ]; then
              echo "--- $(docker_cmd inspect --format '{{.Name}}' "$cid") recent logs ---"
              docker_cmd logs --tail 80 "$cid" || true
            fi
          done < <(docker_cmd ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT")
          REMOTE

      - name: Install compose contract and apply image
        if: ${{ inputs.action == 'apply' || inputs.action == 'rollback' }}
        env:
          FACILITATOR_IMAGE: ${{ inputs.facilitator_image }}
          APPROVAL_UI_IMAGE: ${{ inputs.approval_ui_image }}
          MCP_IMAGE: ${{ inputs.mcp_image }}
        run: |
          set -euo pipefail
          read -r -a ssh_opts <<< "$SSH_OPTS"
          scp "${ssh_opts[@]}" infrastructure/paywall-staging/docker-compose.yml "$VM_TARGET:/tmp/paywall-staging-compose.yml"
          scp "${ssh_opts[@]}" infrastructure/paywall-staging/paywall-staging.caddy.template "$VM_TARGET:/tmp/paywall-staging.caddy.template"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$VM_TARGET" "STACK_DIR='$STACK_DIR' COMPOSE_PROJECT='$COMPOSE_PROJECT' FACILITATOR_IMAGE='$FACILITATOR_IMAGE' APPROVAL_UI_IMAGE='$APPROVAL_UI_IMAGE' MCP_IMAGE='$MCP_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          docker_cmd() { docker info >/dev/null 2>&1 && docker "$@" || sudo -n docker "$@"; }
          sudo -n install -d -m 0750 -o op -g op "$STACK_DIR/secrets"
          sudo -n install -m 0640 -o op -g op /tmp/paywall-staging-compose.yml "$STACK_DIR/docker-compose.yml"
          sudo -n install -m 0644 -o root -g root /tmp/paywall-staging.caddy.template /tmp/paywall-staging.caddy
          rm -f /tmp/paywall-staging-compose.yml
          rm -f /tmp/paywall-staging.caddy.template
          sudo -n test -f "$STACK_DIR/.env" || { echo '::error::missing SOPS-rendered staging .env'; exit 1; }
          sudo -n test -f "$STACK_DIR/secrets/receipt-private-key.pem" || { echo '::error::missing receipt signing key'; exit 1; }
          [ "$(sudo -n stat -c '%a' "$STACK_DIR/.env")" = 600 ] || { echo '::error::.env must be mode 0600'; exit 1; }
          [ "$(sudo -n stat -c '%a' "$STACK_DIR/secrets/receipt-private-key.pem")" = 600 ] || { echo '::error::receipt key must be mode 0600'; exit 1; }
          [ "$(sudo -n stat -c '%u' "$STACK_DIR/secrets/receipt-private-key.pem")" = 10001 ] || { echo '::error::receipt key must be owned by container uid 10001'; exit 1; }
          sudo -n grep -qx 'CHAIN_ID=5042002' "$STACK_DIR/.env" || { echo '::error::only Arc Testnet (5042002) is permitted'; exit 1; }
          sudo -n grep -qx 'NETWORK=arc-testnet' "$STACK_DIR/.env" || { echo '::error::network must be arc-testnet'; exit 1; }
          sudo -n grep -qx 'ANCHORING_NETWORK=devnet' "$STACK_DIR/.env" || { echo '::error::MCP anchoring must be Irys/Solana Devnet'; exit 1; }
          sudo -n grep -qx 'EXACT_PAYMENTS_ENABLED=1' "$STACK_DIR/.env" || { echo '::error::exact-only rail must be enabled'; exit 1; }
          sudo -n grep -qx 'STORAGE_MODE=full' "$STACK_DIR/.env" || { echo '::error::paid anchoring requires STORAGE_MODE=full (re-run bootstrap)'; exit 1; }
          sudo -n grep -qx 'PAYMENT_MODE=x402' "$STACK_DIR/.env" || { echo '::error::paid anchoring requires PAYMENT_MODE=x402 (re-run bootstrap)'; exit 1; }
          sudo -n grep -q '^FACILITATOR_IMAGE=' "$STACK_DIR/.env" && sudo -n sed -i 's|^FACILITATOR_IMAGE=.*|FACILITATOR_IMAGE='"$FACILITATOR_IMAGE"'|' "$STACK_DIR/.env" || echo "FACILITATOR_IMAGE=$FACILITATOR_IMAGE" | sudo -n tee -a "$STACK_DIR/.env" >/dev/null
          sudo -n grep -q '^APPROVAL_UI_IMAGE=' "$STACK_DIR/.env" && sudo -n sed -i 's|^APPROVAL_UI_IMAGE=.*|APPROVAL_UI_IMAGE='"$APPROVAL_UI_IMAGE"'|' "$STACK_DIR/.env" || echo "APPROVAL_UI_IMAGE=$APPROVAL_UI_IMAGE" | sudo -n tee -a "$STACK_DIR/.env" >/dev/null
          sudo -n grep -q '^MCP_IMAGE=' "$STACK_DIR/.env" && sudo -n sed -i 's|^MCP_IMAGE=.*|MCP_IMAGE='"$MCP_IMAGE"'|' "$STACK_DIR/.env" || echo "MCP_IMAGE=$MCP_IMAGE" | sudo -n tee -a "$STACK_DIR/.env" >/dev/null
          domain=$(sudo -n sed -n 's|^MCP_PUBLIC_BASE_URL=https://\([^/]*\)/\?$|\1|p' "$STACK_DIR/.env")
          [[ "$domain" =~ ^[A-Za-z0-9.-]+$ ]] || { echo '::error::MCP_PUBLIC_BASE_URL must be an HTTPS hostname without a path'; exit 1; }
          sudo -n sed "s|__STAGING_DOMAIN__|$domain|g" /tmp/paywall-staging.caddy > /tmp/paywall-staging.rendered.caddy
          sudo -n install -m 0644 -o root -g root /tmp/paywall-staging.rendered.caddy /opt/vaultwarden/caddy_conf_d/paywall-staging.conf
          sudo -n rm -f /tmp/paywall-staging.caddy /tmp/paywall-staging.rendered.caddy
          cd "$STACK_DIR"
          sudo -n docker compose --env-file .env -p "$COMPOSE_PROJECT" pull
          sudo -n docker compose --env-file .env -p "$COMPOSE_PROJECT" up -d
          for service in facilitator mcp; do
            cid=$(sudo -n docker compose --env-file .env -p "$COMPOSE_PROJECT" ps -q "$service")
            [ -n "$cid" ] || { echo "::error::$service container was not created"; exit 1; }
            for _ in $(seq 1 45); do
              health=$(sudo -n docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$cid")
              state=$(sudo -n docker inspect --format '{{.State.Status}}' "$cid")
              [ "$state" = running ] && [ "$health" = healthy ] && break
              [ "$state" = exited ] && { sudo -n docker logs --tail 80 "$cid"; exit 1; }
              sleep 2
            done
            [ "$state" = running ] && [ "$health" = healthy ] || {
              sudo -n docker logs --tail 80 "$cid"
              echo "::error::$service did not become healthy"
              exit 1
            }
          done
          caddy=$(sudo -n docker ps --filter name=vaultwarden-caddy --format '{{.Names}}' | head -1)
          [ -n "$caddy" ] || { echo '::error::Caddy container not found'; exit 1; }
          # The Caddy admin API on this VPS consistently resets reload
          # requests. Match the established Kaneo deployment contract: a
          # short container restart reliably re-reads conf.d from disk.
          sudo -n docker restart "$caddy" >/dev/null
          for _ in $(seq 1 15); do
            [ "$(sudo -n docker inspect --format '{{.State.Status}}' "$caddy")" = running ] && break
            sleep 1
          done
          if [ "$(sudo -n docker inspect --format '{{.State.Status}}' "$caddy")" != running ]; then
            echo '::error::Caddy did not return to running state'
            exit 1
          fi
          echo 'paywall staging MCP and facilitator are healthy'
          REMOTE
