---
galaxy_info:
  author: Mnemonic Protocol
  company: Mnemonic
  license: MIT
  min_ansible_version: 2.15
  platforms:
    - name: Ubuntu
      versions:
        - "24.04"

dependencies:
  - role: base
  - role: telegram-init
  - role: tailscale
  - role: fabric-services
# workspace-manager is a systemd service deployed by the fabric-services role,
# not an independent role. Declaring it as a role dep failed with "role
# workspace-manager not found". Depending on fabric-services here both
# (a) ensures workspace-manager is up before this role configures its
#     cwd-resolver URL, and
# (b) avoids the missing-role failure in role meta resolution.
