---
#
# content-publisher role — Tasks 3 (scaffold) + 7 (wire + smoke)
#
# Task 3 lays down the filesystem + venv + systemd foundation for the
# Python content-publisher worker. Task 7 (appended below the Task 3
# scaffold) installs the fabric/content-publisher package into the
# blogger venv, starts the unit, waits for the three sub-loop startup
# log lines in journald, and runs a deploy-time channel-admin smoke
# (getMe + getChatMember against @mnemonik).
#
# After a successful run: unit is enabled AND active; journal contains
# the three "<loop> started" lines from main(); publisher bot is
# verified as an administrator/creator of @mnemonik.
#
# Tech-spec: work/content-publish-pipeline/tech-spec.md (Tasks 3 + 7,
# Decisions 10, 11, 12; Risks "in-process publish hardening" and
# "publisher bot channel admin").
#

# --- Preflight: assert required upstream refs are set ----------------------

- name: Assert pinned upstream SHAs are configured
  ansible.builtin.assert:
    that:
      - blogger_repo_ref | length == 40
      - claude_blog_repo_ref | length == 40
    fail_msg: >-
      blogger_repo_ref and claude_blog_repo_ref must be full 40-char
      commit SHAs. Set them in defaults/main.yml or via sops
      (Decision 11 — never pin to a tag or branch).
    quiet: true

- name: Assert publisher bot token is configured (fail loud on empty sops key)
  # An empty token would silently render into /etc/blogger.env and the
  # service would start with TELEGRAM_BOT_TOKEN="" — every publish would
  # 401 against Bot API, surfacing only when the operator clicks approve.
  # BotFather tokens are 46 chars; require >= 30 to leave room for format
  # drift while still catching empty / placeholder values.
  # (security-auditor T3-SEC-001)
  ansible.builtin.assert:
    that:
      - blogger_telegram_bot_token | length >= 30
    fail_msg: >-
      blogger_telegram_bot_token is missing or too short. Set it in sops
      before deploy — see role README "Rotate publisher bot token".
    quiet: true

- name: Assert HMAC callback secret(s) are configured (>= 64 hex chars)
  # publish_callback_hmac_secrets is "current" or "current,previous".
  # 64 hex chars = openssl rand -hex 32. An empty value would let the
  # worker's HMAC validator accept anything (or crash on first click,
  # depending on Task 8's implementation) — refuse at deploy time.
  # (security-auditor T3-SEC-001)
  ansible.builtin.assert:
    that:
      - publish_callback_hmac_secrets.split(',') | length in [1, 2]
      - >-
        (publish_callback_hmac_secrets.split(',')
          | map('trim')
          | reject('match', '^[0-9a-fA-F]{64,}$')
          | list
          | length) == 0
    fail_msg: >-
      publish_callback_hmac_secrets must be one or two comma-separated
      secrets, and each secret must be at least 64 hex chars. Generate via
      `openssl rand -hex 32` and store in sops — see role README
      "Rotate HMAC callback secret".
    quiet: true

- name: Assert auto-mode token is configured when PUBLISH_MODE=auto
  # Decision 7's two-location integrity binding: the worker compares the
  # env-file value to the sops-bound value at startup. Both must be
  # non-empty, otherwise '' == '' silently passes the check.
  # (security-auditor T3-SEC-002)
  ansible.builtin.assert:
    that:
      - publish_auto_mode_token | length >= 64
    fail_msg: >-
      PUBLISH_MODE=auto requires publish_auto_mode_token (>= 64 hex chars)
      to be set in sops — see role README "Switch PUBLISH_MODE to auto".
    quiet: true
  when: publish_mode == 'auto'

# --- Resolve hetzner_volume_id from mounts (Decision 10) -------------------

- name: Collect mounts matching the configured Hetzner volume device
  ansible.builtin.set_fact:
    _cp_matching_mounts: >-
      {{ ansible_facts.mounts
         | selectattr('device', 'equalto', hetzner_volume_device)
         | list }}

- name: Fail loud if persistent volume is not mounted
  ansible.builtin.fail:
    msg: >-
      hetzner_volume_id not resolved; {{ hetzner_volume_device }}
      is not mounted. Refusing to template a systemd unit with an
      unresolved RequiresMountsFor= path.
  when: _cp_matching_mounts | length == 0

- name: Resolve persistent volume mount path + systemd .mount unit name
  # No literal '*' or '{' reaches RequiresMountsFor=. The mount unit
  # name (used in After=) follows systemd's path-to-unit-name
  # convention: leading slash dropped, remaining slashes → dashes.
  ansible.builtin.set_fact:
    content_publisher_volume_mount: "{{ (_cp_matching_mounts | first).mount }}"
    content_publisher_volume_mount_unit: >-
      {{ ((_cp_matching_mounts | first).mount
          | regex_replace('^/', '')
          | regex_replace('/', '-')) + '.mount' }}

- name: Show resolved persistent volume mount
  ansible.builtin.debug:
    msg: "content-publisher will live under {{ content_publisher_volume_mount }}/content-publisher"

- name: Assert resolved mount path looks sane (no wildcards, absolute, non-empty)
  ansible.builtin.assert:
    that:
      - content_publisher_volume_mount | length > 1
      - content_publisher_volume_mount.startswith('/')
      - "'*' not in content_publisher_volume_mount"
      - content_publisher_volume_mount.find('{' + '{') == -1
    fail_msg: "Resolved volume mount path is unsafe: '{{ content_publisher_volume_mount }}'"
    quiet: true

# --- System packages (idempotent) ------------------------------------------

- name: Install system packages (python venv toolchain + git)
  become: true
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - git
    state: present
    install_recommends: false

# --- Clone upstream repos at pinned commit SHAs ----------------------------

- name: Ensure /opt is writable by operator for clone targets
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ base_operator_user }}"
    group: "{{ base_operator_user }}"
    mode: '0755'
  loop:
    - "{{ blogger_install_dir }}"
    - "{{ claude_blog_install_dir }}"

- name: Clone mnemonik-dev/blogger at pinned commit SHA
  become: true
  become_user: "{{ base_operator_user }}"
  ansible.builtin.git:
    repo: "{{ blogger_repo_url }}"
    dest: "{{ blogger_install_dir }}"
    version: "{{ blogger_repo_ref }}"
    update: true
    force: true

- name: Clone mnemonik-dev/claude-blog at pinned commit SHA
  become: true
  become_user: "{{ base_operator_user }}"
  ansible.builtin.git:
    repo: "{{ claude_blog_repo_url }}"
    dest: "{{ claude_blog_install_dir }}"
    version: "{{ claude_blog_repo_ref }}"
    update: true
    force: true

# --- Python venv + pinned dependencies (Decision 12) -----------------------

- name: Create Python venv for blogger
  become: true
  become_user: "{{ base_operator_user }}"
  ansible.builtin.command:
    cmd: python3 -m venv {{ blogger_install_dir }}/venv
    creates: "{{ blogger_install_dir }}/venv/bin/python"

- name: Copy pinned requirements.locked.txt into blogger install dir
  become: true
  ansible.builtin.copy:
    src: requirements.locked.txt
    dest: "{{ blogger_install_dir }}/requirements.locked.txt"
    owner: "{{ base_operator_user }}"
    group: "{{ base_operator_user }}"
    mode: '0644'

- name: Install pinned dependencies (--require-hashes, supply-chain hardening)
  # Decision 12: every transitive dep is pinned by hash. Generation
  # procedure is documented in the role README ("How to regenerate
  # requirements.locked.txt"). pip-compile --generate-hashes runs OFFLINE
  # by the role author; this play just verifies the lockfile against PyPI.
  become: true
  become_user: "{{ base_operator_user }}"
  ansible.builtin.pip:
    requirements: "{{ blogger_install_dir }}/requirements.locked.txt"
    virtualenv: "{{ blogger_install_dir }}/venv"
    extra_args: "--require-hashes"

- name: Install blogger package itself (no-deps; all deps already pinned)
  become: true
  become_user: "{{ base_operator_user }}"
  ansible.builtin.pip:
    name: "."
    chdir: "{{ blogger_install_dir }}"
    virtualenv: "{{ blogger_install_dir }}/venv"
    extra_args: "--no-deps"

# --- Verify upstream import surface + signature (Decision 11) --------------

- name: Verify blogger import surface and run_campaign_from_article signature
  # Catches round-3-style upstream drift at deploy time: if Platform,
  # Settings, ingest_article, render or run_campaign_from_article change
  # name or signature, this fails before the unit is rendered.
  become: true
  become_user: "{{ base_operator_user }}"
  ansible.builtin.command:
    cmd: >
      {{ blogger_install_dir }}/venv/bin/python -c "
      from pathlib import Path;
      from inspect import signature;
      from mnemonik_blogger.config import Platform, Settings;
      from mnemonik_blogger.content.ingest import ingest_article;
      from mnemonik_blogger.content.formatters import render;
      from mnemonik_blogger.agent import run_campaign_from_article, CampaignResult;
      sig = signature(run_campaign_from_article);
      required = {'article','platforms','settings'};
      assert required <= set(sig.parameters), 'missing kwargs: ' + repr(required - set(sig.parameters));
      assert all(sig.parameters[n].kind.name == 'KEYWORD_ONLY' for n in required), 'run_campaign_from_article args must be keyword-only';
      assert Platform.TELEGRAM.value == 'telegram', 'Platform.TELEGRAM.value drifted'
      "
  changed_when: false

- name: Verify claude-blog scorer is reachable
  become: true
  become_user: "{{ base_operator_user }}"
  ansible.builtin.command:
    cmd: "{{ blogger_install_dir }}/venv/bin/python {{ claude_blog_install_dir }}/scripts/analyze_blog.py --help"
  changed_when: false

# --- Filesystem layout (worktrees + persistent queue/archive) --------------

- name: Create content-publisher worktree root (root disk)
  become: true
  ansible.builtin.file:
    path: "{{ content_publisher_work_dir }}"
    state: directory
    owner: "{{ base_operator_user }}"
    group: "{{ base_operator_user }}"
    mode: '0750'

- name: Create content-publisher persistent dirs (queue + archive on volume)
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ base_operator_user }}"
    group: "{{ base_operator_user }}"
    mode: '0750'
  loop:
    - "{{ content_publisher_volume_mount }}/content-publisher"
    - "{{ content_publisher_volume_mount }}/content-publisher/archive"

# --- Render env-file + MCP config + systemd unit ---------------------------

- name: Render /etc/blogger.env from sops-backed vars
  become: true
  ansible.builtin.template:
    src: blogger.env.j2
    dest: /etc/blogger.env
    owner: root
    group: root
    mode: '0600'
  notify: Restart content-publisher

- name: Render /etc/blogger.mcp.json with discovered mnemonic_mcp_binary
  become: true
  ansible.builtin.template:
    src: blogger.mcp.json.j2
    dest: /etc/blogger.mcp.json
    owner: root
    group: "{{ base_operator_user }}"
    mode: '0640'
  notify: Restart content-publisher

- name: Render content-publisher systemd unit
  become: true
  ansible.builtin.template:
    src: content-publisher.service.j2
    dest: /etc/systemd/system/{{ content_publisher_systemd_unit }}
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart content-publisher

- name: Flush handlers so the daemon-reload runs before the assert + enable steps
  ansible.builtin.meta: flush_handlers

- name: Assert systemd unit contains required hardening directives
  # Post-render assertion guards against template regression: the five
  # mandatory directives must reach the on-disk unit file with concrete
  # values (no '*' wildcards, no unrendered Jinja).
  become: true
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - '^(RequiresMountsFor|ConditionPathIsMountPoint|LimitCORE|ProtectSystem|NoNewPrivileges)='
      - "/etc/systemd/system/{{ content_publisher_systemd_unit }}"
  register: cp_unit_grep
  changed_when: false

- name: Verify hardening lines are present and concrete
  ansible.builtin.assert:
    that:
      - "'LimitCORE=0' in cp_unit_grep.stdout"
      - "'ProtectSystem=strict' in cp_unit_grep.stdout"
      - "'NoNewPrivileges=true' in cp_unit_grep.stdout"
      - "'RequiresMountsFor=' in cp_unit_grep.stdout"
      - "'ConditionPathIsMountPoint=' in cp_unit_grep.stdout"
      - "'*' not in cp_unit_grep.stdout"
      - cp_unit_grep.stdout.find('{' + '{') == -1
    fail_msg: "content-publisher.service is missing or mis-rendering hardening directives"
    quiet: true

- name: Enable + start content-publisher.service (Wave 2)
  # Wave 2 contract (Task 7): the `content_publisher` package is installed
  # into the blogger venv just above, so the unit can be both enabled and
  # started. Subsequent tasks anchor the journal window to this start.
  become: true
  ansible.builtin.systemd:
    name: "{{ content_publisher_systemd_unit }}"
    enabled: true
    state: "{{ content_publisher_systemd_state }}"
  register: cp_service_start

# ===========================================================================
# Task 7 — Wave 2: install worker package + start service + deploy-time smoke
# ===========================================================================
#
# Everything above this banner is Task 3's scaffold (rendered templates,
# unit hardening assertions, enable+start). Task 7 appends three things:
#   (a) install fabric/content-publisher into the blogger venv,
#   (b) wait for the three sub-loop startup log lines in journald,
#   (c) channel-admin smoke (getMe → getChatMember @mnemonik).
#
# The package install above triggers the Restart handler if the source
# changed; the wait_for-style journal grep anchors itself to the unit's
# ActiveEnterTimestamp so slow Ansible execution between `started` and
# the grep never misses the start lines.

# --- Wave 2 step (a): install fabric/content-publisher worker package ------
#
# The worker package lives at fabric/content-publisher/ in the repo
# checkout on the controller. fabric-services already uploaded the
# tarball to {{ fabric_target_dir }}/content-publisher on the VM (the
# tarball includes every subdir under fabric/). We install it into the
# blogger venv (NOT a separate venv): main() imports mnemonik_blogger
# directly, so both packages must share an interpreter / site-packages.
# `--no-deps` because all transitive deps are already pinned by
# requirements.locked.txt (Decision 12); we never want pip to resolve
# anything fresh at deploy time.

- name: Probe whether content-publisher source is present on the VM
  ansible.builtin.stat:
    path: "{{ fabric_target_dir }}/content-publisher/pyproject.toml"
  register: cp_source_stat

- name: Fail loud if content-publisher source is missing
  # fabric-services runs BEFORE this role in deploy.yml and is responsible
  # for syncing fabric/* to /opt/fabric. Missing source here means an out-
  # of-order play or a botched sync — refuse to "fix it up" silently.
  ansible.builtin.fail:
    msg: >-
      {{ fabric_target_dir }}/content-publisher/pyproject.toml is missing.
      fabric-services must run before content-publisher in deploy.yml so the
      worker source is on the VM. See work/content-publish-pipeline/tasks/
      07-content-publisher-wire-service-smoke.md.
  when: not cp_source_stat.stat.exists

- name: Install content-publisher package into blogger venv (--no-deps)
  # No-deps install: pydantic and any other runtime deps are already pulled
  # by blogger's requirements.locked.txt above. This step is idempotent —
  # pip detects the already-installed wheel by version and reports "Already
  # satisfied", so changed=false on a healthy second run.
  become: true
  become_user: "{{ base_operator_user }}"
  ansible.builtin.pip:
    name: "."
    chdir: "{{ fabric_target_dir }}/content-publisher"
    virtualenv: "{{ blogger_install_dir }}/venv"
    extra_args: "--no-deps"
  register: cp_pip_install
  notify: Restart content-publisher

- name: Assert content-publisher entry point resolves in the venv
  # Catches a package-layout regression at deploy time: if pyproject.toml
  # stops exporting content_publisher.main as a module, `python -m` would
  # fail when systemd next tried to start the unit. Fail loud here instead.
  become: true
  become_user: "{{ base_operator_user }}"
  ansible.builtin.command:
    cmd: >-
      {{ blogger_install_dir }}/venv/bin/python -c "import content_publisher.main"
  changed_when: false

- name: Flush handlers so a fresh package install bounces the service
  # If the pip install above changed (notify: Restart content-publisher),
  # the handler must fire BEFORE the journal-grep step below — otherwise
  # we'd grep the previous unit instance and miss the new start lines.
  ansible.builtin.meta: flush_handlers

# --- Wave 2 step (b): anchor + grep journal for three start log lines ------

- name: Query content-publisher unit state (for ActiveEnterTimestamp anchor)
  # Anchors `journalctl --since` to the unit's actual start instant, NOT a
  # relative window. Slow Ansible execution between `state: started` and
  # the grep below could otherwise push a fixed `--since "30 seconds ago"`
  # past the start lines. The systemd module returns the full unit-status
  # dict; we read ActiveEnterTimestamp out of `status.ActiveEnterTimestamp`
  # rather than shelling out to systemctl (ansible-lint
  # command-instead-of-module). Same lookup pattern as
  # handlers/main.yml's "Probe whether content-publisher is currently
  # active".
  become: true
  ansible.builtin.systemd:
    name: "{{ content_publisher_systemd_unit }}"
  register: cp_unit_show
  changed_when: false

- name: Set ActiveEnterTimestamp fact for the journal window
  ansible.builtin.set_fact:
    cp_active_ts: "{{ cp_unit_show.status.ActiveEnterTimestamp | default('') | trim }}"

- name: Assert ActiveEnterTimestamp is non-empty (unit actually started)
  # An empty value means the unit never reached `active` — probably
  # ConditionPathIsMountPoint= refused (volume not mounted) or ExecStart
  # crashed before the asyncio.gather. Refuse to grep an empty window.
  ansible.builtin.assert:
    that:
      - cp_active_ts | length > 0
    fail_msg: >-
      {{ content_publisher_systemd_unit }} has no ActiveEnterTimestamp —
      the unit never reached active. Inspect with `systemctl status
      {{ content_publisher_systemd_unit }}` and `journalctl -u
      {{ content_publisher_systemd_unit }} --no-pager`.
    quiet: true

- name: Wait for "queue-poll started" in journal
  # Three separate small tasks — one per expected log line — yield clearer
  # failure attribution than a composite regex. Each retries 6× at 5 s
  # intervals (30 s budget total). community.general.journal_grep is not in
  # stock Ansible; shell + grep -q is the portable equivalent.
  become: true
  ansible.builtin.shell: >-
    journalctl -u {{ content_publisher_systemd_unit }}
    --since "{{ cp_active_ts }}"
    --no-pager
    | grep -q 'queue-poll started'
  register: cp_log_queue_poll
  changed_when: false
  retries: 6
  delay: 5
  until: cp_log_queue_poll.rc == 0
  failed_when: cp_log_queue_poll.rc != 0
  # Custom message: which line is missing is the operator's first question.
  ignore_errors: true

- name: Fail loud if queue-poll start line never appeared
  ansible.builtin.fail:
    msg: >-
      content-publisher did not emit "queue-poll started" within 30 s of
      ActiveEnterTimestamp ({{ cp_active_ts }}). The queue-
      poll sub-loop crashed before logging. Run `journalctl -u
      {{ content_publisher_systemd_unit }} --since "{{ cp_active_ts }}"
      --no-pager` for the traceback.
  when: cp_log_queue_poll.rc | default(1) != 0

- name: Wait for "deadline-checker started" in journal
  become: true
  ansible.builtin.shell: >-
    journalctl -u {{ content_publisher_systemd_unit }}
    --since "{{ cp_active_ts }}"
    --no-pager
    | grep -q 'deadline-checker started'
  register: cp_log_deadline
  changed_when: false
  retries: 6
  delay: 5
  until: cp_log_deadline.rc == 0
  failed_when: cp_log_deadline.rc != 0
  ignore_errors: true

- name: Fail loud if deadline-checker start line never appeared
  ansible.builtin.fail:
    msg: >-
      content-publisher did not emit "deadline-checker started" within 30 s
      of ActiveEnterTimestamp ({{ cp_active_ts }}). Run
      `journalctl -u {{ content_publisher_systemd_unit }} --since
      "{{ cp_active_ts }}" --no-pager` for the traceback.
  when: cp_log_deadline.rc | default(1) != 0

- name: Wait for "cleanup-gc started" in journal
  become: true
  ansible.builtin.shell: >-
    journalctl -u {{ content_publisher_systemd_unit }}
    --since "{{ cp_active_ts }}"
    --no-pager
    | grep -q 'cleanup-gc started'
  register: cp_log_cleanup
  changed_when: false
  retries: 6
  delay: 5
  until: cp_log_cleanup.rc == 0
  failed_when: cp_log_cleanup.rc != 0
  ignore_errors: true

- name: Fail loud if cleanup-gc start line never appeared
  ansible.builtin.fail:
    msg: >-
      content-publisher did not emit "cleanup-gc started" within 30 s of
      ActiveEnterTimestamp ({{ cp_active_ts }}). Run
      `journalctl -u {{ content_publisher_systemd_unit }} --since
      "{{ cp_active_ts }}" --no-pager` for the traceback.
  when: cp_log_cleanup.rc | default(1) != 0

# --- Wave 2 step (c): channel-admin smoke (getMe → getChatMember) ----------
#
# Tech-spec Risks row: operator forgets to add the publisher bot as an
# admin of @mnemonik. `getChat` cannot validate admin membership (any
# caller gets 200 OK against a public channel). Two-step:
#   1) getMe with the publisher bot token → publisher_bot_id
#   2) getChatMember(chat_id=@mnemonik, user_id=publisher_bot_id)
#      → result.status must be in {administrator, creator}
# NO getForumTopic smoke — the Bot API has no such endpoint. Topic-id
# mismatch is self-detected by Task 8's topic-handler at first use via
# journald (tech-spec Risks row 11).

- name: Smoke — getMe (discover publisher bot id)
  # no_log: true so the token never reaches Ansible stdout/json output.
  # Accept any HTTP status so the dedicated `fail:` task below can render
  # the operator-actionable runbook message instead of Ansible's generic
  # "Status code was not 200" (which would also leak nothing useful since
  # the URL itself is suppressed). status_code accepts a list of codes.
  ansible.builtin.uri:
    url: "https://api.telegram.org/bot{{ blogger_telegram_bot_token }}/getMe"
    method: POST
    body_format: json
    status_code: [200, 401, 404]
    return_content: true
  register: tg_me
  no_log: true
  changed_when: false

- name: Fail loud if getMe did not return ok=true
  # Catches token rotation drift: ok=false (or missing) = token doesn't
  # authenticate against Bot API at all. Different failure class than "bot
  # is not channel admin" — surface them separately so the runbook step is
  # unambiguous.
  ansible.builtin.fail:
    msg: >-
      Publisher bot token authentication failed (getMe did not return
      ok=true). The token in sops `blogger_telegram_bot_token` is invalid
      or revoked. See roles/content-publisher/README.md
      "Rotate publisher bot token".
  when: not (tg_me.json.ok | default(false))

- name: Smoke — getChatMember(@mnemonik, publisher_bot_id)
  # Chains tg_me → user_id. `chat_id` is the public channel handle from
  # role defaults (blogger_telegram_channel = "@mnemonik"). no_log
  # protects the token in the URL. status_code list mirrors the getMe
  # step's reasoning — defer the actionable message to the `fail:` task.
  ansible.builtin.uri:
    url: "https://api.telegram.org/bot{{ blogger_telegram_bot_token }}/getChatMember"
    method: POST
    body_format: json
    body:
      chat_id: "{{ blogger_telegram_channel }}"
      user_id: "{{ tg_me.json.result.id }}"
    status_code: [200, 400, 403, 404]
    return_content: true
  register: tg_member
  no_log: true
  changed_when: false

- name: Fail loud if publisher bot is not a channel admin
  # Channel-admin runbook lives in roles/content-publisher/README.md
  # (Wave-2-added section pointed to by the runbook map there). Without
  # admin rights, getChatMember returns ok=true but result.status is
  # 'left' / 'member' / 'kicked' / 'restricted' — none of which can post
  # to the channel.
  ansible.builtin.fail:
    msg: >-
      Publisher bot is not an admin of {{ blogger_telegram_channel }}
      (getChatMember returned status='{{ tg_member.json.result.status | default("unknown") }}',
      expected 'administrator' or 'creator').
      See roles/content-publisher/README.md "Publisher bot must be channel admin".
  when: >-
    not (tg_member.json.ok | default(false))
    or (tg_member.json.result.status | default('') not in ['administrator', 'creator'])
