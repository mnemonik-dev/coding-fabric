---
# In our deploy pipeline, cloud-init has already installed Tailscale and run
# `tailscale up` BEFORE Ansible can reach the VM (the runner reaches the VM
# only via that established tailnet membership). Detect that prior state and
# skip the install + apt + up steps — they're not just redundant, they break:
#
#   Run 26183520907 failed at this role's `apt update` task ("Failed to update
#   apt cache after 5 retries:" with empty stderr) — re-adding the Tailscale
#   APT repo on top of what install.sh already wrote triggered the dpkg
#   /apt-listchanges interactive flow which timed out under Ansible's
#   non-interactive shell.
#
# Also: the role's original `tailscale up --ssh` reintroduced the Tailscale
# SSH interception (web-auth-required) that we explicitly removed from
# cloud-init (run 26170050584). Removed --ssh here too.

- name: Detect existing Tailscale installation (cloud-init path)
  ansible.builtin.command:
    cmd: tailscale version
  register: tailscale_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Verify tailscale_authkey is provided (only if install branch will run)
  # tailscale role runs as a meta-dependency for vaultwarden/kaneo/molyanov/
  # telegram-ai-agent. Those dependency invocations DON'T inherit the
  # `vars: { tailscale_authkey: ... }` from the top-level role inclusion in
  # deploy.yml, so the var resolves to its role default of "" and the prior
  # unconditional assertion failed mid-play (run 26184599004). Gating on
  # rc != 0 means we only require the authkey when the install branch is
  # actually about to run — which never happens after the first invocation.
  ansible.builtin.assert:
    that:
      - tailscale_authkey is defined
      - tailscale_authkey | length > 0
    fail_msg: "tailscale_authkey is required when Tailscale isn't already installed"
  when: tailscale_version.rc != 0
  no_log: true

- name: Install + bring up Tailscale (only if cloud-init didn't already)
  when: tailscale_version.rc != 0
  become: true
  block:
    - name: Download Tailscale GPG key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'
        force: true
      retries: 3
      delay: 5

    - name: Add Tailscale APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main"
        state: present
      retries: 3
      delay: 5

    - name: Update apt cache (Tailscale repo)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 10

    - name: Install tailscaled
      ansible.builtin.apt:
        name: tailscale
        state: present

    - name: Enable and start tailscaled
      ansible.builtin.systemd_service:
        name: tailscaled
        enabled: true
        state: started

    - name: Write authkey to secure tmpfile
      ansible.builtin.copy:
        content: "{{ tailscale_authkey }}"
        dest: /run/tailscale-authkey.txt
        mode: '0600'
        owner: root
        group: root
      no_log: true

    - name: Authenticate with Tailscale (no --ssh, OpenSSH on 22 takes over)
      ansible.builtin.command:
        cmd: >
          tailscale up
          --auth-key=file:/run/tailscale-authkey.txt
          --hostname={{ fabric_hostname }}
          {{ '--accept-routes' if tailscale_accept_routes | default(true) else '' }}
      register: tailscale_up_result
      retries: 3
      delay: 10
      until: tailscale_up_result is succeeded
      changed_when: tailscale_up_result.rc == 0 and 'already' not in (tailscale_up_result.stdout | lower)
      no_log: true

    - name: Remove authkey tmpfile securely
      ansible.builtin.file:
        path: /run/tailscale-authkey.txt
        state: absent
      no_log: true

- name: Wait briefly for Tailscale interface
  ansible.builtin.pause:
    seconds: 3

- name: Get Tailscale IPv4 address
  become: true
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip_cmd
  changed_when: false
  retries: 3
  delay: 5
  until: tailscale_ip_cmd is succeeded and tailscale_ip_cmd.stdout | trim | length > 0
  failed_when: tailscale_ip_cmd.stdout | trim | length == 0

- name: Register tailscale_ip fact
  ansible.builtin.set_fact:
    tailscale_ip: "{{ tailscale_ip_cmd.stdout | trim }}"

- name: Verify tailscale is logged in
  become: true
  ansible.builtin.command: tailscale status
  register: tailscale_status_result
  changed_when: false
  failed_when: tailscale_status_result.rc != 0
  no_log: true
