---
# Fork repo (own-the-fork strategy — see work/mnemonic-tg-bridge/user-spec.md).
# Source of truth: mnemonik-dev/telegram-ai-agent. Pavel-molyanov upstream is a
# read-only sync source for periodic bug-fix rebase.
telegram_ai_agent_repo: "https://github.com/mnemonik-dev/telegram-ai-agent.git"
# Pinned commit: 2e3af15 (feat/tg-slash-command-gateway, ff-merges into
# main) — General-chat /engine /mode /stream /model support (reserved
# topic_config key 0), CommandRegistry with underscore↔dash alias
# bridging + /sync_commands, /status + /relogin (quota-day recovery
# without SSH), auth/quota errors surfaced to chat instead of silent
# "Thinking...", /resume DI crash fix.
# Predecessor 873751b re-enabled Molyanov-in-Telegram underscore names;
# f29d20f added GitHub MCP injection; 1ceaccb / v0.1.0+mnemonik.1 had
# the cwd:DYNAMIC HTTP resolver.
# a6e0fce adds the /model command on top of 2e3af15 — per-chat model
# override incl. General chat, to escape the VM's 1M-context engine
# default ("Usage credits required for 1M context", incident 2026-07-28).
#
# 8cded0a (PR #1) makes the bot's MCP create_topic idempotent by name
# (looks the name up in topic_config.json before calling Telegram).
# 7a93e08 adds runtime user roles + invites (/invite /grant /revoke /users,
# USERS_FILE) and the per-topic shared-chat mode (/chat direct|mention).
telegram_ai_agent_pin: "7a93e08"

# Installation paths
telegram_ai_agent_home: "/opt/telegram-ai-agent"
# Directory for the bot's mutable runtime state (topic_config.json,
# session_mapping.json, channel_sessions.json, tmux_sessions/). Point it at
# the persistent data volume so topic registrations and chat sessions
# survive a VM rebuild — otherwise the bot forgets every topic it created
# and makes duplicates. Empty = keep state inside telegram_ai_agent_home
# (legacy behaviour). deploy.yml sets it to <volume>/telegram-ai-agent.
telegram_ai_agent_state_dir: ""

# Install the Kimi Code CLI as a third engine (best effort, never fails the
# deploy). It still needs a one-time interactive login as the service user:
# run `kimi`, then `/login` (OAuth device code). See
# https://www.kimi.com/code/docs/en/kimi-code-cli/guides/getting-started.html
telegram_ai_agent_install_kimi: true
telegram_ai_agent_config_dir: "/etc/telegram-ai-agent"
telegram_ai_agent_owner: "op"
telegram_ai_agent_group: "op"

# uv installer version (pinned for reproducibility)
telegram_ai_agent_uv_version: "0.5.3"

# Timeout for uv sync (first-run pulls many dependencies)
telegram_ai_agent_uv_sync_timeout: 300

# Pre-flight check: whether to require DYNAMIC feature in pinned commit
telegram_ai_agent_require_dynamic_feature: true

# Default working directory for bot-spawned claude sessions when the
# topic has no specific cwd binding. Bot's pydantic-settings reads this
# as `Settings.default_cwd` from the DEFAULT_CWD env var (rendered into
# .env). The bot install dir (/opt/telegram-ai-agent) is wrong for
# real work because it points back into the bot's source tree;
# /home/op/work is a clean, op-owned, dedicated scratch area.
telegram_ai_agent_default_cwd: "/home/op/work"

# Topic configuration matrix. Empty by default — operator builds the set
# on demand via the bot's /new-task command (Phase 2 backlog). Override
# this map from a playbook or group_vars if you want a baseline set
# materialised at deploy time. The original 8 canonical topics
# (core/mcp/wasm/demo-client/docs/loop/protocol-qa/ops) lived here until
# 2026-05-24 — see git log for the previous shape if you want to revive
# them as a static baseline.
telegram_ai_agent_topics: {}

# Model pinning for bot-spawned engine sessions. Rendered into
# /etc/telegram-ai-agent/config.yml per topic; a topic can override with
# its own `model` key in telegram_ai_agent_topics. Aliases ("sonnet",
# "opus") are accepted by the claude CLI and track the latest release —
# prefer them over dated IDs so a quota-driven switch (e.g. opus quota
# burned → drop to sonnet) is a one-var redeploy, not a template edit.
telegram_ai_agent_claude_model: "claude-opus-4-1"
telegram_ai_agent_codex_model: "codex-latest"

# Skill dirs from the pre-2026-07 bundle that shipped underscore duplicates
# of every dash-named skill (identical frontmatter `name:` → duplicate-skill
# conflicts in Claude Code). Purged from every target HOME on deploy because
# the skills sync is additive. Remove this list (and its purge task) once
# all long-lived VMs have redeployed past 2026-07.
telegram_ai_agent_legacy_underscore_skills:
  - code_reviewing
  - code_writing
  - deploy_pipeline
  - documentation_writing
  - feature_execution
  - infrastructure_setup
  - post_deploy_qa
  - pre_deploy_qa
  - project_planning
  - prompt_master
  - security_auditor
  - skill_master
  - skill_tester
  - task_decomposition
  - tech_spec_planning
  - test_master
  - user_spec_planning

# Systemd service parameters
telegram_ai_agent_restart_policy: "on-failure"
telegram_ai_agent_restart_sec: 5
telegram_ai_agent_log_level: "info"
