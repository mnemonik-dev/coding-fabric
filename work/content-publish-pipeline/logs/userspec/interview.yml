    score: 88
    status: "complete"
    value: "1) Bot down at scheduled fire time: poller catches up when bot restarts, fires overdue jobs with 'late by Xmin' annotation. 2) Self-rewrite loop never converges: max 3 retries then operator notified with last draft + reasons. 3) Mnemonik MCP unreachable AFTER successful TG post: post committed (cannot rollback), attestation queued for retry. 4) Operator clicks Reject AFTER auto-publish fired: bot replies 'too late, post already published, link: ...'. 5) /publish-content --at <past ISO>: bot rejects with 'time must be future'. 6) Multiple /publish-content stacked: queue serial; each gets own preview msg. 7) claude+claude-blog spawn fails (missing files / OOM): job marked failed, operator notified with traceback. NO RETRY on structural failures."
