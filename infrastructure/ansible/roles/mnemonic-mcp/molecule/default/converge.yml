---
# Local-only scenario: not wired into CI as of 2026-06. Updates expected when
# the npm install path is exercised inside the container.
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    mnemonic_mcp_enabled: true
    mnemonik_mcp_npm_package: "@mnemonik-xyz/mcp"
    mnemonik_mcp_npm_version: "0.2.6"
    mnemonik_mcp_install_dir: /opt/mnemonik-mcp
  roles:
    - role: mnemonic-mcp
