---
# configure: pinned toolchain, installed idempotently (probe before install).
- name: Build tools and time (apt; root-only setup, D1 clarification)
  become: true
  ansible.builtin.apt:
    name: "{{ warrant_canary_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Probe installed versions
  ansible.builtin.shell: |
    {{ warrant_canary_home }}/.cargo/bin/rustc +{{ warrant_canary_rust_version }} --version 2>/dev/null | head -1 || true
    echo '---'
    {{ warrant_canary_home }}/.risc0/bin/r0vm --version 2>/dev/null | head -1 || true
    echo '---'
    {{ warrant_canary_home }}/.foundry/bin/forge --version 2>/dev/null | head -1 || true
    echo '---'
    node --version 2>/dev/null || true
    echo '---'
    python3 --version 2>/dev/null || true
  register: _wc_versions
  changed_when: false

- name: Parse probes
  ansible.builtin.set_fact:
    _wc_rust_ok: "{{ ('rustc ' ~ warrant_canary_rust_version) in _wc_versions.stdout.split('---')[0] }}"
    _wc_r0vm_ok: "{{ warrant_canary_r0vm_version in _wc_versions.stdout.split('---')[1] }}"
    _wc_forge_ok: "{{ warrant_canary_foundry_version in _wc_versions.stdout.split('---')[2] }}"
    _wc_node_ok: "{{ _wc_versions.stdout.split('---')[3] | trim is match('v' ~ warrant_canary_node_major ~ '\\.') }}"
    _wc_python_ok: "{{ ('Python ' ~ warrant_canary_python_version) in _wc_versions.stdout.split('---')[4] }}"

- name: Python {{ warrant_canary_python_version }} is the system python3
  ansible.builtin.assert:
    that: _wc_python_ok | bool
    fail_msg: "python3 is not {{ warrant_canary_python_version }}: {{ _wc_versions.stdout.split('---')[4] | trim }}"
    quiet: true

- name: Rust {{ warrant_canary_rust_version }} via rustup
  ansible.builtin.shell: |
    set -e
    if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain {{ warrant_canary_rust_version }}
    else
      "$HOME/.cargo/bin/rustup" toolchain install {{ warrant_canary_rust_version }} --profile minimal
    fi
  when: not (_wc_rust_ok | bool)

- name: rzup with r0vm {{ warrant_canary_r0vm_version }}
  ansible.builtin.shell: |
    set -e
    # The rzup installer requires rustc on PATH; the Ansible shell has no ~/.cargo/bin.
    export PATH="$HOME/.cargo/bin:$PATH"
    if [ ! -x "$HOME/.risc0/bin/rzup" ]; then
      curl --proto '=https' --tlsv1.2 -sSfL https://risczero.com/install | bash
    fi
    "$HOME/.risc0/bin/rzup" install r0vm {{ warrant_canary_r0vm_version }}
  when: not (_wc_r0vm_ok | bool)

- name: Foundry {{ warrant_canary_foundry_version }}
  ansible.builtin.shell: |
    set -e
    if [ ! -x "$HOME/.foundry/bin/foundryup" ]; then
      curl --proto '=https' --tlsv1.2 -sSfL https://foundry.paradigm.xyz | bash
    fi
    "$HOME/.foundry/bin/foundryup" --install {{ warrant_canary_foundry_version }}
  when: not (_wc_forge_ok | bool)

- name: Node {{ warrant_canary_node_major }} from the signed NodeSource apt repository (root-only setup)
  when: not (_wc_node_ok | bool)
  become: true
  block:
    - name: NodeSource signing key (download to a staging path)
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc.new
        mode: "0644"
        force: true

    - name: Check the NodeSource key holds exactly the pinned key
      ansible.builtin.command:
        argv: [gpg, --show-keys, --with-colons, /etc/apt/keyrings/nodesource.asc.new]
      register: _wc_nodesource_key
      changed_when: false
      failed_when: >-
        _wc_nodesource_key.rc != 0
        or _wc_nodesource_key.stdout_lines | select('match', '^pub:') | list | length != 1
        or (_wc_nodesource_key.stdout_lines | select('match', '^fpr:') | first | default('')).split(':')[9] | default('')
           != warrant_canary_nodesource_key_fpr

    - name: Install the checked key
      ansible.builtin.copy:
        src: /etc/apt/keyrings/nodesource.asc.new
        dest: /etc/apt/keyrings/nodesource.asc
        remote_src: true
        mode: "0644"

    - name: Remove the staging copy
      ansible.builtin.file:
        path: /etc/apt/keyrings/nodesource.asc.new
        state: absent

    - name: NodeSource repository (signed-by the checked key)
      ansible.builtin.deb822_repository:
        name: nodesource
        uris: "https://deb.nodesource.com/node_{{ warrant_canary_node_major }}.x"
        suites: nodistro
        components: main
        signed_by: /etc/apt/keyrings/nodesource.asc

    - name: nodejs
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true
