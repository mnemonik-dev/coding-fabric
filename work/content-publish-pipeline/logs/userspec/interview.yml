conversation_history:
- question_num: 1
  timestamp: "2026-06-06 13:50:55"
  topic: "trigger + source + platforms + dryrun_policy"
  agent_question: |
    Q1 trigger (manual TG / Kaneo state / GH webhook)?
    Q2 article source (separate blog-content repo / per-task repo / external)?
    Q3 platforms — which are real-launch vs placeholder?
    Q4 dry-run default in prod?
  user_answer: |
    Q1: user writes a prompt in TG defining scope + aim of an article (typically "raise Mnemonik trust, explain why it is needed").
    Q2: claude-blog produces the article from that prompt.
    Q3: tokens exist for all platforms, but X requires expensive paid tier — MVP = Telegram channel only. Other platforms must be foreseen as easy-add later.
    Q4: prefer approval flow — bot messages operator in TG with preview, operator approves → publish. AUTOMATIC flow should also exist as an option.
  summary: "Trigger = TG prompt. Writer = claude-blog. MVP platform = Telegram. Default mode = approval; auto mode is also a path."

- question_num: 2
  timestamp: "2026-06-06 13:58:21"
  topic: "trigger_command + storage + preview + auto_vs_approval"
  agent_question: |
    Q5 how does bot recognize a publish task vs code task (slash / prefix / LLM / Kaneo column)?
    Q6 where do article.md + attestations live (ephemeral worktree / blog-content repo / hybrid)?
    Q7 preview format (raw markdown / rendered final post / summary)?
    Q8 auto-vs-approval policy (per-task flag / global / timeout / score-based)?
  user_answer: |
    Q5 (A) — explicit slash command.
    Q6 — MAJOR ARCH CHANGE: also need to publish to OUR WEBAPP BLOG PAGE (new platform, not in blogger today). And Kaneo/Symphony are TOTALLY REDUNDANT for this flow. Run a separate flow: research → approve → publish, OR research → publish. Also: scheduled publish task execution required.
    Q7 (B) — rendered exactly as it will appear in TG channel.
    Q8 (C) — approval with timeout, then auto-publish (like the existing auto-merge veto pattern from #16).
  summary: "/publish-content slash. Separate pipeline (NOT Kaneo/Symphony). Webapp blog is a new target. Scheduled execution needed. Preview = final rendered. Approval+timeout default."

- question_num: 3
  timestamp: "2026-06-06 14:03:01"
  topic: "scope_clarification_arch_simplification"
  agent_question: |
    Pushed back on whether removing Kaneo+Symphony complicates the work, since this is
    a key architectural change. User confirmed: it does NOT complicate, simplifies.
    Also: webapp blog adapter is OUT OF SCOPE for this iteration. MVP = TG-only.
  user_answer: |
    Removing Kaneo+Symphony is correct simplification. Site connector (webapp) is out of scope.
  summary: "MVP narrowed to TG-only. Kaneo/Symphony decisively excluded from publish pipeline. Webapp deferred to a later iteration."

- question_num: 4
  timestamp: "2026-06-06 14:17:57"
  topic: "runner_arch + scheduling + attestation + timeout + retry_on_low_score + staging_channel"
  agent_question: |
    Q9 webapp blog: scope or defer?
    Q10 where claude-blog runs (in-bot / separate poller / subprocess)?
    Q11 scheduling shape?
    Q12 attestation storage?
    Q13 approval timeout default?
    Q14 schedule = one-shot or recurring?
    Q15 quality-gate failure behavior?
    Q16 staging vs real channel?
  user_answer: |
    Q9 DEFER to work/blogger-site-connector/.
    Q10 (B) separate content-publisher.service systemd unit (poller).
    Q11 scheduling configurable. Initial mode = approval-needed; after quality validated, switch to autonomous bot.
    Q12 YES use Mnemonik MCP for attestation. KEY VALUE: articles become recallable via mnemonic_recall — eating own dogfood, product use-case.
    Q13 (A) 5 minutes default timeout.
    Q14 (A) one-shot --at <ISO> only for MVP.
    Q15 (C) self-rewrite loop: worker re-spawns claude with analyze_blog feedback until score passes.
    Q16 dismiss staging. Real @mnemonik channel + operator approval IS the safety net.
  summary: "Site connector deferred. Separate poller service. Mnemonik MCP attestation = product diff. 5-min timeout. One-shot scheduling. Self-rewrite-on-low-score. No staging — approval is safety."

- question_num: 5
  timestamp: "2026-06-06 14:18:26"
  topic: "additional_platform_request"
  agent_question: |
    (none — user volunteered)
  user_answer: |
    Please also add LinkedIn to list of potential platforms.
  summary: "LinkedIn added to deferred-platforms list. Not in MVP; not in upstream blogger adapters — needs custom OAuth adapter."

- question_num: 6
  timestamp: "2026-06-06 14:19:50"
  topic: "publisher_bot_identity"
  agent_question: |
    Q17 separate publisher bot vs reuse @mnemonik_fabric_bot?
  user_answer: |
    Q17 (B) separate.
  summary: "Separate Telegram bot for publishing (created via @BotFather). Operator-bot != publisher-bot. Cleaner privilege scope."

- question_num: 7
  timestamp: "2026-06-06 14:20:36"
  topic: "claude_spawn_failure_handling"
  agent_question: |
    Q18 if claude+claude-blog spawn fails (missing files / OOM / network): A=fail+notify (no retry), B=exp backoff retry, C=hybrid?
  user_answer: |
    Q18 (A) — fail + notify, no retry. Structural failures shouldn't be retried.
  summary: "Spawn failures = hard fail + operator notification with traceback. Simpler, doesn't mask bugs."

