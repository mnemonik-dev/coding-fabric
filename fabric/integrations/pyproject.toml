[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-integrations"
version = "1.0.0"
description = "Swarm bridge adapter: /do-feature to ruflo swarm MCP with workspace-manager cwd injection"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mnemonic Protocol" }]

dependencies = [
    "httpx~=0.27.0",
    "pydantic~=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0",
    "pytest-asyncio~=1.0",
    "pytest-cov~=5.0",
]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["fabric.integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
pythonpath = ["../.."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
