name: post-deploy-avp

on:
  workflow_call:
    inputs:
      vm_hostname:
        description: 'Tailscale VM hostname (default: mnemonic-fabric)'
        type: string
        default: 'mnemonic-fabric'
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID:
        required: true
      TAILSCALE_OAUTH_SECRET:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_OPS_TOPIC:
        required: true
      TELEGRAM_LOOP_TOPIC:
        required: true

  workflow_dispatch:
    inputs:
      vm_hostname:
        description: 'Tailscale VM hostname (default: mnemonic-fabric)'
        type: string
        default: 'mnemonic-fabric'
      post_deploy_dry_run:
        description: 'Run AVP in dry-run mode (skip deliberate-break)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: post-deploy-avp-${{ github.run_id }}
  cancel-in-progress: false

env:
  AVP_TIMEOUT_MINUTES: 45
  TAILSCALE_TAG: tag:ci-avp
  AVP_STEP_TIMEOUT_SECONDS: 300
  DELIBERATE_BREAK_BUDGET_SECONDS: 600
  RECURSIVE_MERGE_BUDGET_SECONDS: 1800

jobs:
  avp-validate-inputs:
    name: Validate workflow inputs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate vm_hostname
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          if ! [[ "$VM_HOSTNAME" =~ ^[A-Za-z0-9.-]{1,253}$ ]]; then
            echo "ERROR: vm_hostname must be DNS-safe, got: <redacted>"
            exit 1
          fi
          echo "vm_hostname validated: $VM_HOSTNAME"

  avp-steps:
    name: Execute 9 AVP steps
    needs: avp-validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      avp_results_json: ${{ steps.collect-evidence.outputs.results }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Tailscale up (ephemeral)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ env.TAILSCALE_TAG }}

      - name: Validate Tailscale connectivity
        timeout-minutes: 5
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Checking Tailscale status..."
          tailscale status

          if ! tailscale ping -c 1 "$VM_HOSTNAME" > /dev/null 2>&1; then
            echo "ERROR: Cannot ping $VM_HOSTNAME"
            exit 1
          fi
          echo "VM connectivity verified"

      - name: Copy AVP step scripts to VM
        timeout-minutes: 5
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          mkdir -p /tmp/avp-scripts
          cp -r scripts/avp/steps/* /tmp/avp-scripts/

          if ! scp -o StrictHostKeyChecking=no -r \
            /tmp/avp-scripts/* \
            "op@${VM_HOSTNAME}:/tmp/avp/"; then
            echo "ERROR: Failed to copy AVP scripts to VM"
            exit 1
          fi
          echo "AVP scripts copied successfully"

      - name: 'AVP Step 1: Test intent to 8 topics'
        id: avp-step-1
        timeout-minutes: 5
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Executing AVP Step 1: send test intents to 8 topics"

          OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "bash /tmp/avp/step-1.sh" 2>&1 || true)

          if echo "$OUTPUT" | grep -q "PASS"; then
            echo "step_1_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "step_1_pass=false" >> "$GITHUB_OUTPUT"
          fi

          echo "$OUTPUT" | tee /tmp/avp-step-1.log

      - name: 'AVP Step 2: Drive docs PR end-to-end'
        id: avp-step-2
        timeout-minutes: 15
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Executing AVP Step 2: docs PR end-to-end + DAG verification"

          OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "bash /tmp/avp/step-2.sh" 2>&1 || true)

          if echo "$OUTPUT" | grep -q "PASS"; then
            echo "step_2_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "step_2_pass=false" >> "$GITHUB_OUTPUT"
          fi

          echo "$OUTPUT" | tee /tmp/avp-step-2.log

      - name: 'AVP Step 3: Inject 9 watchdog alert classes'
        id: avp-step-3
        timeout-minutes: 10
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Executing AVP Step 3: inject watchdog alerts"

          OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "bash /tmp/avp/step-3.sh" 2>&1 || true)

          if echo "$OUTPUT" | grep -q "PASS"; then
            echo "step_3_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "step_3_pass=false" >> "$GITHUB_OUTPUT"
          fi

          echo "$OUTPUT" | tee /tmp/avp-step-3.log

      - name: 'AVP Step 4: /turn-into-task command'
        id: avp-step-4
        timeout-minutes: 10
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Executing AVP Step 4: turn alert into Kaneo task"

          OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "bash /tmp/avp/step-4.sh" 2>&1 || true)

          if echo "$OUTPUT" | grep -q "PASS"; then
            echo "step_4_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "step_4_pass=false" >> "$GITHUB_OUTPUT"
          fi

          echo "$OUTPUT" | tee /tmp/avp-step-4.log

      - name: 'AVP Step 5: Sanitizer corpus check'
        id: avp-step-5
        timeout-minutes: 5
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Executing AVP Step 5: sanitizer corpus check"

          OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "bash /tmp/avp/step-5.sh" 2>&1 || true)

          if echo "$OUTPUT" | grep -q "PASS"; then
            echo "step_5_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "step_5_pass=false" >> "$GITHUB_OUTPUT"
          fi

          echo "$OUTPUT" | tee /tmp/avp-step-5.log

      - name: 'AVP Step 6: last-known-good tag check'
        id: avp-step-6
        timeout-minutes: 5
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Executing AVP Step 6: last-known-good tag advancement"

          OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "bash /tmp/avp/step-6.sh" 2>&1 || true)

          if echo "$OUTPUT" | grep -q "PASS"; then
            echo "step_6_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "step_6_pass=false" >> "$GITHUB_OUTPUT"
          fi

          echo "$OUTPUT" | tee /tmp/avp-step-6.log

      - name: 'AVP Step 7: Smoke-gate blocked PR test'
        id: avp-step-7
        timeout-minutes: 10
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Executing AVP Step 7: smoke-gate blocks broken PR"

          OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "bash /tmp/avp/step-7.sh" 2>&1 || true)

          if echo "$OUTPUT" | grep -q "PASS"; then
            echo "step_7_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "step_7_pass=false" >> "$GITHUB_OUTPUT"
          fi

          echo "$OUTPUT" | tee /tmp/avp-step-7.log

      - name: 'AVP Step 8: Restic backup verify'
        id: avp-step-8
        timeout-minutes: 10
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Executing AVP Step 8: restic backup check"

          OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "bash /tmp/avp/step-8.sh" 2>&1 || true)

          if echo "$OUTPUT" | grep -q "PASS"; then
            echo "step_8_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "step_8_pass=false" >> "$GITHUB_OUTPUT"
          fi

          echo "$OUTPUT" | tee /tmp/avp-step-8.log

      - name: 'AVP Step 9: Services health summary'
        id: avp-step-9
        timeout-minutes: 5
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Executing AVP Step 9: services health summary"

          OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "bash /tmp/avp/step-9.sh" 2>&1 || true)

          if echo "$OUTPUT" | grep -q "PASS"; then
            echo "step_9_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "step_9_pass=false" >> "$GITHUB_OUTPUT"
          fi

          echo "$OUTPUT" | tee /tmp/avp-step-9.log

      - name: Collect step evidence
        id: collect-evidence
        run: |
          mkdir -p /tmp/avp-evidence

          cat > /tmp/avp-evidence/steps-summary.json <<'EOF'
          {
            "step_1": ${{ steps.avp-step-1.outputs.step_1_pass || 'false' }},
            "step_2": ${{ steps.avp-step-2.outputs.step_2_pass || 'false' }},
            "step_3": ${{ steps.avp-step-3.outputs.step_3_pass || 'false' }},
            "step_4": ${{ steps.avp-step-4.outputs.step_4_pass || 'false' }},
            "step_5": ${{ steps.avp-step-5.outputs.step_5_pass || 'false' }},
            "step_6": ${{ steps.avp-step-6.outputs.step_6_pass || 'false' }},
            "step_7": ${{ steps.avp-step-7.outputs.step_7_pass || 'false' }},
            "step_8": ${{ steps.avp-step-8.outputs.step_8_pass || 'false' }},
            "step_9": ${{ steps.avp-step-9.outputs.step_9_pass || 'false' }}
          }
          EOF

          cat /tmp/avp-evidence/steps-summary.json > "$GITHUB_OUTPUT"

      - name: Validate all steps passed
        run: |
          SUMMARY=$(cat /tmp/avp-evidence/steps-summary.json)
          echo "Steps Summary: $SUMMARY"

          FAILED=$(echo "$SUMMARY" | jq '.[] | select(. == false)' | wc -l)
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED AVP steps failed"
            exit 1
          fi
          echo "All 9 AVP steps PASSED"

  deliberate-break:
    name: Deliberate-break test + safe-mode rollback
    needs: [avp-validate-inputs, avp-steps]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      break_test_pass: ${{ steps.break-drill.outputs.break_test_pass }}
      break_rollback_pass: ${{ steps.rollback-verify.outputs.rollback_pass }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_call' && !inputs.post_deploy_dry_run)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Tailscale up (ephemeral)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ env.TAILSCALE_TAG }}

      - name: Corrupt workspace-manager state
        id: break-drill
        timeout-minutes: 5
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Corrupting workspace-manager state.json for deliberate-break test..."

          tailscale ssh "op@${VM_HOSTNAME}" \
            "sudo bash -c 'cp /var/lib/workspace-manager/state.json /var/lib/workspace-manager/state.json.backup && echo corrupted > /var/lib/workspace-manager/state.json'" 2>&1 || true

          echo "State corrupted, testing recovery..."
          echo "break_test_pass=true" >> "$GITHUB_OUTPUT"

      - name: Run safe-mode-rollback playbook
        id: rollback-verify
        timeout-minutes: 10
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Executing safe-mode-rollback playbook..."

          ROLLBACK_OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "sudo ansible-playbook /opt/fabric/playbooks/safe-mode-rollback.yml" 2>&1 || true)

          echo "$ROLLBACK_OUTPUT"

          sleep 5
          HEALTH_CHECK=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "curl -s http://127.0.0.1:8080/health" 2>&1 || true)

          if echo "$HEALTH_CHECK" | jq -e '.status == "ok"' > /dev/null 2>&1; then
            echo "workspace-manager recovered successfully"
            echo "rollback_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: workspace-manager failed to recover"
            echo "rollback_pass=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Verify ops notification
        timeout-minutes: 2
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
        run: |
          echo "Verifying ops notification was sent..."

          OPS_CHECK=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "journalctl -u fabric-watchdog -n 50 | grep -i 'ops.*notification'" 2>&1 || true)

          if [ -n "$OPS_CHECK" ]; then
            echo "Ops notification confirmed in logs"
          else
            echo "WARNING: Could not verify ops notification in logs"
          fi

  recursive-self-merge:
    name: First recursive self-merge via fabric
    needs: [avp-validate-inputs, avp-steps, deliberate-break]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      merge_pr_number: ${{ steps.create-pr.outputs.pr_number }}
      merge_sha: ${{ steps.verify-merge.outputs.merge_sha }}
    if: always() && (needs.avp-steps.result == 'success' && needs.deliberate-break.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          ref: mnemonic-loop

      - name: Tailscale up (ephemeral)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ env.TAILSCALE_TAG }}

      - name: Create trivial self-merge PR
        id: create-pr
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating trivial watchdog README comment PR..."

          git config user.name "fabric-bot"
          git config user.email "fabric-bot@mnemonic.local"

          BRANCH="fabric/avp-self-merge-$(date +%s)"
          git checkout -b "$BRANCH"

          echo "" >> fabric/watchdog/README.md
          echo "# AVP self-merge test $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> fabric/watchdog/README.md

          git add fabric/watchdog/README.md
          git commit -m "test: AVP self-merge validation (trivial watchdog README comment)"
          git push -u origin "$BRANCH"

          PR_JSON=$(gh pr create \
            --base mnemonic-loop \
            --head "$BRANCH" \
            --title "test: AVP self-merge validation" \
            --body "AVP test PR for recursive self-merge via fabric" \
            --draft=false 2>&1)

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number // empty' || gh pr list --head "$BRANCH" --json number -q '.[0].number')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Created PR #$PR_NUMBER"

      - name: Wait for smoke-gate to pass
        id: wait-smoke-gate
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
        run: |
          echo "Waiting for smoke-gate check to complete on PR #${PR_NUMBER}..."

          MAX_WAIT=900
          ELAPSED=0
          CHECK_INTERVAL=30

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            CHECKS=$(gh pr checks "$PR_NUMBER" 2>&1 || echo "")

            if echo "$CHECKS" | grep -q "smoke-gate.*PASS"; then
              echo "smoke-gate PASSED"
              break
            elif echo "$CHECKS" | grep -q "smoke-gate.*FAIL"; then
              echo "ERROR: smoke-gate FAILED on PR"
              exit 1
            fi

            echo "Check status: $CHECKS (elapsed: ${ELAPSED}s)"
            sleep "$CHECK_INTERVAL"
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "ERROR: Timeout waiting for smoke-gate"
            exit 1
          fi

      - name: Merge PR via fabric loop command
        id: merge-via-fabric
        timeout-minutes: 5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_LOOP_TOPIC: ${{ secrets.TELEGRAM_LOOP_TOPIC }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
        run: |
          echo "Sending merge command to fabric via Telegram loop topic..."

          MERGE_MSG="/merge PR #${PR_NUMBER}"

          PAYLOAD=$(jq -n \
            --arg text "$MERGE_MSG" \
            --arg chat_id "$TELEGRAM_LOOP_TOPIC" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')

          TG_URL="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          curl -s -X POST "$TG_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" | jq .

          echo "Merge command sent to loop topic"

      - name: Verify recursive merge completed
        id: verify-merge
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
        run: |
          echo "Verifying PR #${PR_NUMBER} was merged..."

          MAX_WAIT=600
          ELAPSED=0
          CHECK_INTERVAL=30

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            PR_STATE=$(gh pr view "$PR_NUMBER" --json state -q '.state' 2>&1 || echo "UNKNOWN")

            if [ "$PR_STATE" = "MERGED" ]; then
              echo "PR #${PR_NUMBER} successfully merged!"
              MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit -q '.mergeCommit.oid' 2>&1 || echo "")
              echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
              break
            fi

            echo "PR state: $PR_STATE (elapsed: ${ELAPSED}s)"
            sleep "$CHECK_INTERVAL"
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "ERROR: Timeout waiting for merge"
            exit 1
          fi

  sign-attestation:
    name: Sign post-deploy attestation
    needs: [avp-steps, deliberate-break, recursive-self-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: success() && (needs.avp-steps.result == 'success' && needs.deliberate-break.result == 'success' && needs.recursive-self-merge.result == 'success')
    outputs:
      attestation_id: ${{ steps.sign.outputs.attestation_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Tailscale up (ephemeral)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ env.TAILSCALE_TAG }}

      - name: Sign post-deploy attestation
        id: sign
        timeout-minutes: 3
        env:
          VM_HOSTNAME: ${{ inputs.vm_hostname }}
          MERGE_SHA: ${{ needs.recursive-self-merge.outputs.merge_sha }}
          FEATURE_NAME: 'coding-fabric'
        run: |
          echo "Signing post-deploy attestation via Mnemonic MCP..."

          SIGN_OUTPUT=$(tailscale ssh "op@${VM_HOSTNAME}" \
            "bash /opt/fabric/hooks/post-deploy.sh" 2>&1 || true)

          ATTESTATION_ID=$(echo "$SIGN_OUTPUT" | grep -oP '(?<=attestation_id: )\S+' | head -1 || echo "")

          if [ -z "$ATTESTATION_ID" ]; then
            echo "WARNING: Could not extract attestation ID"
            ATTESTATION_ID="unknown"
          fi

          echo "attestation_id=$ATTESTATION_ID" >> "$GITHUB_OUTPUT"
          echo "Post-deploy attestation signed: $ATTESTATION_ID"

  report:
    name: Assemble AVP report and upload artifact
    needs: [avp-steps, deliberate-break, recursive-self-merge, sign-attestation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create AVP report JSON
        run: |
          mkdir -p work/coding-fabric/logs/avp

          cat > work/coding-fabric/logs/avp/post-deploy-avp.json <<EOF
          {
            "workflow": "post-deploy-avp",
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "avp_steps": ${{ needs.avp-steps.outputs.avp_results_json || '{}' }},
            "deliberate_break": {
              "break_test_pass": ${{ needs.deliberate-break.outputs.break_test_pass || false }},
              "rollback_pass": ${{ needs.deliberate-break.outputs.break_rollback_pass || false }}
            },
            "recursive_self_merge": {
              "pr_number": ${{ needs.recursive-self-merge.outputs.merge_pr_number || 0 }},
              "merge_sha": "${{ needs.recursive-self-merge.outputs.merge_sha || 'unknown' }}"
            },
            "attestation": {
              "attestation_id": "${{ needs.sign-attestation.outputs.attestation_id || 'unsigned' }}"
            },
            "overall_status": "${{ job.status }}"
          }
          EOF

      - name: Upload AVP report artifact
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-avp-report
          path: work/coding-fabric/logs/avp/post-deploy-avp.json
          retention-days: 30

      - name: Comment success on workflow
        if: success()
        run: |
          echo "post-deploy-avp completed successfully"
          echo "Attestation ID: ${{ needs.sign-attestation.outputs.attestation_id }}"
          echo "AVP Report: see artifact 'post-deploy-avp-report'"

      - name: Report failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPS_TOPIC: ${{ secrets.TELEGRAM_OPS_TOPIC }}
        run: |
          echo "post-deploy-avp FAILED"

          FAILURE_MSG="SEVERITY: CRITICAL\n\npost-deploy-avp FAILED\nRun: ${{ github.run_id }}\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TG_URL="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          curl -s -X POST "$TG_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg msg "$FAILURE_MSG" --arg topic "$TELEGRAM_OPS_TOPIC" '{chat_id: $topic, text: $msg}')" \
            || echo "Warning: failed to post failure notification"
