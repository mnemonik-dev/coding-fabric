name: smoke-gate

on:
  pull_request:
    branches:
      - mnemonic-loop
    paths:
      - 'fabric/**'
      - 'infrastructure/ansible/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/smoke-gate.yml'

concurrency:
  group: smoke-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-gate:
    name: E2E smoke test (15min budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOCKER_BUILDKIT: '1'
      COMPOSE_DOCKER_CLI_BUILD: '1'

    steps:
      - name: Checkout candidate fabric
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate fabric image
        uses: docker/build-push-action@v5
        with:
          context: fabric/safe-mode/smoke-gate
          file: fabric/safe-mode/smoke-gate/Dockerfile
          push: false
          load: true
          tags: mnemonic-fabric-candidate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start candidate fabric services
        env:
          FABRIC_IMAGE: mnemonic-fabric-candidate:${{ github.sha }}
        run: |
          cd fabric/safe-mode/smoke-gate
          export FABRIC_IMAGE
          docker-compose -f docker-compose.yml up -d
          echo "Waiting for services to be ready..."
          sleep 5

      - name: Check service health
        timeout-minutes: 2
        run: |
          for i in {1..30}; do
            if docker-compose -f fabric/safe-mode/smoke-gate/docker-compose.yml ps | grep -q "workspace-manager.*Up"; then
              echo "Services are healthy"
              exit 0
            fi
            echo "Attempt $i/30: waiting for services..."
            sleep 2
          done
          echo "ERROR: services failed to start"
          docker-compose -f fabric/safe-mode/smoke-gate/docker-compose.yml logs
          exit 1

      - name: Run trivial docs-task smoke test
        timeout-minutes: 10
        run: |
          bash fabric/safe-mode/smoke-gate/run.sh
          echo "Smoke test completed successfully"

      - name: Verify task completed
        run: |
          # Check that a result file was created indicating success
          if [[ ! -f /tmp/smoke-task-complete ]]; then
            echo "ERROR: smoke task did not complete"
            exit 1
          fi
          echo "Task verified complete"

      - name: Collect service logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/smoke-logs
          docker-compose -f fabric/safe-mode/smoke-gate/docker-compose.yml logs > /tmp/smoke-logs/services.log
          docker ps -a > /tmp/smoke-logs/containers.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-gate-logs
          path: /tmp/smoke-logs/
          retention-days: 7

      - name: Stop candidate services
        if: always()
        run: |
          cd fabric/safe-mode/smoke-gate
          docker-compose -f docker-compose.yml down -v

      - name: Post failure to ops on Telegram
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_OPS_TOPIC }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            smoke-gate FAILED on PR #${{ github.event.pull_request.number }}
            Branch: ${{ github.head_ref }}
            Commit: ${{ github.sha }}
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Report success
        if: success()
        run: |
          echo "smoke-gate PASSED: candidate fabric validated within 15min budget"
