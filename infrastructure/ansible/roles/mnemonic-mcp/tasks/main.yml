---
# Install the Mnemonik MCP binary from the npm scoped package
# `@mnemonik-xyz/mcp@<version>`. After install, discover the actual binary
# name (drifted between `mnemonik-mcp` and `mnemonic-mcp` across versions)
# and expose it as fact `mnemonic_mcp_binary` for downstream roles (Task 3
# templates `/etc/blogger.mcp.json` from this fact).
#
# IMPORTANT — NOT a daemon. MCP-stdio is a per-spawn subprocess pattern:
# consumers (content-publisher attest, future bot Claude Code `.mcp.json`)
# spawn `mnemonik-mcp mcp-stdio` themselves over PIPE stdin/stdout, exchange
# a JSON-RPC initialize handshake + tools/call, close stdin → child exits.
# A long-running systemd unit immediately hits EOF on stdin and core-dumps.
# This role installs the binary and validates it via a one-shot handshake
# only; it does NOT register a systemd service.

# When the role is disabled, set the fact to an empty sentinel so downstream
# roles that reference `mnemonic_mcp_binary` (Task 3's blogger.mcp.json
# template) get a clearly-empty `command:` field rather than a cryptic
# Jinja `UndefinedError`. Downstream consumers fail-loud on the empty
# command at first attest, which is the right failure mode.
- name: Set empty mnemonic_mcp_binary sentinel when role is disabled
  ansible.builtin.set_fact:
    mnemonic_mcp_binary: ""
  when: not (mnemonic_mcp_enabled | bool)

- name: Mnemonik MCP install + configure
  when: mnemonic_mcp_enabled | bool
  block:
    - name: Ensure Mnemonik MCP install dir exists
      ansible.builtin.file:
        path: "{{ mnemonik_mcp_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ------------------------------------------------------------------
    # Node.js prerequisite (pattern lifted from
    # roles/telegram-ai-agent/tasks/main.yml:63-88).
    # ------------------------------------------------------------------
    - name: Check whether node is already on PATH
      ansible.builtin.command: node --version
      register: mnemonik_node_check
      changed_when: false
      failed_when: false

    - name: Register NodeSource APT repository (setup_20.x)
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args:
        executable: /bin/bash
      when: mnemonik_node_check.rc != 0
      changed_when: true

    - name: Install Node.js (provides node + npm)
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true
      when: mnemonik_node_check.rc != 0

    # ------------------------------------------------------------------
    # GitHub CLI >= 2.40 (provides `gh attestation verify`). The shim's
    # install-binary.ts calls `gh attestation verify --repo --signer-workflow`
    # on every binary fetch — fail-closed per security audit round 2 (no
    # env override exists to skip). Ubuntu apt-default ships gh ~2.34
    # which does NOT have the `attestation` subcommand; we must install
    # from cli.github.com to get >= 2.40.
    # ------------------------------------------------------------------
    - name: Check gh attestation subcommand availability
      ansible.builtin.command: gh attestation --help
      register: gh_attest_check
      changed_when: false
      failed_when: false

    - name: Install GitHub CLI APT keyring
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
        mode: "0644"
      when: gh_attest_check.rc != 0

    - name: Register GitHub CLI APT repo
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
        filename: github-cli
        state: present
      when: gh_attest_check.rc != 0

    - name: Install gh from cli.github.com (>= 2.40 for `attestation verify`)  # noqa: package-latest
      # state: latest is INTENTIONAL here — the `gh_attest_check.rc != 0`
      # guard above ensures this task runs ONLY when the installed gh
      # lacks `attestation` (i.e. ubuntu apt-default 2.34). state: present
      # would be a no-op when gh-2.34 is already installed; we need apt to
      # actually upgrade to the cli.github.com version. After the first
      # successful run, the check short-circuits the whole block on every
      # subsequent deploy — no thrash, no per-deploy network call.
      ansible.builtin.apt:
        name: gh
        state: latest
        update_cache: true
      when: gh_attest_check.rc != 0

    # ------------------------------------------------------------------
    # Defensive cleanup of any stale binary from the prior descoped install
    # at /opt/mnemonic-mcp/bin/mnemonic-mcp. If that path lingered on PATH
    # the discovery cascade below would pick it up first and the smoke
    # handshake would fail confusingly. `failed_when: false` because the
    # path may not exist on a fresh VM — that's fine.
    # ------------------------------------------------------------------
    - name: Remove stale descoped binary from prior install (idempotent)
      ansible.builtin.file:
        path: /opt/mnemonic-mcp/bin/mnemonic-mcp
        state: absent
      failed_when: false

    # ------------------------------------------------------------------
    # Single-step lockfile install: every byte of the dependency tree comes
    # from `files/package-lock.json` (npm ci enforces hash integrity per
    # transitive package). The binary is then exposed system-wide via a
    # symlink — no separate registry resolution, no two-tree divergence.
    # See security-auditor T2-SEC-002 round 1.
    # ------------------------------------------------------------------
    - name: Copy package.json into install dir
      ansible.builtin.copy:
        content: |
          {
            "name": "mnemonik-mcp-deploy",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "{{ mnemonik_mcp_npm_package }}": "{{ mnemonik_mcp_npm_version }}"
            }
          }
        dest: "{{ mnemonik_mcp_install_dir }}/package.json"
        owner: root
        group: root
        mode: "0644"
      register: mnemonik_packagejson_copy

    - name: Copy pinned package-lock.json into install dir
      ansible.builtin.copy:
        src: package-lock.json
        dest: "{{ mnemonik_mcp_install_dir }}/package-lock.json"
        owner: root
        group: root
        mode: "0644"
      register: mnemonik_lockfile_copy

    - name: Install pinned tree via npm ci (single supply-chain anchor)
      # `npm ci` enforces every per-package integrity hash from the lockfile;
      # `--no-fund` quietens donation prompts. We keep `--audit` (no
      # `--no-audit`) — the lockfile pins what we get, but the advisory
      # check still surfaces CVE info worth seeing (security-auditor
      # T2-SEC-001 round 1).
      ansible.builtin.command:
        chdir: "{{ mnemonik_mcp_install_dir }}"
        cmd: npm ci --no-fund
      register: mnemonik_npm_ci
      changed_when: mnemonik_npm_ci.rc == 0
      when: mnemonik_lockfile_copy.changed or mnemonik_packagejson_copy.changed

    - name: Symlink Mnemonik MCP binary to /usr/local/bin
      # The binary is provided by the lockfile-installed tree at
      # `{{ mnemonik_mcp_install_dir }}/node_modules/.bin/<binary>`. We use a
      # single canonical spelling here that matches the currently-pinned
      # version (`mnemonik-mcp` per `@mnemonik-xyz/mcp@0.2.4`); the
      # downstream discovery cascade still tolerates either spelling
      # because the symlink itself is the resolution. If a future version
      # ships a different bin name, this symlink will fail to create and
      # bump-runbook step 7 takes effect.
      ansible.builtin.file:
        src: "{{ mnemonik_mcp_install_dir }}/node_modules/.bin/mnemonik-mcp"
        dest: /usr/local/bin/mnemonik-mcp
        state: link
        force: true

    # ------------------------------------------------------------------
    # Binary-name discovery. The symlink above guarantees `mnemonik-mcp`
    # resolves on PATH; the cascade is kept as defense-in-depth for the
    # case where a future bump's bin spelling reverts to the older
    # `mnemonic-mcp` form and the maintainer extends this role.
    # ------------------------------------------------------------------
    - name: Discover installed Mnemonik MCP binary name
      ansible.builtin.shell: |
        set -euo pipefail
        which mnemonik-mcp || which mnemonic-mcp
      args:
        executable: /bin/bash
      register: mnemonik_which
      changed_when: false
      failed_when: mnemonik_which.rc != 0

    - name: Set mnemonic_mcp_binary fact for downstream roles
      ansible.builtin.set_fact:
        mnemonic_mcp_binary: "{{ mnemonik_which.stdout | trim }}"

    # ------------------------------------------------------------------
    # Remove any systemd unit left over from earlier role iterations that
    # tried to run `mnemonik-mcp mcp-stdio` as a long-running daemon. That
    # design crashed on first start (SIGTRAP — EOF on systemd-supplied
    # StandardInput=null). Defense-in-depth: idempotently delete the unit
    # so a re-deploy onto an old VM doesn't leave a failed/loaded service.
    - name: Remove obsolete mnemonic-mcp.service (per-spawn pattern only)
      ansible.builtin.file:
        path: /etc/systemd/system/mnemonic-mcp.service
        state: absent
      notify: reload systemd after mnemonic-mcp unit removal

    # ------------------------------------------------------------------
    # Smoke: MCP-stdio JSON-RPC initialize handshake. This is the SAME
    # subprocess pattern content-publisher uses in production — spawn the
    # binary, push initialize on stdin, read one JSON-RPC frame, close.
    # Proves the binary speaks MCP over stdio (Decision 3 + Architecture
    # step 4). Full payload via stdin — nothing of substance in argv
    # (R2 — no `ps` leakage).
    - name: Smoke MCP-stdio initialize handshake
      ansible.builtin.shell: |
        set -euo pipefail
        payload='{"jsonrpc":"2.0","id":1,"method":"initialize",'
        payload+='"params":{"protocolVersion":"2024-11-05",'
        payload+='"capabilities":{},'
        payload+='"clientInfo":{"name":"role-smoke","version":"0.1"}}}'
        printf '%s\n' "$payload" \
          | "{{ mnemonic_mcp_binary }}" mcp-stdio \
          | head -1 \
          | python3 -c 'import json,sys; r=json.loads(sys.stdin.read()); assert "protocolVersion" in r.get("result", {}), r'
      args:
        executable: /bin/bash
      register: mnemonik_smoke
      changed_when: false
      failed_when: mnemonik_smoke.rc != 0
