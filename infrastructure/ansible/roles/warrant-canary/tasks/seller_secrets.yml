---
# seller.env and seller.key (bare 64-hex, D10) into _wc_secrets_target:
# dir root:root 0711, files 0600 owned by the seller container UID.
- name: Inspect the seller secrets (booleans only in the result)
  ansible.builtin.set_fact:
    _wc_seller_secret_checks:
      seller_key_hex_is_64_hex: "{{ warrant_canary_seller_key_hex | string | trim | regex_replace('^0x', '') is regex('\\A' ~ '[0-9a-fA-F]{64}' ~ '\\Z') }}"
      ionet_api_key_present: "{{ warrant_canary_ionet_api_key | length > 0 }}"
      mcp_auth_user_present: "{{ warrant_canary_mcp_auth_user | length > 0 }}"
      mcp_auth_pass_present: "{{ warrant_canary_mcp_auth_pass | length > 0 }}"
  no_log: true

- name: Refuse missing or malformed seller secrets
  ansible.builtin.assert:
    that: _wc_seller_secret_checks | dict2items | rejectattr('value', 'equalto', true) | list | length == 0
    fail_msg: "Seller secrets failed: {{ _wc_seller_secret_checks | dict2items | rejectattr('value', 'equalto', true) | map(attribute='key') | join(', ') }}"
    quiet: true

- name: Secrets directory root:root 0711
  become: true
  ansible.builtin.file:
    path: "{{ _wc_secrets_target }}"
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: seller.env
  become: true
  ansible.builtin.template:
    src: seller.env.j2
    dest: "{{ _wc_secrets_target }}/seller.env"
    owner: "{{ warrant_canary_seller_uid }}"
    group: "{{ warrant_canary_seller_uid }}"
    mode: "0600"
  no_log: true

- name: seller.key (bare 64-hex without 0x)
  become: true
  ansible.builtin.copy:
    content: "{{ warrant_canary_seller_key_hex | string | trim | regex_replace('^0x', '') }}"
    dest: "{{ _wc_secrets_target }}/seller.key"
    owner: "{{ warrant_canary_seller_uid }}"
    group: "{{ warrant_canary_seller_uid }}"
    mode: "0600"
  no_log: true
