---
- name: Skip Universal Paywall staging when disabled
  ansible.builtin.meta: end_role
  when: not universal_paywall_staging_enabled | bool

- name: Assert Universal Paywall staging SOPS secrets are present
  ansible.builtin.assert:
    that:
      - universal_paywall_staging_facilitator_key | length == 66
      - universal_paywall_staging_facilitator_key is match('^0x[0-9A-Fa-f]{64}$')
      - universal_paywall_staging_service_api_key | length >= 32
      - universal_paywall_staging_receipt_private_key_pem | length >= 100
      - universal_paywall_staging_mcp_jwt_secret | length >= 32
      - universal_paywall_staging_mcp_refresh_salt | length >= 32
      - universal_paywall_staging_mnemonic_keypair_json | length >= 32
      - universal_paywall_staging_domain is match('^[A-Za-z0-9.-]+$')
      - universal_paywall_staging_arc_rpc_url is match('^https://[^/]+')
      - universal_paywall_staging_pay_to is match('^0x[0-9A-Fa-f]{40}$')
      - universal_paywall_staging_solana_rpc_url is match('^https://[^/]+')
      - universal_paywall_staging_irys_url is match('^https://[^/]+')
      - universal_paywall_staging_facilitator_url == 'http://facilitator:8403' or universal_paywall_staging_facilitator_url is match('^https://[^/]+')
    fail_msg: >-
      Universal Paywall staging is enabled but its required SOPS values are
      missing or malformed. Edit infrastructure/secrets/secrets.sops.yml with
      sops, then rerun the tagged fabric deploy.
  no_log: true

- name: Create Universal Paywall staging directories
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
  loop:
    # The deployment account needs traverse-only access for `docker compose`
    # to resolve the protected env file. The env and private keys themselves
    # remain mode 0600 and are never readable by this group.
    - { path: '{{ universal_paywall_staging_dir }}', owner: root, group: '{{ universal_paywall_staging_operator }}', mode: '0750' }
    - { path: '{{ universal_paywall_staging_dir }}/secrets', owner: root, group: root, mode: '0711' }
  no_log: true

- name: Render Universal Paywall staging environment from SOPS
  ansible.builtin.template:
    src: staging.env.j2
    dest: '{{ universal_paywall_staging_dir }}/.env'
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Render facilitator receipt key from SOPS
  ansible.builtin.copy:
    content: '{{ universal_paywall_staging_receipt_private_key_pem }}\n'
    dest: '{{ universal_paywall_staging_dir }}/secrets/receipt-private-key.pem'
    owner: '{{ universal_paywall_staging_receipt_key_uid }}'
    group: '{{ universal_paywall_staging_receipt_key_uid }}'
    mode: '0600'
  no_log: true

- name: Render Mnemonic staging keypair from SOPS
  ansible.builtin.copy:
    content: '{{ universal_paywall_staging_mnemonic_keypair_json }}\n'
    dest: '{{ universal_paywall_staging_dir }}/secrets/mnemonic-id.json'
    owner: '{{ universal_paywall_staging_receipt_key_uid }}'
    group: '{{ universal_paywall_staging_receipt_key_uid }}'
    mode: '0600'
  no_log: true
