---
# Per-topic create-or-skip sequence. Included with loop from main.yml because
# Ansible blocks themselves cannot use `loop:` directly — only the include_tasks
# loops over the block. loop_var: topic_name is the topic identifier
# (e.g. core, mcp, wasm, ops).

- name: Skip — topic already exists in persisted state
  ansible.builtin.set_fact:
    telegram_topics: "{{ telegram_topics | combine({topic_name: existing_topics[topic_name]}) }}"
  when: topic_name in existing_topics

- name: Create new topic (only if not in persisted state)
  # createForumTopic is NOT idempotent on Telegram's side — calling it again
  # for the same name CREATES A NEW THREAD. Gate this task on the persisted
  # state (existing_topics, loaded from /etc/fabric/telegram-topics.yml in
  # main.yml). Without this gate, every redeploy spammed 8 fresh topics.
  ansible.builtin.uri:
    url: "https://api.telegram.org/bot{{ telegram_bot_token }}/createForumTopic"
    method: POST
    body_format: json
    body:
      chat_id: "{{ telegram_forum_chat_id }}"
      name: "{{ topic_name }}"
      icon_color: "{{ canonical_topics[topic_name].color }}"
    status_code: [200, 400, 403, 429, 500, 502, 503, 504]
    timeout: "{{ telegram_api_timeout }}"
  register: create_topic_response
  retries: "{{ telegram_api_retries }}"
  delay: "{{ telegram_api_delay }}"
  until: create_topic_response.status in [200, 400]
  failed_when: create_topic_response.status not in [200, 400]
  when: topic_name not in existing_topics

- name: Map newly created topic to thread_id (when API returned 200)
  ansible.builtin.set_fact:
    telegram_topics: "{{ telegram_topics | combine({topic_name: create_topic_response.json.result.message_thread_id}) }}"
  when:
    - topic_name not in existing_topics
    - create_topic_response.status | default(0) == 200
    - create_topic_response.json.result.message_thread_id is defined

- name: Topic already existed on Telegram (400) — left out of state
  ansible.builtin.debug:
    msg: "Topic '{{ topic_name }}' already exists on Telegram (HTTP 400) but not in our VM state — operator must add it manually to /etc/fabric/telegram-topics.yml after looking up the thread_id"
  when:
    - topic_name not in existing_topics
    - create_topic_response.status | default(0) == 400

- name: Rate limit pause between API calls
  ansible.builtin.pause:
    seconds: "{{ telegram_api_rate_limit }}"
  when: topic_name not in existing_topics
