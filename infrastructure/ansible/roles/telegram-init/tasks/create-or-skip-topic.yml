---
# Per-topic create-or-skip sequence. Included with loop from main.yml because
# Ansible blocks themselves cannot use `loop:` directly — only the include_tasks
# loops over the block. loop_var: topic_name is the topic identifier
# (e.g. core, mcp, wasm, ops).

- name: Create or recreate topic (idempotent on Telegram side)
  # We treat the call as idempotent: if the topic already exists, Telegram
  # returns 200 with a new thread_id or 400 with "topic already exists" —
  # both are acceptable for our purpose (we don't depend on the exact
  # thread_id across redeploys; the inventory is regenerated each run).
  # Loosening the failed_when accepts 200 and 400.
  ansible.builtin.uri:
    url: "https://api.telegram.org/bot{{ telegram_bot_token }}/createForumTopic"
    method: POST
    body_format: json
    body:
      chat_id: "{{ telegram_forum_chat_id }}"
      name: "{{ topic_name }}"
      icon_color: "{{ canonical_topics[topic_name].color }}"
    status_code: [200, 400, 403, 429, 500, 502, 503, 504]
    timeout: "{{ telegram_api_timeout }}"
  register: create_topic_response
  retries: "{{ telegram_api_retries }}"
  delay: "{{ telegram_api_delay }}"
  until: create_topic_response.status in [200, 400]
  failed_when: create_topic_response.status not in [200, 400]
  # no_log dropped — bot token isn't in the response body. Allows diagnosis.

- name: Map newly created topic to thread_id (when API returned 200)
  ansible.builtin.set_fact:
    telegram_topics: "{{ telegram_topics | combine({topic_name: create_topic_response.json.result.message_thread_id}) }}"
  when:
    - create_topic_response.status == 200
    - create_topic_response.json.result.message_thread_id is defined

- name: Topic already existed (400) — leave mapping unset for this name
  ansible.builtin.debug:
    msg: "Topic '{{ topic_name }}' already exists on Telegram (HTTP 400) — skipping create"
  when: create_topic_response.status == 400

- name: Rate limit pause between API calls
  ansible.builtin.pause:
    seconds: "{{ telegram_api_rate_limit }}"
