---
# warrant-canary molecule scenario (D6). Run from roles/warrant-canary:
#   molecule test
# Privileged Ubuntu 24.04 with its own Docker daemon (prepare.yml), the `op`
# user with passwordless sudo, fakes for cast/forge/anvil/warrant-host/
# warrant-solver and a local fixture policy-execution repository.
# The role directory name has a hyphen (like the other roles here).
role_name_check: 2

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../requirements.yml
    role-file: ${MOLECULE_PROJECT_DIRECTORY}/../../requirements.yml

driver:
  name: docker

platforms:
  - name: warrant-canary-test
    image: ubuntu:24.04
    hostname: warrant-canary-test
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Named volume (not the host's /var/lib/docker) so the inner daemon
      # gets a real filesystem for overlay2 and never touches the host daemon.
      - warrant-canary-molecule-docker:/var/lib/docker

provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        vars:
          # converge and verify connect as the operator, as on the VM.
          ansible_user: op
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  log: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
