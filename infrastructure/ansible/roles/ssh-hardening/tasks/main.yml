---
- name: SSH hardening - disable root login
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: /usr/sbin/sshd -t -f %s
    backup: true
  notify: reload sshd

- name: SSH hardening - disable password authentication
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: /usr/sbin/sshd -t -f %s
    backup: true
  notify: reload sshd

- name: Wait for Tailscale SSH to be ready (probe via tailnet IP)
  ansible.builtin.wait_for_connection:
    delay: 2
    timeout: 30
  register: tailnet_conn_check

- name: Flush handlers to reload sshd with hardened config
  ansible.builtin.meta: flush_handlers
