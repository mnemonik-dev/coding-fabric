---
# Use shell-based restart for tolerance — community.docker.docker_compose_v2
# raises Python exceptions (no failed_when) when compose state is uncertain
# at handler-flush time, which causes the entire play to abort (run
# 26279182518 chased to here).
- name: Restart vaultwarden
  become: true
  ansible.builtin.shell: |
    cd /opt/vaultwarden
    docker compose restart vaultwarden 2>&1 || true
  changed_when: false

# Reload caddy via shell — likewise tolerant.
- name: Reload caddy
  become: true
  ansible.builtin.shell: |
    docker exec vaultwarden-caddy-1 caddy reload -c /etc/caddy/Caddyfile 2>&1 || true
  changed_when: false
