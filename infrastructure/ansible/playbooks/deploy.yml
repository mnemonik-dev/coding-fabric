---
#
# deploy.yml — main fabric deployment playbook
# Orchestrates 10 Ansible roles in sequence to bring up the complete fabric on a Hetzner VM.
#
# Invoked by:
#  - CI job deploy-fabric.yml (T24), post-infrastructure provisioning
#  - Operator: ansible-playbook -i infrastructure/ansible/inventory/hosts.yml infrastructure/ansible/playbooks/deploy.yml
#
# Roles (in order):
#  1. base              — OS hardening, ufw, unattended-upgrades, operator user, base dirs
#  2. ssh-hardening     — SSH key policy, disable password auth, key rotation
#  3. tailscale         — Tailscale VPN membership, routes, tag-based access
#  4. vaultwarden       — Secrets vault (docker-compose + Caddy reverse-proxy)
#  5. kaneo             — Observability backend (docker-compose, 6 default projects)
#  6. telegram-init     — Telegram forum + 8 topic creation (Bot API)
#  7. restic-backups    — Nightly off-site backups + verify-restore
#  8. molyanov          — Project knowledge + PK guard hook
#  9. mnemonic-mcp      — Local Mnemonic MCP server + 5 trigger-point hooks
#                          (DESCOPED 2026-05: disabled by default; gated by
#                          mnemonic_mcp_enabled var. Backlog feature:
#                          work/mnemonic-attestation-integration/)
# 10. fabric-services   — Deploy compiled fabric artefacts (workspace-manager, watchdog, safe-mode, etc.)
# 11. telegram-ai-agent — telegram-ai-agent bot + per-topic cwd:DYNAMIC resolver config
#
# Note: ruflo role removed 2026-05-20 (inherited-without-critical-eval cleanup;
# see work/coding-fabric/decisions.md Round 3 section).
#

- name: Deploy fabric infrastructure
  hosts: all
  become: yes
  gather_facts: yes
  environment:
    # apt-listchanges (installed by base role) can pop an interactive prompt
    # during package install on the VM, which silently hangs the Ansible SSH
    # session (multiple runs killed at "Install system Python packages").
    # Force noninteractive globally for every task in the play.
    DEBIAN_FRONTEND: noninteractive
    APT_LISTCHANGES_FRONTEND: none

  pre_tasks:
    - name: Display deployment info
      debug:
        msg: |
          Deploying to host: {{ inventory_hostname }}
          Ansible version: {{ ansible_version.full }}
          Playbook: deploy.yml

    - name: Load sops-encrypted secrets (controller-side, namespaced as `sops`)
      # Decrypts on the runner via community.sops + SOPS_AGE_KEY_FILE env. All
      # entries become accessible as sops.<key>. Run 26182238252 failed at
      # tailscale role assert because secrets were never loaded — the playbook
      # referenced vault_* vars that were undefined → empty → assertion failed.
      delegate_to: localhost
      become: false
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/secrets.sops.yml"
        name: sops
      no_log: true
      tags: [always]

    - name: Expose sops keys as flat vault_* facts for role consumption
      # The roles use the vault_* naming convention. Map sops.<key> → vault_<key>
      # in a single set_fact so the rest of the playbook is unchanged. Defaults
      # for optional keys ('' for empty) prevent jinja2 KeyError when a sops
      # field is intentionally blank (e.g. anthropic_api_key fallback).
      delegate_to: localhost
      become: false
      tags: [always]
      set_fact:
        vault_tailscale_auth_key:           "{{ sops.tailscale_auth_key }}"
        vault_vaultwarden_admin_password:   "{{ sops.vaultwarden_initial_admin_password }}"
        vault_vaultwarden_admin_token:      "{{ sops.vaultwarden_admin_token }}"
        vault_telegram_bot_token:           "{{ sops.telegram_bot_token }}"
        vault_telegram_forum_chat_id:       "{{ sops.telegram_forum_chat_id }}"
        vault_telegram_ops_thread_id:       "{{ sops.telegram_ops_thread_id | default('0') }}"
        # `sops set` doesn't accept bare JSON arrays via CLI so the
        # stored value is a JSON-array-as-string ("[206475911]"). Parse
        # it back to a real list defensively; tolerate either shape so
        # operators editing sops by hand can use real YAML lists too.
        vault_telegram_allowed_user_ids: >-
          {%- set raw = sops.telegram_allowed_user_ids | default('[]') -%}
          {{ (raw | from_json) if (raw is string) else raw }}
        vault_claude_code_oauth_token:      "{{ sops.claude_code_oauth_token | default('') }}"
        vault_anthropic_api_key:            "{{ sops.anthropic_api_key | default('') }}"
        vault_openai_api_key:               "{{ sops.openai_api_key | default('') }}"
        vault_deepgram_api_key:             "{{ sops.deepgram_api_key | default('') }}"
        vault_github_deploy_pat:            "{{ sops.github_deploy_pat | default('') }}"
        vault_restic_repository:            "{{ sops.restic_repository }}"
        vault_restic_password:              "{{ sops.restic_password }}"
        # Kaneo (current upstream uses Postgres + AUTH_SECRET; the old
        # KANEO_API_TOKEN env var was removed). Both keys MUST be set in
        # sops before enabling the role.
        vault_kaneo_auth_secret:            "{{ sops.kaneo_auth_secret | default('') }}"
        vault_kaneo_postgres_password:      "{{ sops.kaneo_postgres_password | default('') }}"
        # Kaneo MCP bearer — populated after running scripts/pair-kaneo.py
        # on the VM (one-time device-code flow with Kaneo). Empty default
        # on first deploy; the bot template just renders empty env vars,
        # and bot_mcp_runtime keeps the kaneo MCP server unwired until
        # both vars carry values.
        vault_kaneo_mcp_url:                "{{ sops.kaneo_mcp_url | default('') }}"
        vault_kaneo_mcp_bearer:             "{{ sops.kaneo_mcp_bearer | default('') }}"
        vault_universal_paywall_staging_enabled: "{{ sops.universal_paywall_staging_enabled | default(false) | bool }}"
        vault_universal_paywall_staging_facilitator_key: "{{ sops.universal_paywall_staging_facilitator_key | default('') }}"
        vault_universal_paywall_staging_service_api_key: "{{ sops.universal_paywall_staging_service_api_key | default('') }}"
        vault_universal_paywall_staging_receipt_private_key_pem: "{{ sops.universal_paywall_staging_receipt_private_key_pem | default('') }}"
        vault_universal_paywall_staging_mcp_jwt_secret: "{{ sops.universal_paywall_staging_mcp_jwt_secret | default('') }}"
        vault_universal_paywall_staging_mcp_refresh_salt: "{{ sops.universal_paywall_staging_mcp_refresh_salt | default('') }}"
        vault_universal_paywall_staging_mnemonic_keypair_json: "{{ sops.universal_paywall_staging_mnemonic_keypair_json | default('') }}"
        vault_universal_paywall_staging_domain: "{{ sops.universal_paywall_staging_domain | default('') }}"
        vault_universal_paywall_staging_arc_rpc_url: "{{ sops.universal_paywall_staging_arc_rpc_url | default('') }}"
        vault_universal_paywall_staging_pay_to: "{{ sops.universal_paywall_staging_pay_to | default('') }}"
        vault_universal_paywall_staging_facilitator_url: "{{ sops.universal_paywall_staging_facilitator_url | default('http://facilitator:8403') }}"
        vault_universal_paywall_staging_solana_rpc_url: "{{ sops.universal_paywall_staging_solana_rpc_url | default('') }}"
        vault_universal_paywall_staging_irys_url: "{{ sops.universal_paywall_staging_irys_url | default('') }}"
        # Content publisher (work/content-publish-pipeline/). All defaults
        # empty/safe so first deploy with placeholder sops doesn't fail —
        # content-publisher role is gated on a non-empty bot token and
        # falls inert when unconfigured (see Task 3).
        vault_blogger_telegram_bot_token:    "{{ sops.blogger_telegram_bot_token | default('') }}"
        vault_blogger_telegram_channel:      "{{ sops.blogger_telegram_channel | default('@mnemonik') }}"
        vault_blogger_prompts_topic_id:      "{{ sops.blogger_prompts_topic_id | default('0') }}"
        vault_publish_min_score:             "{{ sops.publish_min_score | default(80) }}"
        vault_publish_approval_timeout_min:  "{{ sops.publish_approval_timeout_min | default(5) }}"
        vault_publish_mode:                  "{{ sops.publish_mode | default('approval') }}"
        vault_publish_auto_mode_token:       "{{ sops.publish_auto_mode_token | default('') }}"
        vault_publish_auto_mode_token_confirm: "{{ sops.publish_auto_mode_token_confirm | default('') }}"
        vault_blogger_repo_ref:              "{{ sops.blogger_repo_ref | default('') }}"
        vault_claude_blog_repo_ref:          "{{ sops.claude_blog_repo_ref | default('') }}"
        vault_publish_callback_hmac_secrets: "{{ sops.publish_callback_hmac_secrets | default('') }}"
      no_log: true

    - name: Wait for system to stabilize post-boot
      wait_for:
        timeout: 30
      when: ansible_os_family == 'Debian'

    - name: Update apt cache (one-time at start)
      apt:
        update_cache: yes
        cache_valid_time: 600

  roles:
    # Phase 1: Base infrastructure (OS, users, security)
    - role: base
      tags: [base, always]
      vars:
        fabric_hostname: "{{ inventory_hostname }}"
        base_operator_user: "operator"

    - role: ssh-hardening
      tags: [ssh-hardening, security]
      vars:
        ssh_hardening_disable_password_auth: true
        ssh_hardening_key_rotation_days: 90

    # Phase 2: VPN + secrets (Tailscale + Vaultwarden)
    - role: tailscale
      tags: [tailscale, networking]
      vars:
        # Role's var is named `tailscale_authkey` (no underscore between auth
        # and key). Don't rename; map the sops field to what the role expects.
        tailscale_authkey: "{{ vault_tailscale_auth_key }}"
        tailscale_hostname: "{{ inventory_hostname }}"
        tailscale_routes: ["10.0.0.0/8"]

    - role: vaultwarden
      tags: [vaultwarden, secrets]
      vars:
        vaultwarden_data_dir: "/opt/vaultwarden"
        vaultwarden_initial_admin_password: "{{ vault_vaultwarden_admin_password | default('') }}"
        # Run 26185680537 failed at "Assert required secrets are provided" —
        # the role checks `vaultwarden_admin_token`, but only the initial
        # admin password was being passed. Map the second sops field too.
        vaultwarden_admin_token: "{{ vault_vaultwarden_admin_token }}"
        vaultwarden_tailnet_bind_only: true
        # Shared with kaneo role — Caddy serves both vhosts from the same
        # container. ACME email is required when a public vhost is enabled.
        caddy_acme_email: "{{ sops.caddy_acme_email | default('bogdan.sivochkin@gmail.com') }}"

    # Phase 3: Kaneo (tickets) + Telegram (Bot setup)
    # Kaneo role rewritten 2026-05-24 to match upstream's current shape
    # (Postgres + AUTH_SECRET + port 5173). Earlier descope (run
    # 26212106417) was on the old SQLite + KANEO_API_TOKEN shape. Default
    # workspace + projects are created on first UI login or via MCP from
    # the bot — no static-token seeding.
    - role: kaneo
      tags: [kaneo, observability]
      when: kaneo_enabled | default(true) | bool
      vars:
        kaneo_auth_secret: "{{ vault_kaneo_auth_secret }}"
        kaneo_postgres_password: "{{ vault_kaneo_postgres_password }}"
        # Public ingress — set to a domain whose DNS A record points
        # at the VM's public IPv4. Empty = tailnet-only (default).
        kaneo_public_domain: "{{ sops.kaneo_public_domain | default('kaneo.mnemonik.xyz') }}"

    - role: telegram-init
      tags: [telegram-init, communication]
      vars:
        telegram_bot_token: "{{ vault_telegram_bot_token | default('') }}"
        telegram_forum_chat_id: "{{ vault_telegram_forum_chat_id | default('') }}"
        telegram_topics:
          - name: core
            description: "mnemonic-core development"
          - name: mcp
            description: "MCP protocol work"
          - name: wasm
            description: "WASM compilation + browser harness"
          - name: demo-client
            description: "Demo client integration"
          - name: docs
            description: "Documentation + user-spec"
          - name: loop
            description: "Fabric recursive self-hosting"
          - name: protocol-qa
            description: "Protocol QA and testing"
          - name: ops
            description: "Operational alerts + safe-mode"
          - name: blogger-prompts
            description: "Content publisher briefs and approvals"

    # Phase 4: Persistence (backups)
    # DESCOPED for happy-path first deploy (run 26222590804):
    # restic init fails with auth error on Hetzner Storage Box — the user
    # needs to upload an SSH key to the Storage Box admin UI first
    # (https://robot.hetzner.com/storage), then mirror the corresponding
    # private key into /root/.ssh/ on the VM (or use the operator's key).
    # Re-enable by setting restic_backups_enabled=true.
    - role: restic-backups
      tags: [restic-backups, persistence]
      when: restic_backups_enabled | default(false) | bool
      vars:
        restic_repository: "{{ vault_restic_repository | default('') }}"
        restic_password: "{{ vault_restic_password | default('') }}"
        # Role's assertion requires telegram_bot_token + telegram_ops_chat_id
        # for failure notifications. ops topic lives inside the forum
        # supergroup, so chat_id = forum_chat_id (cast to string — sops emits
        # the negative number as int).
        telegram_bot_token: "{{ vault_telegram_bot_token | default('') }}"
        telegram_ops_chat_id: "{{ vault_telegram_forum_chat_id | string }}"
        telegram_ops_thread_id: "{{ vault_telegram_ops_thread_id | default('0') }}"
        restic_backup_paths:
          - /opt/vaultwarden
          - /opt/mnemonic-loop
        restic_retention_days: 30

    # Phase 5: Development substrate (molyanov)
    - role: molyanov
      tags: [molyanov, substrate]
      vars:
        # cloud-init created 'op'; the role's default 'mnemonic-operator'
        # doesn't exist (run 26223696015: "chown failed: failed to look
        # up user mnemonic-operator"). Also override the matching home dir.
        molyanov_operator_user: op
        molyanov_operator_home: /home/op
        # Real ops-topic id from telegram-init (set in topics inventory);
        # role's default is "0" because the role defaults file used to
        # self-reference and produced a recursive-template loop.
        molyanov_telegram_ops_topic_id: "{{ vault_telegram_ops_thread_id | default('0') }}"
        molyanov_skills_path: "/opt/molyanov/skills"
        molyanov_pk_guard_enabled: true

    # Phase 6: Attestation + MCP (DESCOPED 2026-05 — disabled by default).
    # The role still runs every deploy but installs only no-op stub hooks when
    # `mnemonic_mcp_enabled` is false. Flip to true once the local Mnemonic MCP
    # server is production-ready (backlog: work/mnemonic-attestation-integration/).
    - role: mnemonic-mcp
      tags: [mnemonic-mcp, attestation]
      vars:
        # Don't restate mnemonic_mcp_enabled here — referencing the same
        # var name on the LHS produced a Jinja recursive-template loop
        # ("{{ mnemonic_mcp_enabled | default(false) }}" expands to itself —
        # run 26228514662). The role default (defaults/main.yml) already
        # pins it to false; operator overrides via group_vars or CLI.
        mnemonic_mcp_install_dir: "/opt/mnemonic-mcp"
        mnemonic_mcp_hooks:
          - post-deploy.sh
          - post-feature.sh
          - post-merge.sh
          - post-rollback.sh
          - pre-deploy.sh

    - role: universal-paywall-staging
      tags: [universal-paywall-staging, paywall-staging]
      vars:
        universal_paywall_staging_enabled: "{{ vault_universal_paywall_staging_enabled | bool }}"
        universal_paywall_staging_facilitator_key: "{{ vault_universal_paywall_staging_facilitator_key }}"
        universal_paywall_staging_service_api_key: "{{ vault_universal_paywall_staging_service_api_key }}"
        universal_paywall_staging_receipt_private_key_pem: "{{ vault_universal_paywall_staging_receipt_private_key_pem }}"
        universal_paywall_staging_mcp_jwt_secret: "{{ vault_universal_paywall_staging_mcp_jwt_secret }}"
        universal_paywall_staging_mcp_refresh_salt: "{{ vault_universal_paywall_staging_mcp_refresh_salt }}"
        universal_paywall_staging_mnemonic_keypair_json: "{{ vault_universal_paywall_staging_mnemonic_keypair_json }}"
        universal_paywall_staging_domain: "{{ vault_universal_paywall_staging_domain }}"
        universal_paywall_staging_arc_rpc_url: "{{ vault_universal_paywall_staging_arc_rpc_url }}"
        universal_paywall_staging_pay_to: "{{ vault_universal_paywall_staging_pay_to }}"
        universal_paywall_staging_facilitator_url: "{{ vault_universal_paywall_staging_facilitator_url }}"
        universal_paywall_staging_solana_rpc_url: "{{ vault_universal_paywall_staging_solana_rpc_url }}"
        universal_paywall_staging_irys_url: "{{ vault_universal_paywall_staging_irys_url }}"

    # Phase 7: Fabric services deployment
    - role: fabric-services
      tags: [fabric-services, deploy]
      vars:
        # cloud-init created `op`; default `operator` doesn't exist.
        base_operator_user: op
        # The fabric/ source tree lives at the repo root, two levels up
        # from this playbook (infrastructure/ansible/playbooks/). Compute
        # absolute path on the controller. Was previously lookup(env, PWD)
        # which depended on the runner's shell cwd.
        fabric_repo_checkout: "{{ playbook_dir | dirname | dirname | dirname }}"
        fabric_target_dir: "/opt/fabric"
        # Listen on the tailnet IP so telegram-ai-agent (same VM) and the
        # Ansible probe can reach workspace-manager on
        # http://<tailnet_ip>:8080/health (run 26265249454: probe to
        # 100.x:8080 got connection refused while service bound 127.0.0.1).
        # tailscale_ip is set by the tailscale role earlier in the play.
        workspace_manager_listen_ip: "{{ tailscale_ip }}"
        workspace_manager_listen_port: 8080
        # Symphony orchestrator config — secrets pass through to
        # /etc/symphony.env via the role's templates/symphony.env.j2.
        # github_pats is the named-token registry; bearer + chat_id +
        # bot token power the Telegram-mirror notifications. Empty
        # defaults are accepted: Symphony falls back to legacy mode.
        github_pats: "{{ sops.github_pats | default({}) }}"
        kaneo_mcp_bearer: "{{ sops.kaneo_mcp_bearer | default('') }}"
        telegram_forum_chat_id: "{{ sops.telegram_forum_chat_id | default('') }}"
        telegram_bot_token: "{{ sops.telegram_bot_token | default('') }}"
        workspace_manager_capacity: 10
        workspace_manager_sccache_enabled: true
        fabric_services:
          - name: workspace-manager
            systemd_unit: workspace-manager.service
          - name: fabric-watchdog
            systemd_timer: fabric-watchdog.timer
            systemd_unit: fabric-watchdog.service

    # Phase 7.5: Content publisher install scaffold
    # Lays down the filesystem + venv + systemd unit foundation for the
    # publish worker. Wave 1 of work/content-publish-pipeline — the
    # Python entrypoint package (`content_publisher.main`) is installed
    # in Wave 2 / Task 7. Until then the unit is `enabled / inactive`.
    # Runs between fabric-services (uses op user, /opt layout) and
    # telegram-ai-agent (bot that writes to the queue), so all required
    # dirs + env-files exist by the time the bot starts.
    - role: content-publisher
      tags: [content-publisher, deploy]
      vars:
        base_operator_user: op
        # All sensitive inputs use vault_* facts (mapped from sops in
        # pre_tasks above). Fail-loud: the role's preflight asserts
        # reject empty bot tokens, HMAC secrets, and 40-char SHAs —
        # passing default('') here would silently degrade to runtime
        # failures, so we DELIBERATELY do not add fallbacks.
        # Pinned upstream refs (Decision 11).
        blogger_repo_ref: "{{ vault_blogger_repo_ref }}"
        claude_blog_repo_ref: "{{ vault_claude_blog_repo_ref }}"
        # Publisher bot + HMAC + auto-mode secrets (Decisions 5, 7, 9).
        blogger_telegram_bot_token: "{{ vault_blogger_telegram_bot_token }}"
        blogger_telegram_channel: "{{ vault_blogger_telegram_channel }}"
        # Primary source is the thread id created idempotently by
        # telegram-init in this same deploy. The sops key remains only as a
        # backward-compatible fallback for existing/manual environments.
        blogger_prompts_topic_id: "{{ telegram_topics['blogger-prompts'] | default(vault_blogger_prompts_topic_id) }}"
        publish_callback_hmac_secrets: "{{ vault_publish_callback_hmac_secrets }}"
        publish_mode: "{{ vault_publish_mode }}"
        publish_auto_mode_token: "{{ vault_publish_auto_mode_token }}"
        publish_auto_mode_token_confirm: "{{ vault_publish_auto_mode_token_confirm }}"
        publish_min_score: "{{ vault_publish_min_score }}"
        publish_approval_timeout_min: "{{ vault_publish_approval_timeout_min }}"
        # Shared with telegram-ai-agent for operator-bot integration —
        # OPERATOR_USER_ID in /etc/blogger.env is the FIRST entry of this
        # list (Decision 13, tech-spec line 418).
        telegram_forum_chat_id: "{{ vault_telegram_forum_chat_id }}"
        telegram_ai_agent_allowed_user_ids: "{{ vault_telegram_allowed_user_ids | default([]) }}"
        # mnemonic_mcp_binary is set as a fact by the mnemonic-mcp role
        # (Task 2) earlier in this play. The role's blogger.mcp.json.j2
        # consumes it directly. No mapping needed here.

    # Phase 8: Telegram AI agent
    - role: telegram-ai-agent
      tags: [telegram-ai-agent, bot]
      vars:
        telegram_ai_agent_repo_url: "{{ vault_telegram_ai_agent_repo | default('https://github.com/pavel-molyanov/telegram-ai-agent.git') }}"
        telegram_ai_agent_ref: "{{ vault_telegram_ai_agent_ref | default('main') }}"
        telegram_ai_agent_install_dir: "/opt/telegram-ai-agent"
        # Auth: claude CLI (subprocess engine) picks up CLAUDE_CODE_OAUTH_TOKEN
        # from .env. Do NOT cross-stuff that OAuth token into ANTHROPIC_API_KEY
        # — claude prefers ANTHROPIC_API_KEY when set and the API endpoint
        # rejects sk-ant-oat01-... tokens with "Invalid API key", masking the
        # working OAuth path. Pass anthropic_api_key only when sops actually
        # carries a real sk-ant-api03-... key (pay-per-token fallback).
        telegram_bot_token: "{{ vault_telegram_bot_token }}"
        anthropic_api_key: "{{ vault_anthropic_api_key | default('') }}"
        claude_code_oauth_token: "{{ vault_claude_code_oauth_token | default('') }}"
        # Kaneo MCP wiring — empty on first deploy; operator runs
        # scripts/pair-kaneo.py on the VM to obtain a 30-day session
        # bearer, then copies kaneo_mcp_url + kaneo_mcp_bearer into sops
        # so subsequent redeploys preserve it.
        kaneo_mcp_url: "{{ vault_kaneo_mcp_url | default('') }}"
        kaneo_mcp_bearer: "{{ vault_kaneo_mcp_bearer | default('') }}"
        # GitHub MCP — reuses the existing github_deploy_pat sops key
        # (must have at least 'repo' scope for create_repository).
        # Empty value = MCP server not injected, bot stays GitHub-free.
        github_personal_access_token: "{{ vault_github_deploy_pat | default('') }}"
        telegram_ai_agent_workspace_manager_url: "http://{{ tailscale_ip }}:8080"
        telegram_ai_agent_per_topic_config: "{{ fabric_topic_matrix | default({}) }}"
        fabric_target_dir: "/opt/fabric"
        content_publisher_data_dir: "{{ content_publisher_volume_mount }}/content-publisher"
        content_publisher_queue_path: "{{ content_publisher_volume_mount }}/content-publisher/queue.jsonl"
        blogger_prompts_topic_id: "{{ telegram_topics['blogger-prompts'] | default(vault_blogger_prompts_topic_id) }}"
        publish_callback_hmac_secrets: "{{ vault_publish_callback_hmac_secrets }}"
        publish_min_score: "{{ vault_publish_min_score }}"
        telegram_forum_chat_id: "{{ vault_telegram_forum_chat_id }}"
        # Operator allowlist. Without this, the bot's auth middleware
        # logs "Starting bot, allowed users: 0" and rejects every message
        # (run 26289095629 demonstrated the symptom). Source from sops; if
        # missing, default to empty list (bot still starts, but won't
        # respond to anyone — log line surfaces the misconfig clearly).
        telegram_ai_agent_allowed_user_ids: "{{ vault_telegram_allowed_user_ids | default([]) }}"

  post_tasks:
    - name: Verify all services are running
      block:
        - name: Check systemd services
          # mnemonic-mcp only added to the loop when the role is enabled
          # (descoped 2026-05; backlog: work/mnemonic-attestation-integration/)
          systemd:
            name: "{{ item }}"
            state: started
          register: service_check
          loop: "{{ ['workspace-manager', 'telegram-ai-agent']
                    + (['mnemonic-mcp'] if (mnemonic_mcp_enabled | default(false) | bool) else []) }}"
          failed_when: false

        - name: Report service status
          debug:
            msg: |
              Service Status Summary:
              {% for service in service_check.results %}
                {{ service.item }}: {{ 'running' if service.changed == false else 'restarted' }}
              {% endfor %}

    - name: Export deployment outputs
      set_fact:
        deployment_outputs:
          hostname: "{{ ansible_hostname }}"
          ipv4_address: "{{ ansible_default_ipv4.address }}"
          tailscale_ip: "{{ hostvars[inventory_hostname].get('tailscale_ip', 'pending') }}"
          workspace_manager_url: "http://127.0.0.1:8080"
          vaultwarden_url: "https://vault.{{ inventory_hostname }}"
          kaneo_url: "http://127.0.0.1:3000"
          deployment_timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: Display deployment summary
      debug:
        msg: |
          ====== FABRIC DEPLOYMENT COMPLETE ======
          Hostname: {{ deployment_outputs.hostname }}
          IPv4: {{ deployment_outputs.ipv4_address }}
          Workspace Manager: {{ deployment_outputs.workspace_manager_url }}
          Vaultwarden: {{ deployment_outputs.vaultwarden_url }}
          Kaneo: {{ deployment_outputs.kaneo_url }}
          Deployed: {{ deployment_outputs.deployment_timestamp }}
          =========================================
