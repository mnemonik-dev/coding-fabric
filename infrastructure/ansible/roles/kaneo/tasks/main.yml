---
- name: Assert required Kaneo secrets are present
  ansible.builtin.assert:
    that:
      - kaneo_auth_secret is defined and kaneo_auth_secret | string | length >= 32
      - kaneo_postgres_password is defined and kaneo_postgres_password | string | length >= 12
    fail_msg: |
      FATAL: Kaneo secrets missing. Provide via sops decryption (see
      deploy.yml). Required:
        kaneo_auth_secret       (JWT signing key, >= 32 chars)
        kaneo_postgres_password (>= 12 chars)
  tags: [kaneo, kaneo-secrets]

- name: Create Kaneo directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: op
    group: op
    mode: "0700"
  loop:
    - /opt/kaneo
    - "{{ kaneo_data_dir }}"
    - "{{ kaneo_data_dir }}/postgres"

- name: Generate docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/kaneo/docker-compose.yml
    owner: op
    group: op
    mode: "0600"
  register: compose_template
  notify: Restart kaneo

- name: Generate Caddy vhost snippet directly into shared conf.d host dir
  # The vaultwarden role mounts /opt/vaultwarden/caddy_conf_d → caddy's
  # /etc/caddy/conf.d (read-only). Write the snippet straight to the host
  # directory; the same file is visible inside the caddy container.
  become: true
  ansible.builtin.template:
    src: Caddyfile.snippet.j2
    dest: /opt/vaultwarden/caddy_conf_d/kaneo.conf
    owner: op
    group: op
    mode: "0644"
  register: caddyfile_snippet
  notify: Reload caddy for kaneo vhost

- name: Run docker compose to start Kaneo stack
  community.docker.docker_compose_v2:
    project_src: /opt/kaneo
    state: present
    pull: missing
  environment:
    COMPOSE_PROJECT_NAME: kaneo
  become: true
  become_user: op
  register: compose_result
  tags: [kaneo, kaneo-deploy]

- name: Add /etc/hosts entry for kaneo.<fabric>.ts → tailscale_ip
  # Mirrors the vaultwarden role pattern: the .ts custom tailnet domain
  # has no public DNS, so the probe URL won't resolve without a hosts
  # entry. The VM-local entry also lets the operator hit the same URL
  # over the tailnet.
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^[0-9.]+\\s+{{ kaneo_tailnet_domain | regex_escape }}\\s*$"
    line: "{{ tailscale_ip }} {{ kaneo_tailnet_domain }}"
    state: present

- name: Wait for Kaneo HTTP to be healthy (via Caddy on tailnet IP:8443)
  # Probe Caddy reverse-proxy that fronts Kaneo. Caddy listens on
  # `{kaneo_domain}:8443` with `tls internal` (self-signed); validate_certs
  # is false so we accept that. Probe runs ON THE VM, so the hosts entry
  # above resolves the domain to tailscale_ip locally.
  ansible.builtin.uri:
    url: "https://{{ kaneo_tailnet_domain }}:{{ vaultwarden_https_port | default(8443) }}{{ kaneo_health_endpoint }}"
    method: GET
    status_code: 200
    validate_certs: false
  register: health_result
  until: health_result.status == 200
  retries: 120
  delay: 2
  changed_when: false
  tags: [kaneo, kaneo-health]

- name: Fail if health check exceeded timeout
  ansible.builtin.fail:
    msg: |
      Kaneo health check failed after 4 minutes. Inspect:
        docker compose -f /opt/kaneo/docker-compose.yml logs --tail=200
        docker compose -f /opt/kaneo/docker-compose.yml ps
  when: health_result.status is not defined or health_result.status != 200
  tags: [kaneo, kaneo-health]

- name: Verify both Kaneo containers are running
  ansible.builtin.shell: |
    docker compose -f /opt/kaneo/docker-compose.yml ps --format json
  register: container_check
  changed_when: false
  tags: [kaneo, kaneo-health]

- name: Assert both services are up
  ansible.builtin.assert:
    that:
      - "'kaneo-postgres-1' in container_check.stdout"
      - "'kaneo-kaneo-1' in container_check.stdout"
    fail_msg: |
      Expected kaneo-postgres-1 + kaneo-kaneo-1 containers running. Got:
      {{ container_check.stdout }}
  tags: [kaneo, kaneo-health]

# Workspaces, projects, and Bearer tokens for the bot/Symphony are
# created on demand via Kaneo's MCP server (apps/api/src/mcp/) — see
# task #12. The first operator who signs in via the UI bootstraps the
# default workspace; no automation here.
