---
# Kaneo deployment configuration. All variables prefixed with kaneo_.
# Aligned 2026-05-24 with upstream usekaneo/kaneo compose.yml + .env.sample
# (Postgres-backed, port 5173, AUTH_SECRET for JWT). The previous role
# shape (SQLite, port 3030, KANEO_API_TOKEN) was for an older Kaneo
# release and broke on the current image; see git log if you need to
# resurrect that path.

# Docker image (GHCR — Docker Hub repo doesn't exist).
kaneo_image: "ghcr.io/usekaneo/kaneo:latest"

# Caddy container name (cross-role dependency with vaultwarden role) —
# must match the container name defined in the vaultwarden role's
# docker-compose. See README for cross-role contract details.
vaultwarden_caddy_container_name: "vaultwarden-caddy-1"

# Caddy vhost (tailnet-internal, internal-CA TLS).
kaneo_tailnet_domain: "kaneo.mnemonic-fabric.ts"

# Data directory (bind-mounted; postgres data lives under kaneo_data_dir/postgres).
kaneo_data_dir: "/opt/kaneo/data"

# Internal port Kaneo serves on. The image listens on 5173 by default
# (matches upstream compose.yml). Caddy reverse-proxies the tailnet
# vhost to this port.
kaneo_http_port: 5173

# Health endpoint (used for wait_for checks).
kaneo_health_endpoint: "/api/health"

# Postgres connection settings (Kaneo's only supported DB for current
# releases — SQLite was removed upstream).
kaneo_postgres_db: "kaneo"
kaneo_postgres_user: "kaneo"

# CRITICAL: Postgres password + AUTH_SECRET MUST be provided by the
# playbook via sops decryption. Neither is defined here so the role
# fails loudly if missing.
#   kaneo_postgres_password  — Postgres user password (any length;
#                              never reused outside the kaneo network)
#   kaneo_auth_secret        — JWT signing key, MUST be >= 32 chars
#                              (upstream-enforced). Without a stable
#                              value, sessions get invalidated every
#                              container restart.
# See deploy.yml task "Expose sops keys as flat vault_* facts" and
# secrets.sops.yml for sourcing.
