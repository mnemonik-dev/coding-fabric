---
operator_user: mnemonic-operator
operator_home: /home/mnemonic-operator
operator_group: "{{ operator_user }}"

mnemonic_mcp_version: "0.1.0"
mnemonic_mcp_binary_url: "https://github.com/mnemonic-ai/mnemonic-mcp/releases/download/v{{ mnemonic_mcp_version }}/mnemonic-mcp-linux-x86_64"
mnemonic_mcp_binary_sha256: "REPLACE_WITH_REAL_SHA256_BEFORE_DEPLOY"

mnemonic_mcp_install_dir: /opt/mnemonic-mcp
mnemonic_mcp_config_dir: /etc/mnemonic-mcp
mnemonic_mcp_hooks_dir: "{{ mnemonic_mcp_config_dir }}/hooks"

mnemonic_mcp_bind_host: 127.0.0.1
mnemonic_mcp_bind_port: 7777
mnemonic_mcp_mode: "local"

mnemonic_mcp_systemd_unit: mnemonic-mcp.service
mnemonic_mcp_service_user: op
mnemonic_mcp_service_group: op

mnemonic_mcp_vault_path: "vault://mnemonic/mcp-signing-key"

solana_devnet_rpc_url: "https://api.devnet.solana.com"
arweave_testnet_url: "https://testnet.arweave.net"

mnemonic_mcp_healthcheck_timeout: 10

# mnemonic_mcp_vault_path is a vault REFERENCE, not a credential;
# the actual signing key is never materialized in ansible variables
