---
dependency:
  name: galaxy
driver:
  name: docker
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible

platforms:
  - name: telegram-ai-agent-test
    image: docker.io/library/ubuntu:24.04
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroup_mode: host
    privileged: true
    command: /lib/systemd/systemd-cgroups-agent
    networks:
      - name: default
        ipv4_address: 172.28.7.10
