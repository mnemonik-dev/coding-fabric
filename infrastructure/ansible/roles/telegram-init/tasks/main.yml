---
- name: Load secrets from playbook variables
  tags: [telegram-init, secrets, always]
  block:
    - name: Validate telegram_bot_token is defined
      ansible.builtin.assert:
        that:
          - telegram_bot_token is defined
          - (telegram_bot_token | string | length) > 0
        fail_msg: "telegram_bot_token must be passed to role via playbook vars (decrypted by community.sops.load_vars)"
      no_log: true

    - name: Validate telegram_forum_chat_id is defined
      # telegram_forum_chat_id from sops is a negative integer (e.g.
      # -1003450829353); the `length` filter does not work on ints, so we
      # cast to string first (run 26213211213).
      ansible.builtin.assert:
        that:
          - telegram_forum_chat_id is defined
          - (telegram_forum_chat_id | string | length) > 0
        fail_msg: "telegram_forum_chat_id must be passed to role via playbook vars (decrypted by community.sops.load_vars)"
      no_log: true


- name: Verify bot is admin in the chat with manage_topics permission
  tags: [telegram-init, telegram-verify, always]
  block:
    - name: Get chat administrators
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_bot_token }}/getChatAdministrators"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram_forum_chat_id }}"
        status_code: [200, 400, 403, 429, 500, 502, 503, 504]
        timeout: "{{ telegram_api_timeout }}"
      register: chat_admins_response
      retries: "{{ telegram_api_retries }}"
      delay: "{{ telegram_api_delay }}"
      until: chat_admins_response.status == 200
      failed_when: chat_admins_response.status not in [200]
      no_log: true

    - name: Pause for rate limiting
      ansible.builtin.pause:
        seconds: "{{ telegram_api_rate_limit }}"

    - name: Check if bot is admin with can_manage_topics permission
      ansible.builtin.set_fact:
        bot_is_admin: "{{ chat_admins_response.json.result | selectattr('user.is_bot', 'equalto', true) | selectattr('can_manage_topics', 'equalto', true) | length > 0 }}"
      no_log: true

    - name: Fail if bot is not admin or lacks can_manage_topics
      ansible.builtin.fail:
        msg: |
          Bot is not an administrator or lacks 'can_manage_topics' permission in the chat.
          Actions required (see bootstrap-checklist.md):
          1. Add bot to the forum supergroup
          2. Promote bot to administrator with "Manage topics" permission enabled
          3. Ensure supergroup has forum mode enabled
          chat_id: {{ telegram_forum_chat_id }}
      when: not bot_is_admin

- name: Get forum topics sticker icons (for optional icon colors)
  tags: [telegram-init, telegram-topics]
  block:
    - name: Fetch forum topic icon stickers
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_bot_token }}/getForumTopicIconStickers"
        method: POST
        body_format: json
        status_code: [200, 400, 403, 429, 500, 502, 503, 504]
        timeout: "{{ telegram_api_timeout }}"
      register: icon_stickers_response
      retries: "{{ telegram_api_retries }}"
      delay: "{{ telegram_api_delay }}"
      until: icon_stickers_response.status == 200
      failed_when: icon_stickers_response.status not in [200]
      no_log: true

    - name: Pause for rate limiting
      ansible.builtin.pause:
        seconds: "{{ telegram_api_rate_limit }}"

    - name: Store available icon colors
      ansible.builtin.set_fact:
        available_icon_colors: "{{ icon_stickers_response.json.result | map(attribute='custom_emoji_id') | list }}"
      no_log: true
  rescue:
    - name: Continue without icon colors if fetch fails
      ansible.builtin.debug:
        msg: "Warning: Failed to fetch forum topic icon stickers; continuing without custom icon colors"

    - name: Set empty icon colors on fetch failure
      ansible.builtin.set_fact:
        available_icon_colors: []

- name: Discover existing topics from persisted VM-local state
  tags: [telegram-init, telegram-topics]
  # Telegram Bot API does NOT expose getForumTopics — and createForumTopic
  # IS NOT idempotent (it creates a NEW thread every call, even with the
  # same name). Without state, every redeploy created 8 fresh duplicate
  # topics. Persist the name → thread_id map on the VM at
  # /etc/fabric/telegram-topics.yml after first deploy; re-read it on
  # subsequent runs and gate the create task on absence.
  block:
    - name: Ensure /etc/fabric exists for state file
      become: true
      ansible.builtin.file:
        path: /etc/fabric
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Check for persisted topic-id state file
      become: true
      ansible.builtin.stat:
        path: /etc/fabric/telegram-topics.yml
      register: topic_state_stat

    - name: Read persisted topic-id map (if any)
      become: true
      ansible.builtin.slurp:
        src: /etc/fabric/telegram-topics.yml
      register: topic_state_blob
      when: topic_state_stat.stat.exists

    - name: Initialize topic mapping from persisted state or empty
      ansible.builtin.set_fact:
        existing_topics: >-
          {{ (topic_state_blob.content | b64decode | from_yaml).telegram_topics
             if (topic_state_stat.stat.exists)
             else {} }}

    - name: Log existing topic mapping
      ansible.builtin.debug:
        msg: "Existing topics from VM state: {{ existing_topics | length }} found ({{ existing_topics.keys() | list }})"

- name: Create canonical topics with icon colors mapping
  tags: [telegram-init, telegram-topics]
  block:
    - name: Define canonical topics with icon colors
      ansible.builtin.set_fact:
        canonical_topics: >-
          {%- set topics = {} -%}
          {%- for topic in telegram_topics | default([]) -%}
            {%- set name = topic.name -%}
            {%- set color = topic.color
                | default(telegram_topic_icon_colors[name] | default(255)) -%}
            {%- set _ = topics.update({name: {'color': color}}) -%}
          {%- endfor -%}
          {{ topics }}

    - name: Initialize topic creation results
      ansible.builtin.set_fact:
        telegram_topics: {}

    - name: Create or skip topics (loop via include_tasks — block cannot loop directly)
      ansible.builtin.include_tasks: create-or-skip-topic.yml
      loop: "{{ canonical_topics.keys() | list }}"
      loop_control:
        loop_var: topic_name

- name: Persist topic mapping on VM (source of truth for subsequent deploys)
  tags: [telegram-init, telegram-topics]
  # /etc/fabric/telegram-topics.yml is the authoritative record of
  # name → message_thread_id. Subsequent role runs read this file to
  # skip already-existing topics and avoid the duplicate spam.
  become: true
  ansible.builtin.copy:
    dest: /etc/fabric/telegram-topics.yml
    owner: root
    group: root
    mode: '0644'
    content: |
      # Auto-generated by telegram-init role. Edit manually only if a
      # topic was created out-of-band (admin UI) and you want subsequent
      # deploys to skip it.
      telegram_topics:
      {% for n in (telegram_topics | dict2items | sort(attribute='key')) %}
        {{ n.key | quote }}: {{ n.value }}
      {% endfor %}

- name: Render inventory file with topic mapping
  tags: [telegram-init, telegram-topics]
  block:
    - name: Ensure inventory directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../inventory"
        state: directory
        mode: "0755"

    - name: Render telegram-topics.yml from template
      ansible.builtin.template:
        src: topics.yml.j2
        dest: "{{ playbook_dir }}/../../inventory/telegram-topics.yml"
        mode: "0644"
        owner: root
        group: root
      vars:
        topics_mapping: "{{ telegram_topics }}"
      register: template_render_result

    - name: Log template render status
      ansible.builtin.debug:
        msg: "Topics inventory {{ 'updated' if template_render_result.changed else 'unchanged' }}: {{ playbook_dir }}/../../inventory/telegram-topics.yml"

- name: Healthcheck - post and delete test message to ops topic
  tags: [telegram-init, telegram-health]
  block:
    - name: Send test message to ops topic
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_bot_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram_forum_chat_id }}"
          message_thread_id: "{{ telegram_topics['ops'] }}"
          text: "Healthcheck: telegram-init role executing"
        status_code: [200, 400, 403, 429, 500, 502, 503, 504]
        timeout: "{{ telegram_api_timeout }}"
      register: test_message_response
      retries: "{{ telegram_api_retries }}"
      delay: "{{ telegram_api_delay }}"
      until: test_message_response.status == 200
      failed_when: test_message_response.status not in [200]
      no_log: true

    - name: Store message ID for deletion
      ansible.builtin.set_fact:
        test_message_id: "{{ test_message_response.json.result.message_id }}"
      no_log: true

    - name: Wait before deleting test message
      ansible.builtin.pause:
        seconds: 5

    - name: Delete test message
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_bot_token }}/deleteMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram_forum_chat_id }}"
          message_id: "{{ test_message_id }}"
        status_code: [200, 400, 403, 429, 500, 502, 503, 504]
        timeout: "{{ telegram_api_timeout }}"
      retries: "{{ telegram_api_retries }}"
      delay: "{{ telegram_api_delay }}"
      until: "deleteMessage_response.status in [200, 400]"
      register: deleteMessage_response
      failed_when: false
      no_log: true

    - name: Verify delete message success or acceptable 400 (already deleted)
      ansible.builtin.assert:
        that:
          - deleteMessage_response.status == 200 or (deleteMessage_response.status == 400 and 'not found' in deleteMessage_response.json.description | default(''))
        fail_msg: "Failed to delete test message: {{ deleteMessage_response.json.description | default('unknown error') }}"
      no_log: true
  rescue:
    - name: Log healthcheck failure (non-fatal)
      ansible.builtin.debug:
        msg: "Warning: Healthcheck message send/delete failed, but role continues (this may indicate network issues or permission problems)"

- name: Log completion
  tags: [telegram-init, always]
  ansible.builtin.debug:
    msg: |
      telegram-init role completed successfully.
      Created/verified {{ telegram_topics | length }} topics.
      Topics mapping saved to: infrastructure/ansible/inventory/telegram-topics.yml
