---
- name: Converge
  hosts: all
  become: true
  vars:
    fabric_hostname: mnemonic-fabric
    # NOTE: In real deployment, tailscale_authkey comes from sops-encrypted secrets.
    # For molecule test, we use a dummy test key. NEVER replace this with a real tskey-...
    # in version control; the test key triggers a skip guard in the role.
    tailscale_authkey: "tskey-dummy-key-for-testing"
    # Disable route acceptance in test to avoid spurious network errors
    tailscale_accept_routes: false
  roles:
    - role: tailscale
