---
# Action rehearse (How it works step 2, D7, D19): the full deal on loopback
# Anvil with the real instance-ionet.json, then the refund scenario.
- name: Require max_cost
  ansible.builtin.include_tasks: max_cost.yml

- name: Require the pinned commit and the expected image ID
  ansible.builtin.assert:
    that:
      - warrant_canary_src_commit | length > 0
      - _wc_expected_image_id | trim | length > 0
    fail_msg: "rehearse needs warrant_canary_src_commit and the expected image ID (sops)."
    quiet: true

- name: Rehearsal facts
  ansible.builtin.set_fact:
    _wc_anvil_url: "http://127.0.0.1:{{ warrant_canary_anvil_port }}"
    _wc_anvil_pidfile: "{{ _wc_records_dir }}/anvil.pid"
    warrant_canary_keystore_roles: [deployer, buyer, seller, relayer]
    warrant_canary_password_roles: [deployer, buyer, seller, relayer]

- name: Make sure the local run parent exists
  ansible.builtin.file:
    path: "{{ warrant_canary_canary_dir }}/local"
    state: directory
    mode: "0755"

- name: Refuse while keys are staged
  ansible.builtin.include_tasks: not_staged.yml

- name: Rehearse with keys staged and Anvil running
  block:
    - name: Stage all four keystores and passwords
      ansible.builtin.include_tasks: stage.yml

    - name: Start loopback Anvil (chain 31337)
      ansible.builtin.shell: >-
        nohup setsid anvil --host 127.0.0.1 --port {{ warrant_canary_anvil_port }}
        --chain-id {{ warrant_canary_anvil_chain_id }}
        > {{ (_wc_records_dir ~ '/anvil.log') | quote }} 2>&1 < /dev/null &
        echo $! > {{ _wc_anvil_pidfile | quote }}
      environment: "{{ _wc_env }}"
      changed_when: true

    - name: Wait for Anvil
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ warrant_canary_anvil_port }}"
        timeout: 30

    - name: Run the rehearsal chain (rehearse.py)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ _wc_bin }}/rehearse.py"
          - --src
          - "{{ warrant_canary_src_dir }}"
          - --local-dir
          - "{{ warrant_canary_canary_dir }}/local"
          - --anvil-key
          # Anvil's well-known public dev account 0; holds only local test ETH.
          - "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          - --instance
          - "{{ warrant_canary_instance_rel }}"
          - --commit
          - "{{ warrant_canary_src_commit }}"
          - --expected-image-id
          - "{{ _wc_expected_image_id | trim }}"
          - --pw-dir
          - "{{ warrant_canary_tmpfs_dir }}/pw"
          - --bin-dir
          - "{{ _wc_bin }}"
          - --addresses
          - >-
            {{ {'deployer': warrant_canary_address_deployer, 'buyer': warrant_canary_address_buyer,
                'seller': warrant_canary_address_seller, 'relayer': warrant_canary_address_relayer} | to_json }}
          - --health-targets
          - "{{ _wc_health_targets | to_json }}"
          - --health-before
          - "{{ _wc_records_dir }}/health-before.json"
          - --stopped-file
          - "{{ warrant_canary_stopped_services_file }}"
          - --chain-id
          - "{{ warrant_canary_anvil_chain_id }}"
          - --amount
          - "{{ warrant_canary_amount }}"
          - --max-cost
          - "{{ warrant_canary_max_cost }}"
          - --accept-window
          - "{{ warrant_canary_accept_window }}"
          - --settle-window
          - "{{ warrant_canary_settle_max }}"
          - --refund-accept-window
          - "{{ warrant_canary_refund_accept_window }}"
          - --refund-settle-window
          - "{{ warrant_canary_refund_settle_window }}"
      environment: "{{ _wc_env | combine({'WARRANT_CANARY_RPC': _wc_anvil_url}) }}"
      register: _wc_rehearsal

    - name: Rehearsal result
      ansible.builtin.set_fact:
        _wc_rehearsal_result: "{{ _wc_rehearsal.stdout_lines | last | from_json }}"

    - name: Fetch the rehearsal records
      ansible.builtin.include_tasks: fetch_outputs.yml
      vars:
        _wc_fetch_list:
          - "{{ _wc_rehearsal_result.run }}/rehearsal.md"
          - "{{ _wc_rehearsal_result.run }}/rehearsal.json"
          - "{{ _wc_rehearsal_result.run }}/prove.time"
          - "{{ _wc_rehearsal_result.run }}/wrap-stats.log"
          - "{{ _wc_rehearsal_result.run }}/arc-before.json"
          - "{{ _wc_rehearsal_result.run }}/arc-after.json"

  always:
    - name: Stop Anvil
      ansible.builtin.shell: >-
        if [ -f {{ _wc_anvil_pidfile | quote }} ]; then
        kill "$(cat {{ _wc_anvil_pidfile | quote }})" 2>/dev/null || true;
        rm -f {{ _wc_anvil_pidfile | quote }}; fi;
        pkill -f '[a]nvil --host 127.0.0.1 --port {{ warrant_canary_anvil_port }}' || true
      changed_when: false

    - name: Unstage (unconditional, no state gate)
      ansible.builtin.include_tasks: unstage_cleanup.yml

- name: Report
  ansible.builtin.debug:
    msg: "Rehearsal green: {{ _wc_rehearsal_result | to_json }}"
