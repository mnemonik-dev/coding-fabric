---
# Mnemonik MCP server install + run. Distribution channel: scoped npm package
# `@mnemonik-xyz/mcp`; the binary ships inside the package and is templated
# everywhere via the discovered fact `mnemonic_mcp_binary` (see tasks/main.yml).
#
# The binary spelling has drifted across versions (`mnemonik-mcp` with K on
# 0.2.4 — current upstream — vs `mnemonic-mcp` without K on older builds).
# Don't hardcode it; the discovery cascade `which mnemonik-mcp || which
# mnemonic-mcp` resolves whichever name the pinned version actually shipped.
mnemonic_mcp_enabled: true

# npm distribution channel — pinned to a specific version so the root package
# is reproducible. Transitive dependencies are pinned via the checked-in
# files/package-lock.json (consumed by `npm ci`).
mnemonik_mcp_npm_package: "@mnemonik-xyz/mcp"
mnemonik_mcp_npm_version: "0.2.4"

# Where the role drops package.json + package-lock.json for the `npm ci` step.
# The binary itself lands on PATH (npm global prefix, typically /usr/local/bin)
# regardless of this path.
mnemonik_mcp_install_dir: /opt/mnemonik-mcp

# systemd identity
mnemonic_mcp_systemd_unit: mnemonic-mcp.service
mnemonic_mcp_service_user: op
mnemonic_mcp_service_group: op
