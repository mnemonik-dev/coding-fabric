---
# Install + run the Mnemonik MCP server from the npm scoped package
# `@mnemonik-xyz/mcp@<version>`. After install, discover the actual binary
# name (drifted between `mnemonik-mcp` and `mnemonic-mcp` across versions)
# and expose it as fact `mnemonic_mcp_binary` for downstream roles (Task 3
# templates `/etc/blogger.mcp.json` from this fact).

- name: Mnemonik MCP install + configure
  when: mnemonic_mcp_enabled | bool
  block:
    - name: Ensure op service user exists
      ansible.builtin.user:
        name: "{{ mnemonic_mcp_service_user }}"
        group: "{{ mnemonic_mcp_service_group }}"
        home: /var/lib/mnemonic-mcp
        shell: /usr/sbin/nologin
        system: true
        createhome: true

    - name: Ensure Mnemonik MCP install dir exists
      ansible.builtin.file:
        path: "{{ mnemonik_mcp_install_dir }}"
        state: directory
        owner: "{{ mnemonic_mcp_service_user }}"
        group: "{{ mnemonic_mcp_service_group }}"
        mode: "0755"

    # ------------------------------------------------------------------
    # Node.js prerequisite (pattern lifted from
    # roles/telegram-ai-agent/tasks/main.yml:63-88).
    # ------------------------------------------------------------------
    - name: Check whether node is already on PATH
      ansible.builtin.command: node --version
      register: mnemonik_node_check
      changed_when: false
      failed_when: false

    - name: Register NodeSource APT repository (setup_20.x)
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args:
        executable: /bin/bash
      when: mnemonik_node_check.rc != 0
      changed_when: true

    - name: Install Node.js (provides node + npm)
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true
      when: mnemonik_node_check.rc != 0

    # ------------------------------------------------------------------
    # Pin transitive deps via the checked-in lockfile, then global-install
    # the scoped package at the pinned version. `npm ci` against the
    # lockfile is the supply-chain hardening anchor (R2-8); the subsequent
    # `community.general.npm` global install is what puts the binary on
    # PATH at a system-wide location.
    # ------------------------------------------------------------------
    - name: Copy package.json into install dir
      ansible.builtin.copy:
        content: |
          {
            "name": "mnemonik-mcp-deploy",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "{{ mnemonik_mcp_npm_package }}": "{{ mnemonik_mcp_npm_version }}"
            }
          }
        dest: "{{ mnemonik_mcp_install_dir }}/package.json"
        owner: "{{ mnemonic_mcp_service_user }}"
        group: "{{ mnemonic_mcp_service_group }}"
        mode: "0644"

    - name: Copy pinned package-lock.json into install dir
      ansible.builtin.copy:
        src: package-lock.json
        dest: "{{ mnemonik_mcp_install_dir }}/package-lock.json"
        owner: "{{ mnemonic_mcp_service_user }}"
        group: "{{ mnemonic_mcp_service_group }}"
        mode: "0644"
      register: mnemonik_lockfile_copy

    - name: Install pinned tree via npm ci (local — supply-chain anchor)
      ansible.builtin.command:
        chdir: "{{ mnemonik_mcp_install_dir }}"
        cmd: npm ci --no-audit --no-fund
      register: mnemonik_npm_ci
      changed_when: mnemonik_npm_ci.rc == 0 and 'up to date' not in (mnemonik_npm_ci.stdout | default(''))

    - name: Install Mnemonik MCP globally (puts binary on PATH)
      community.general.npm:
        name: "{{ mnemonik_mcp_npm_package }}"
        version: "{{ mnemonik_mcp_npm_version }}"
        global: true
        state: present

    # ------------------------------------------------------------------
    # Binary-name discovery. Cascade tolerates `mnemonik-mcp` (current,
    # `@mnemonik-xyz/mcp@0.2.4`) and the older `mnemonic-mcp` spelling.
    # The fact is consumed by the systemd template here and by
    # `/etc/blogger.mcp.json` in the content-publisher role (Task 3).
    # ------------------------------------------------------------------
    - name: Discover installed Mnemonik MCP binary name
      ansible.builtin.shell: |
        set -euo pipefail
        which mnemonik-mcp || which mnemonic-mcp
      args:
        executable: /bin/bash
      register: mnemonik_which
      changed_when: false
      failed_when: mnemonik_which.rc != 0

    - name: Set mnemonic_mcp_binary fact for downstream roles
      ansible.builtin.set_fact:
        mnemonic_mcp_binary: "{{ mnemonik_which.stdout | trim }}"

    - name: Render systemd unit for Mnemonik MCP
      ansible.builtin.template:
        src: mnemonic-mcp.service.j2
        dest: /etc/systemd/system/{{ mnemonic_mcp_systemd_unit }}
        owner: root
        group: root
        mode: "0644"
      notify: reload mnemonic-mcp systemd

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable + start mnemonic-mcp service
      ansible.builtin.systemd:
        name: "{{ mnemonic_mcp_systemd_unit }}"
        enabled: true
        state: started

    - name: Wait for mnemonic-mcp to become active
      ansible.builtin.systemd:
        name: "{{ mnemonic_mcp_systemd_unit }}"
      register: mnemonik_active
      until: mnemonik_active.status.ActiveState == 'active'
      retries: 5
      delay: 2

    # ------------------------------------------------------------------
    # Smoke: MCP-stdio JSON-RPC initialize handshake. Replaces the bogus
    # `--selftest` probe; this proves the binary actually speaks MCP over
    # stdio (Decision 3 + Architecture step 4). Full payload via stdin —
    # nothing of substance in argv (R2 — no `ps` leakage).
    - name: Smoke MCP-stdio initialize handshake
      ansible.builtin.shell: |
        set -euo pipefail
        payload='{"jsonrpc":"2.0","id":1,"method":"initialize",'
        payload+='"params":{"protocolVersion":"2024-11-05",'
        payload+='"capabilities":{},'
        payload+='"clientInfo":{"name":"role-smoke","version":"0.1"}}}'
        printf '%s\n' "$payload" \
          | "{{ mnemonic_mcp_binary }}" mcp-stdio \
          | head -1 \
          | python3 -c 'import json,sys; r=json.loads(sys.stdin.read()); assert "protocolVersion" in r.get("result", {}), r'
      args:
        executable: /bin/bash
      register: mnemonik_smoke
      changed_when: false
      failed_when: mnemonik_smoke.rc != 0
